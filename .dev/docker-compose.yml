# Compose project name — keeps this repo's containers isolated from other repos.
# Workspace-setup's rename sets this automatically when a new project is created.
name: nestled-template

# Host-side port bindings are env-driven so several repos' stacks can run at once — choose a
# private allocation and set the complete block from .env.example in the repo-root .env.
# Container-side ports never change.
# The vars only reach compose through scripts/dev-docker.sh, which passes the root .env with
# --env-file; compose on its own would read .dev/.env instead.
# Data lives in NESTLED_DEV_DATA_DIR, by default ./tmp beside this file. From a git worktree,
# scripts/dev-docker.sh and pnpm db-update point it at the main checkout's .dev/tmp, so the shared
# containers keep their data when the worktree is removed.
services:
  postgres:
    image: postgres:16
    container_name: nestled-template_postgres_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    volumes:
      - ${NESTLED_DEV_DATA_DIR:-./tmp}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-test:
    image: postgres:16
    container_name: nestled-template_postgres_test
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432' # Different port for test DB
    environment:
      POSTGRES_DB: nestled_template_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ${NESTLED_DEV_DATA_DIR:-./tmp}/postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - testing # Only start when testing profile is used

  redis:
    image: redis:alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ${NESTLED_DEV_DATA_DIR:-./tmp}/redis:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'
    restart: unless-stopped
