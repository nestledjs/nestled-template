fragment __AdminUserSummary on User {
  id
  createdAt
  updatedAt
  firstName
  lastName
  isSuperAdmin
  bio
  displayName
  emailValidated
  avatarId
  activeOrganizationId
  twoFactorEnabled
  twoFactorMethod
  lastSuccessfulLogin
  lastFailedLogin
  failedLoginCount
  lockedUntil
  isActive
  deactivatedAt
  termsAcceptedAt
  privacyPolicyAcceptedAt
  avatar {
    id
  }
}

fragment __AdminUserDetails on User {
  ...__AdminUserSummary
}
