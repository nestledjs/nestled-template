query __AdminLink($linkId: String!) {
  link(linkId: $linkId) {
    ...__AdminLinkDetails
  }
}

query __AdminLinks($input: ListLinkInput) {
  links(input: $input) {
    ...__AdminLinkSummary
  }
  counters: linksCount(input: $input) {
    ...CorePagingDetails
  }
}

query __AdminLinkPagination($input: ListLinkInput) {
  counters: linksCount(input: $input) {
    ...CorePagingDetails
  }
}
