query Country($countryId: String!) {
  country(countryId: $countryId) {
    ...CountryDetails
  }
}

query Countries($input: ListCountryInput) {
  countries(input: $input) {
    ...CountryList
  }
  counters: countriesCount(input: $input) {
    ...CorePagingDetails
  }
}

query CountryPagination($input: ListCountryInput) {
  counters: countriesCount(input: $input) {
    ...CorePagingDetails
  }
}
