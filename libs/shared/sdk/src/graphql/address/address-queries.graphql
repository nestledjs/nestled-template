query Address($addressId: String!) {
  address(addressId: $addressId) {
    ...AddressDetails
  }
}

query Addresses($input: ListAddressInput) {
  addresses(input: $input) {
    ...AddressList
  }
  counters: addressesCount(input: $input) {
    ...CorePagingDetails
  }
}

query AddressPagination($input: ListAddressInput) {
  counters: addressesCount(input: $input) {
    ...CorePagingDetails
  }
}
