query Link($linkId: String!) {
  link(linkId: $linkId) {
    ...LinkDetails
  }
}

query Links($input: ListLinkInput) {
  links(input: $input) {
    ...LinkList
  }
  counters: linksCount(input: $input) {
    ...CorePagingDetails
  }
}

query LinkPagination($input: ListLinkInput) {
  counters: linksCount(input: $input) {
    ...CorePagingDetails
  }
}
