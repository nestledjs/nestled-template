query Invite($inviteId: String!) {
  invite(inviteId: $inviteId) {
    ...InviteDetails
  }
}

query Invites($input: ListInviteInput) {
  invites(input: $input) {
    ...InviteList
  }
  counters: invitesCount(input: $input) {
    ...CorePagingDetails
  }
}

query InvitePagination($input: ListInviteInput) {
  counters: invitesCount(input: $input) {
    ...CorePagingDetails
  }
}
