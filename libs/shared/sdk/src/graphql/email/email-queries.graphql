query Email($emailId: String!) {
  email(emailId: $emailId) {
    ...EmailDetails
  }
}

query Emails($input: ListEmailInput) {
  emails(input: $input) {
    ...EmailList
  }
  counters: emailsCount(input: $input) {
    ...CorePagingDetails
  }
}

query EmailPagination($input: ListEmailInput) {
  counters: emailsCount(input: $input) {
    ...CorePagingDetails
  }
}
