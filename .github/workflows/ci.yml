name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NX_DAEMON: false
      # Surfaced at job scope so the SonarCloud steps below can gate on its presence.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: nestled_template_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: pnpm dlx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Install Playwright browsers for web-ui tests
      - name: Install Playwright Browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

      - run: pnpm template:validate-upgrade-notes

      - run: pnpm run nestled-doctor

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - run: pnpm exec nx affected -t lint build

      - run: pnpm exec nx run web:typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/nestled_template_test
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-only-not-production
          EMAIL_PROVIDER: mock

      - name: Normalize coverage paths
        run: pnpm coverage:normalize-lcov

      # SonarCloud stays wired in but only runs when the repo has a SONAR_TOKEN secret.
      # Clones created from this template pass CI without configuring SonarCloud; adding a
      # SONAR_TOKEN secret enables the scan automatically with no workflow edit.
      - name: Skip SonarCloud Scan (no SONAR_TOKEN)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not configured; skipping SonarCloud scan."

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
