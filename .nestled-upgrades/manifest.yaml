          - pnpm exec nx test web-ui --skip-nx-cache
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec nx build web --skip-nx-cache
          - In a real browser, against the app's production build (`pnpm exec nx build web` then the app's usual start, with the API running), in this order. Keep the devtools Network tab open with "Preserve log" on; "the session cookie" is the app's VITE_COOKIE_NAME (default __session).
          - "1. Sign in. You land on the dashboard. Reload it: no flash of the login page and the header shows your name. In the API log, the reload made one `Me` call for the session (a page that reads Me for its own content may make one more)."
          - "2. Client navigation: click through three signed-in pages from the menu. Each is a `.data` request answered 200; none is a full page load, none goes to /login."
          - "3. Revalidation: on a settings page, save a profile change. The page revalidates (a `.data` request with `_routes=`) and the header shows the new name without a reload."
          - "4. API down, private page: stop the API (keep the web running). Reload a signed-in page: the \"server trouble\" screen appears (HTTP 503), not the login page, and the session cookie is still there. Click a menu link: still that screen, no redirect. Start the API again: within a minute the page recovers by itself (or at once on \"Try again\"), still signed in, with no sign-in."
          - "5. API down, public page: with the API stopped and still signed in, open a public page (the home page, /pricing). It renders; the header shows neither your account menu nor \"Log in\", only the theme toggle. Start the API again and stay on the page: the account menu appears by itself within about 30 s, with no reload."
          - "6. API down, then a 401 just after: stop the API, reload a private page (the 503 screen), start the API, then within 30 s revoke the session (as in step 7) and reload. The session is kept (the 503 screen again, or the page); only a reload more than 30 s after the API came back signs out. This is the outage memory: a 401 just after an outage is not trusted."
          - "7. Revoked session signs out once: sign in, then revoke that session from outside this browser (sign in as the same user in a private window or another browser and change the password, which ends the user's other sessions; or delete the session's row in the API's database). Do not sign out in another tab of the same browser: that clears the shared cookie, which is \"no session\", not a rejected one. Wait 30 s after any API restart, then click a menu link. You land on /force-logout and then /login (or SESSION_REJECTED_PATH), exactly once: one 202 `.data` redirect with reload, one document load of /force-logout, then /login. No loop, no second redirect, and the session cookie is gone (both the domain one and the host-only one, in Application > Cookies). Do the same with a reload instead of a click: one 302 to /force-logout."
          - "8. Revoked session on a public page: revoke as in step 7, then open a public page. It renders signed out (the \"Log in\" link shows) with no redirect, and the response's Set-Cookie expires the session cookie."
          - "9. Emulation start and end (skip if the app has no emulation): as a super admin, emulate a user from the admin users page. The page reloads into the emulated session: the header shows the emulated user and the emulation banner, with no visit to /login or /force-logout. End the emulation from the banner: back as the admin, signed in, on the admin page, again with no sign-in and no /force-logout in the Network log."
          - "10. Offline: with devtools set to Offline, click a menu link: the \"you're offline\" screen, no redirect; back online, the page recovers."
        skipIf:
          - The project has no web app.
        agentHints:
          - "Port in the order of the intent: the codemod first (it is mechanical, and the rest typechecks against RouterContextProvider), then the lib's session folder, then the web session module, then the wiring, then the deletions; run `pnpm verify:session-decisions` last and work through its list. Do not keep any of the old deciders \"for safety\": two deciders are the defect."
          - "apps/web/tests/session/session-middleware.spec.tsx is the proof: it runs the real root module and entry.server through React Router's request handler in production mode, with the production Apollo client against a stubbed fetch, for document, `.data` and both revalidation shapes. Port it first and make it pass against the app's own root; its `build()` helper names the routes (private, members, public) so add the app's own private layout in place of 'routes/private'."
          - "`getSession(context)` throws if the middleware did not run (a spec calling a loader with a bare context, or a route whose module the root does not wrap): give the spec `withSession(...)` from apps/web/tests/helpers/session-context.ts. `requireUser(context)` throws outside `requireSession`; that is a programming error, never a sign-out."
          - Route middleware also runs for resource routes. If the app has a resource route that is called without a session and must not wait for Me (a health probe), add its pattern to `SESSIONLESS_PATTERNS`, or its latency gains a Me call.
          - "The outage memory is per web instance: with several replicas, a 401 just after an outage may be trusted by a replica that did not see the outage. That only removes the extra guard; the confirming second Me call still applies."
          - A loader of the app's own that catches an API error and returns a fallback (`[]`, `null`) for a failed read hides an outage as "nothing there". The audit flags it for organizations; check the app's other list loaders by hand and let them throw `narrowApiError(error)`.
