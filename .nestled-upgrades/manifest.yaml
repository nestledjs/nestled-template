  - id: 2026.10.21
    date: 2026-10-26
    title: MCP v2 SDK and protocol 2026-07-28
    templateCommit: 4aab0bf
    notes:
      - id: 2026-10-25-mcp-sdk-v2-and-2026-07-28
        title: The MCP plugin moves to the v2 SDK and serves MCP 2026-07-28 (server/discover, Client ID Metadata Documents) next to the 2025-era flow
        delivery: code-patch
        intent: "The MCP plugin (libs/api/custom/src/lib/plugins/mcp) moves from the v1 SDK (@modelcontextprotocol/sdk) to the v2 packages and serves protocol revision 2026-07-28 next to the 2025-era flow, from the same stateless `/api/mcp` endpoint. OAuth gains Client ID Metadata Documents (CIMD) and keeps Dynamic Client Registration (DCR). Session and browser auth are not touched. Package changes in the root package.json (template promotion does not mirror package.json, so make them by hand, then run `pnpm install` so pnpm-lock.yaml follows): remove `\"@modelcontextprotocol/sdk\"` from dependencies; add `\"@modelcontextprotocol/server\": \"^2.4.0\"` and `\"zod-v4\": \"npm:zod@^4.6.7\"` to dependencies; add `\"@modelcontextprotocol/client\": \"^2.4.0\"` to devDependencies (the specs drive the endpoint with the real SDK client); keep `\"zod\": \"3.25.56\"`; and add `\"zod@<4\": \"3.25.56\"` to `pnpm.overrides`. The v2 SDK only converts zod >= 4.2 schemas, while @nestledjs/forms and @nestledjs/forms-core peer-depend on zod ^3. With a zod 4 in the lockfile, pnpm resolves those peers to it silently; the override keeps them on 3.25.56. After install, `grep \"(zod@\" pnpm-lock.yaml` must show only `zod@3.25.56`. Transport (mcp.controller.ts, new mcp-transport.ts). Every POST is still served by a server built for that request and caller, and closed after it answers: no sessions, no `Mcp-Session-Id`, no long-lived connections. A request carrying the 2026-07-28 `_meta` envelope goes to the SDK's `createMcpHandler` (`legacy: 'reject'`, `responseMode: 'json'`, `maxSubscriptions: 0`), which implements `server/discover`, per-request version negotiation (-32022 for an unsupported version), the `MCP-Protocol-Version`/`Mcp-Method`/`Mcp-Name` header checks (-32020), `resultType`, and the `ttlMs`/`cacheScope` cache fields. Any other request is 2025-era and keeps the existing JSON transport (JsonRequestTransport, moved to mcp-transport.ts) with unchanged responses: plain JSON bodies, batches, no `Accept: text/event-stream` requirement. `isLegacyRequest` from the SDK makes the split. The caller reaches the per-request factory through `AuthInfo.extra`. The server advertises `tools.listChanged: false`, and `subscriptions/listen` is refused in-band, so no response is ever a held-open stream. A `401` for a bearer token that authenticated no one now carries `error=\"invalid_token\"`. A Host or X-Forwarded-Host that cannot form a URL gets `400 Invalid request host` instead of a 500. Wherever the MCP base URL, issuer or resource is derived from a request, a comma-separated X-Forwarded-Proto or X-Forwarded-Host (a proxy chain) contributes its first entry, trimmed. Tools (tools/*.ts, mcp-server.factory.ts). `McpServer` comes from `@modelcontextprotocol/server`, `z` from `zod-v4`, and each `inputSchema` is a `z.object({...})` (`z.object({})` for a tool without arguments) instead of a raw shape. Discovery (new mcp-well-known.ts, apps/api/src/main.ts). The `401` challenge names `/.well-known/oauth-protected-resource/api/mcp`, which the API did not serve: it is outside the `api` prefix and the early request filter refused it. A small Express middleware, `mcpRootWellKnownRewrite`, mounted in main.ts just before `earlyRequestFilter`, now serves it and `/.well-known/oauth-authorization-server/api/mcp` and `/.well-known/openid-configuration/api/mcp` (the first two locations a 2026-07-28 client tries for an issuer with a path) from the existing `/api/mcp/.well-known/*` routes. No route, controller, public-operation or guard-baseline entry is added. OAuth (mcp-oauth.controller.ts, mcp-oauth.service.ts, new mcp-client-metadata.ts). The authorization server metadata adds `client_id_metadata_document_supported: true` and `authorization_response_iss_parameter_supported: true`, and keeps `registration_endpoint`. `/authorize` accepts as `client_id` either a DCR client or the HTTPS URL of a Client ID Metadata Document. The document is fetched only after the user has signed in, with a bounded fetch (https only; the host is resolved once, with a 3 s timeout and at most 2 lookups in flight so slow DNS cannot fill libuv's threadpool, every address checked public, including the IPv6 forms that embed an IPv4 address (::/96, 64:ff9b::/96, 64:ff9b:1::/48, 2002::/16) and fec0::/10; the connection is made to that checked address with the original Host and SNI, so DNS rebinding cannot redirect it; no redirects, 5 s, 5 KB, cached per Cache-Control up to 24 h); its `client_id` must equal the URL, it must name `client_name` and `redirect_uris`, and its `token_endpoint_auth_method` must be absent or `none`. No redirect URI or client_id may contain `#`, a bare trailing one included. For both kinds of client, `redirect_uri` must be one the client registered (exact match; a loopback HTTP redirect may use any port, per RFC 8252). /authorize checks that before sign-in for a DCR client, and again after sign-in, before it creates the pending authorization of the consent flow (2026-10-25-mcp-oauth-consent-and-s256-pkce, which this note builds on and replaces the minimal redirect scheme check of). The consent page still shows every client, a metadata document's included, as `verified: false`: its name is self-asserted and nothing checks its origin. Both the approval and the denial redirect carry `iss` (RFC 9207), the issuer the client saw at /authorize, recorded on the pending authorization because the decision arrives from the web app's server. `/register` (DCR) stays, and now requires 1-10 acceptable redirect URIs (https, loopback http, or a native app's private-use scheme; plain http to another host and script, file or about schemes are refused with `invalid_redirect_uri`, as is a URI over 2048 characters); the client name is trimmed and capped at 200 characters. Stored DCR registrations. Registrations were an in-process Map, lost on every restart and not shared between API instances. They are now rows of a new `McpOAuthClient` model (`/// @skipCrud`: its redirect URIs are where a client's codes may go, so they change only through registration). getClient and registerClient are async. Because anyone can call /register and every call now stores a row: it is rate limited per client IP (10 an hour, through ThrottlerGuard and the `signup` throttler AuthModule already configures, keyed on req.ip and so on TRUST_PROXY_HOPS; SIGNUP_THROTTLE_ENABLED=false turns it off with the signup limit); a registration may store at most 10 redirect URIs of at most 2048 characters and 4096 UTF-8 bytes together; `McpOAuthClient.lastUsedAt` is set when the client starts an authorization (its redirect is resolved) or redeems a code; and registrations never used within a day, or unused for 30 days, are deleted. The template has no scheduler, so registration runs that prune, at most once an hour per instance and without delaying the response. Pending authorizations and authorization codes stay in memory (they live 10 and 5 minutes): a deployment with several API instances and no sticky routing still needs a shared store for those. Token binding (RFC 8707). New `ApiToken.resource` column (`String?`, `/// @graphqlOmit`). /authorize takes an optional `resource`, which must be this server's MCP endpoint in canonical form (lowercase scheme and host, no trailing slash, no fragment); anything else gets `400 invalid_target`. It is kept through the login redirect, recorded on the pending authorization and the code, and /token refuses a `resource` that differs from the code's. Every token the MCP token endpoint now issues is bound to that URI (apiTokensService generateApiToken takes `{ resource }`; rotation keeps it). JwtStrategy refuses a bound token anywhere in the API (401), and ApiTokenAuthMiddleware, in front of the MCP endpoint, accepts it only when it names the MCP endpoint of the origin the request reached. Tokens with no resource, which is every settings token and every MCP token issued before this change, keep working exactly as before. Schema and migration (libs/api/prisma): the `ApiToken.resource` column and the `McpOAuthClient` model (with `lastUsedAt` and an index on it), in migration `20261025210000_mcp_oauth_token_resource_and_clients`. Both are additive. Tests cover the transport on both eras, discovery metadata, DCR (stored), CIMD, the resource binding, and token validation (mcp.controller.spec.ts, mcp.http.spec.ts, mcp-oauth.controller.spec.ts, mcp-oauth.service.spec.ts, mcp-client-metadata.spec.ts, mcp-resource.spec.ts, mcp-well-known.spec.ts, middleware/api-token-auth.middleware.spec.ts, api-tokens.service.spec.ts and jwt.strategy.spec.ts)."
        area: auth
        affectedPaths:
          - package.json
          - pnpm-lock.yaml
          - apps/api/src/main.ts
          - libs/api/custom/src/lib/plugins/mcp/index.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp.controller.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-transport.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-server.factory.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-oauth.controller.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-oauth.service.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-resource.ts
          - libs/api/custom/src/lib/plugins/api-tokens/api-tokens.service.ts
          - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts
          - libs/api/custom/src/lib/middleware/api-token-auth.middleware.ts
          - libs/api/prisma/src/lib/schemas/schema.prisma
          - libs/api/prisma/src/lib/migrations/20261025210000_mcp_oauth_token_resource_and_clients/migration.sql
          - libs/api/custom/src/lib/plugins/mcp/mcp-client-metadata.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-well-known.ts
          - libs/api/custom/src/lib/plugins/mcp/tools/**
          - libs/api/custom/src/lib/plugins/mcp/*.spec.ts
          - libs/api/custom/src/lib/middleware/api-token-auth.middleware.spec.ts
          - libs/api/custom/src/lib/plugins/api-tokens/api-tokens.service.spec.ts
          - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.spec.ts
        verification:
          - pnpm install --frozen-lockfile
          - pnpm db-update
          - grep -c "(zod@4" pnpm-lock.yaml
          - "git grep -n \"@modelcontextprotocol/sdk\" -- ':!pnpm-lock.yaml' ':!.nestled-updates'"
          - "pnpm typecheck:workspace"
          - pnpm exec nx build api
          - pnpm exec nx test api-custom --skip-nx-cache
          - pnpm run nestled-doctor
        patch: patches/2026-10-25-mcp-sdk-v2-and-2026-07-28.diff
  - id: 2026.10.22
    date: 2026-10-27
    title: MCP OAuth last-used accounting
    templateCommit: 5715b0e
    notes:
      - id: 2026-10-27-mcp-oauth-last-used-accounting
        title: Count MCP OAuth clients and API tokens as used only once they are accepted
        delivery: code-patch
        intent: "Two lastUsedAt updates that 2026-10-25-mcp-sdk-v2-and-2026-07-28 made too early. MCP OAuth clients (mcp-oauth.service.ts). resolveClientForRedirect no longer calls touchClient. /authorize runs it before the caller has signed in (through precheckClient) and again after sign-in, so a stored DCR client's lastUsedAt was refreshed by any request that named a client id and one of its redirect URIs. A client now counts as used only when /token redeems a code issued to it, after the code, client, redirect URI, PKCE verifier and resource have all checked out; that call (`touchClient` in the token handler of mcp-oauth.controller.ts) was already there and is unchanged. The prune rules are unchanged: never used within a day of registering, or unused for 30 days. API tokens (api-tokens.service.ts, jwt.strategy.ts, middleware/api-token-auth.middleware.ts). validateApiToken no longer updates ApiToken.lastUsedAt. A new `ApiTokensService.recordTokenUse(tokenId)` does, without blocking the request and logging a failure, and the two callers call it only once they accept the token: JwtStrategy after every check passes, just before `success(user)`, and ApiTokenAuthMiddleware once it has attached the user to the request. A token bound to an RFC 8707 resource and presented anywhere else (GraphQL, another host, another resource) is refused exactly as before, and its lastUsedAt no longer moves. Which tokens are accepted where does not change. Tests: mcp-oauth.service.spec.ts and mcp-oauth.controller.spec.ts (neither /authorize before or after sign-in, nor consent, nor a failed /token records use; a redeemed code does), api-tokens.service.spec.ts, jwt.strategy.spec.ts and middleware/api-token-auth.middleware.spec.ts (use recorded on acceptance, not on refusal), and the recordTokenUse mock in mcp.http.spec.ts."
        area: api
        affectedPaths:
          - libs/api/custom/src/lib/plugins/mcp/mcp-oauth.service.ts
          - libs/api/custom/src/lib/plugins/api-tokens/api-tokens.service.ts
          - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts
          - libs/api/custom/src/lib/middleware/api-token-auth.middleware.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-oauth.service.spec.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp-oauth.controller.spec.ts
          - libs/api/custom/src/lib/plugins/mcp/mcp.http.spec.ts
          - libs/api/custom/src/lib/plugins/api-tokens/api-tokens.service.spec.ts
          - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.spec.ts
          - libs/api/custom/src/lib/middleware/api-token-auth.middleware.spec.ts
        verification:
          - pnpm exec nx test api-custom --skip-nx-cache
