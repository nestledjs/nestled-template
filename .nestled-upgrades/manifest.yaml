      - id: 2026-09-15-railway-predeploy-migrations
        title: Production schema changes are Prisma migrations applied by a Railway pre-deploy command
        delivery: code-patch
        intent: "Every deploy applies committed Prisma migrations before the new container serves traffic, and schema changes are authored as migrations rather than pushed. The api service's Railway pre-deploy command is `pnpm prisma:deploy` (`prisma migrate deploy`) and it carries a health check on /api/uptime (timeout 300), so a container that fails to boot never replaces the running one. Both are service settings in Railway, declared in the repo as Railway Infrastructure as Code at .railway/railway.ts and applied with `railway config apply`. The `railway` npm package is a devDependency so `railway config plan` can evaluate the file. The template carries its first migration, libs/api/prisma/src/lib/migrations/0_init, generated from the schema, plus migration_lock.toml. Package scripts change to match: prisma:apply now runs `prisma migrate deploy` instead of `db push`, prisma:migrate (`prisma migrate dev`) is the authoring command, prisma:deploy is the production command, and prisma:db-push remains only for throwaway prototyping. AGENTS.md documents the contract under \"Production Migrations\"."
        area: database
