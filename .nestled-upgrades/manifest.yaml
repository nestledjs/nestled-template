      - id: 2026-10-19-db-update-doctor-after-schema-refresh
        title: db-update runs its final Doctor check after the API schema and SDK are refreshed, not before
        delivery: code-patch
        intent: "`pnpm db-update` runs Doctor last. The final `nestled-doctor` run moves out of the `db-update:generate` script and into scripts/db-update.mjs, which runs it after it has refreshed api-schema.graphql (through the API watcher or a one-shot isolated API) and rebuilt the typed SDK. The order is now: preflight Doctor, Prisma and the Nestled generators (`db-update:generate`), API schema refresh, SDK, Doctor. The Doctor checks themselves are unchanged and nothing is exempted; only their timing moves, so the SDK contract is checked against the refreshed schema instead of the previous one. package.json change (promotion does not carry package.json, so make it by hand): in `scripts[\"db-update:generate\"]`, delete the trailing ` && pnpm run nestled-doctor`. Keep the leading `pnpm run nestled-doctor && ` preflight. The template's script now reads: `pnpm run nestled-doctor && pnpm prisma:generate && pnpm verify:prisma-client && nx g @nestledjs/generators:crud && nx g @nestledjs/generators:models && nx g @nestledjs/generators:sdk && nx g @nestledjs/generators:custom`. The step order lives in the new scripts/db-update-steps.mjs (runDbUpdateSteps), which db-update.mjs calls; scripts/db-update-steps.spec.mjs checks the order, reproduces the failure the old order hit with a retired generated model, and asserts that package.json's `db-update:generate` keeps the preflight and has no trailing Doctor run. db-update.mjs prints a warning when `db-update:generate` still ends with nestled-doctor. AGENTS.md, docs/dev/doctor.md and docs/dev/api-extension-methodology.md describe the new order."
