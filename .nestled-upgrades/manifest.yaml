aiming success. Report whether cleanup killed a group, only the launcher, or found it already stopped. Include the process-cleanup unit tests and strict support typecheck in both api-e2e:test and api-e2e:e2e target dependencies. Exclude the support specs from the main e2e config so each entry point runs them once."
