      - id: 2026-10-01-auth-recovery-revokes-sessions-and-stale-verification-tokens
        title: Password reset revokes sessions; stale verification tokens can no longer verify the wrong address
        delivery: code-patch
        intent: "Changes in `AuthService` (libs/api/custom/src/lib/plugins/auth/auth.service.ts): 1. `resetPassword()` writes the new password, the password-history row, and `userSession.updateMany({ isValid: false })` for EVERY session in one interactive transaction. No session is spared (the reset flow is unauthenticated). The password write consumes the reset token by compare-and-set (`user.updateMany` whose `where` includes the token and `passwordResetExpires > now`); a zero match writes nothing and throws \"This token has been used or is invalid.\" Security logging and the password-changed email run only after that commit. 2. `changeEmail()` writes the User update (now also clearing `validateEmailToken` and `validateEmailTokenExpires`) and the primary Email rewrite in one transaction, User row FIRST. 3. Signup verification tokens are minted by a new private `mintVerificationTokenForPrimary()`, which stores the token and then asserts the target is still the primary address inside one transaction, rolling back otherwise. `sendVerificationEmail()` now returns false when it refused. The public `resendVerificationEmail()` treats that as the unknown-address branch (returns true, sends nothing); `resendMyVerificationEmail()` throws a BadRequest asking the user to retry. 4. `verifyEmail()` and `verifyEmailChange()` consume their token by compare-and-set (`updateMany` whose `where` includes the token) inside the transaction that marks the address verified. A zero match verifies nothing and throws NotFound. 5. Signup verification tokens carry a version marker. All three mint sites (`register()`, `registerWithInvitation()`, `sendVerificationEmail()`) use `generateEmailVerificationToken()` from auth.helper.ts, which prefixes `EMAIL_VERIFICATION_TOKEN_PREFIX` (`v2-`). `verifyEmail()` refuses any token without it before the lookup, with the same NotFound as an unknown token. This is REQUIRED, not optional: the other changes stop new unbound tokens being issued, but without the marker a token minted by the previous code stays redeemable until it expires (24h). Users holding an old link request a new one. Lock order is part of the fix. Every path above writes the User row before reading or writing Email, so concurrent requests on one account serialize instead of interleaving or deadlocking."
        area: auth
        affectedPaths:
          - libs/api/custom/src/lib/plugins/auth/auth.service.ts
          - libs/api/custom/src/lib/plugins/auth/auth.service.spec.ts
          - libs/api/custom/src/lib/plugins/auth/auth.helper.ts
          - libs/api/custom/src/lib/plugins/auth/auth.helper.spec.ts
        verification:
          - "pnpm exec nx run api-custom:test"
          - "pnpm exec nx run api:typecheck"
          - pnpm run nestled-doctor
        patch: patches/2026-10-01-auth-recovery-revokes-sessions-and-stale-verification-tokens.diff
  - id: 2026.10.2
    date: 2026-10-04
    title: Doctor 0.6.2 and audit records for sensitive mutations
    templateCommit: 2a76a31
    notes:
      - id: 2026-10-04-sensitive-mutations-write-audit-records
        title: Doctor 0.6.2 (hard-fail checks, --full) and audit records for the sensitive mutations that had none
        delivery: hybrid
        intent: "0. `@nestledjs/doctor` moves to 0.6.2. New and stricter checks fail hard: per-mutation audit-coverage, raw NUL bytes in source, verify-fragments declarations, and repo-declared guards (`.nestled-updates/security/declared-guards.json`). `nestled-doctor --full` fails on every review finding and is how a repo gets clean once; normal runs then fail only on changed lines. The 33 sensitive GraphQL mutations that `nestled-doctor --full` reported as writing no audit record now write one, so the template passes `audit-coverage` without exemptions. Most gain an `AuditLog` row (`entityId`, `entityType`, `action`, `userId`, `organizationId?`, `changes?`); the unauthenticated verification resend gains a `SecurityEvent` (below). Mutations that were already covered keep their existing mechanism: password changes, 2FA enable/disable, email changes, account lock/unlock and API-token events go on writing `SecurityEvent` rows, and the admin and access-control mutations their existing `AuditLog` rows. Both are accepted audit records; do not add a second one where either already exists. 1. The best-effort helper moves from `plugins/billing/audit-log.ts` to `libs/api/custom/src/lib/shared/audit-log.ts` and is renamed `recordBillingAuditLog` -> `recordAuditLog(data, { actorUserId, organizationId?, entityId, entityType, action, changes? })`. It logs and swallows a failed write, so an audit failure never changes a mutation's result. The billing sync and checkout/portal/cancel mutations already wrote rows through it; doctor 0.6.0 did not recognise the old name and reported them. Since 0.6.1 the doctor recognises `audit` as any part of an identifier, so the rename is for clarity (the helper is no longer billing-only), not to satisfy the check. 2. `OrganizationService` records ORGANIZATION_CREATED, ORGANIZATION_DELETED (no organizationId on the row, since the organization is gone; entityId identifies it), ORGANIZATION_MEMBER_ADDED, ORGANIZATION_INVITATION_RENEWED, ORGANIZATION_INVITATION_ACCEPTED, ORGANIZATION_INVITATION_DECLINED and ACTIVE_ORGANIZATION_SWITCHED through its existing `recordAuditLog`. `transferOrganizationOwnership` writes ORGANIZATION_OWNERSHIP_TRANSFERRED inside the role-swap `$transaction`. 3. `AuthService` records USER_REGISTERED, USER_REGISTERED_WITH_INVITATION, PROFILE_UPDATED, EMAIL_VERIFICATION_TOKEN_REISSUED (self-service resend only; see below), EMAIL_VERIFIED, EMAIL_CHANGE_VERIFIED, TWO_FACTOR_SETUP_STARTED, TWO_FACTOR_CODE_VERIFIED / TWO_FACTOR_CODE_REJECTED (from `verify2FALogin`, with `method: totp|backup_code`), LOGIN_2FA_COMPLETED, SESSION_INVALIDATED, ALL_SESSIONS_INVALIDATED, ACCOUNT_DELETED and LOGOUT. `transferOrganizationOwnership` writes ORGANIZATION_OWNERSHIP_TRANSFERRED inside its `$transaction`. Logout moves from `SessionService.invalidateSession` in the resolver to a new `AuthService.logout(sessionId)`, which invalidates the session and attributes the row to the session's owner. 4. `OAuthService` records OAUTH_ACCOUNT_LINKED and OAUTH_ACCOUNT_UNLINKED with the provider. No secrets, tokens, codes, passwords, 2FA secrets or URLs are written to `changes`. Where a mutation commits state and then sends mail (registration, invitation registration, invitation renewal, verification-token reissue), the row is written after the commit and BEFORE the send: the mailer rethrows, and a failed send must not leave a committed change unrecorded. Logout's owner lookup is best-effort like the write, so it can never stop the cookie being cleared, and the resolver now clears the cookie in a `finally`, so a failed invalidation (for example a session already removed by cleanup) no longer leaves a dead credential in the browser. LOGIN_2FA_COMPLETED is written after `signUser` succeeds, not before. The PUBLIC verification resend is unauthenticated: the caller only named an address, so an AuditLog row with that account as `userId` would claim the owner acted. It records a SecurityEvent instead, like a password-reset request: new enum value `SecurityEventType.EMAIL_VERIFICATION_REQUESTED` (migration `20261004190000_security_event_email_verification_requested`, a single `ALTER TYPE ... ADD VALUE`), logged against the account with the request's IP and user agent. `resendVerificationEmail` now takes the resolver's session info for that context. `SecurityEventsService.logEvent` now contains a failed write inside its detached callback instead of leaving an unhandled rejection."
        area: auth
        affectedPaths:
          - libs/api/prisma/src/lib/schemas/schema.prisma
          - libs/api/prisma/src/lib/migrations/20261004190000_security_event_email_verification_requested/migration.sql
          - libs/api/custom/src/lib/plugins/security/security-events.service.ts
