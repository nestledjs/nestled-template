        skipIf:
          - The project has no web app.
        agentHints:
          - Apply the parts separately; they share no logic. Parts 1 and 2 build on 2026-11-16-session-org-consistency (`storeActiveOrganizationId`); an app that marked its storage parts not-applicable (no organization header) marks parts 1 and 2 not-applicable with the same reason. Parts 4 and 5 build on 2026-11-16-ssr-signout-outage (`routeErrorOutcome`, `signOutOnceSettled`); apply that first.
          - "Shapes: an app with no signed-in layout keeps the organization wherever its session helper resolves it, and clears it in part 1's sign-in sites and part 2's login form all the same. An app with no /force-logout puts part 2's clear on the page its server sign-out lands on, and part 3's helper in that sign-out. An app with no switch mutation (the browser alone chooses) has nothing to do for check (iii). An app that resolves Me in the root loader is the one part 4 matters most for; route its 401 through `privateRouteMeFailure` and take part 5's specs."
          - "Part 3 needs the owner: report which deploys set `API_COOKIE_DOMAIN` on the API and whether the web service has the same value; do not set environment variables yourself. To check the fix before the deploy, run tests/session-cookie.spec.ts; on a live deploy with a cookie domain, sign in, trigger a forced sign-out, and confirm the response carries two `Set-Cookie` expiries for the session cookie, one with `Domain=`."
          - "Part 4, tests: a spec that mocks the root loader's preload to throw an UNAUTHENTICATED error and expected a 302 to /login now sees a thrown 401 route error (`{ init: { status: 401 } }`), with no Set-Cookie. An entry.server spec that renders through `createRequestHandler` sees the /force-logout 302 instead."
