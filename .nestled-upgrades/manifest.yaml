      - id: 2026-10-26-nestled-forms-0-9-1
        title: "@nestledjs/forms 0.9.1: pasted, autofilled and dropped values register, standalone RenderFormField shows its errors, and dotted keys validate"
        delivery: package-release
        intent: "Move @nestledjs/forms, @nestledjs/forms-core and @nestledjs/forms-native (where the project uses it) together from 0.9.0 to 0.9.1. The template's root package.json pins `\"@nestledjs/forms\": \"0.9.1\"` and `\"@nestledjs/forms-core\": \"0.9.1\"`; re-resolve the lockfile with `pnpm install`. No application source change is required. What 0.9.1 fixes: 1. Paste, autofill and drag-drop now register. A value set by a script (a password manager, a browser extension, autofill) or dropped into a field assigns the element's `.value` before the `input` event fires, so React's value tracker swallowed the event and the form state never saw the value: the field showed text, and a `required` rule still blocked the submit. Text, email, password, url and textarea fields now also sync from the native `input` and `change` events, `<Form>` reads those fields' DOM values at submit as a last resort for autofill that fires no event at all, and a blocked submit moves focus to the first invalid field in document order, including controlled fields. 2. A standalone `RenderFormField` (one placed under the project's own `FormContext.Provider` rather than inside `<Form>`) now shows its validation errors. It read `formState.errors` without a subscription of its own, so its message only appeared when something above it happened to re-render. It now reads its error through the new `useFieldError(name)` hook exported by @nestledjs/forms-core, which subscribes to that one field with `useFormState({ name })`. `useFieldError` returns `{ error, errorMessage }` and is available to custom fields too. 3. Nested dotted keys such as `address.city` validate correctly. The field resolver read `values[key]` and wrote `errors[key]` flat, so a filled nested required field was always validated as empty and could never submit, and its error was never found. Values are now read with react-hook-form's `get()` and errors written with `set()`. 4. The @nestledjs/forms README has a new Validation section: when validation runs, Zod setup (Zod 3 through @hookform/resolvers, both peer dependencies the app installs), field rules, and how to use `RenderFormField` without `<Form>` (pass `buildFieldsResolver({ fields })` to your own `useForm` so `required` and the other field rules are enforced)."
        area: web
        verification:
          - pnpm install
          - pnpm install --frozen-lockfile
          - "pnpm typecheck:workspace"
          - "pnpm build:web"
          - pnpm exec nx test web --skip-nx-cache
          - pnpm run nestled-doctor
          - "In a running web app, fill the login form with the browser's or a password manager's autofill and submit without typing: the form submits. Submit a form with a required field empty: focus moves to that field and its message shows."
        packageReleases:
          - name: "@nestledjs/forms"
            targetVersion: 0.9.1
            versionRange: ^0.9.1
