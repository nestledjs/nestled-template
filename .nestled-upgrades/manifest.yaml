        patch: patches/2026-10-25-mcp-oauth-consent-and-s256-pkce.diff
      - id: 2026-10-25-settings-all-manage-and-sonar-follow-ups
        title: "Settings honour all:manage; the billing read-only notice and error fallbacks pass Sonar; db-update's Doctor warning is best-effort"
        delivery: code-patch
        intent: "Four small follow-ups to the 2026.10.17 changes. 1. `apps/web/app/routes/settings/_settings-access.ts`: `hasRolePermission` also counts `all:manage` as holding the asked-for permission. The API's access policy already treats `all:manage` as `*` (every permission), so a role that carries only `all:manage`, as older seeds gave the Owner, can use every billing mutation but was shown the billing page read-only and had the Roles and AI tabs hidden. With the change the settings area shows such a role exactly what the API lets it do. Nothing else changes: `hasBillingAccess` keeps its Owner/Admin role-name rule for viewing, `canManageBilling` still needs `billing:manage` (now also met by `all:manage`), and no role without `all:manage` sees more or less than before. 2. `apps/web/app/routes/settings/billing.tsx`: the read-only notice is an `<output>` (with `block`) instead of `<p role=\"status\">`, which is the same live region without Sonar S6819. 3. `errorReason` in `scripts/test-database.mjs` and `apps/api-e2e/src/support/sql-runner.mjs` no longer calls `String()` on an unknown thrown value (Sonar S6551). A new `thrownValueText` returns a string as it is, a number, boolean or bigint as text, anything else as JSON, and nothing for null, undefined or a value JSON cannot represent; `errorReason` then falls back to `unknown error`. `AuthCacheService.reportConnectionStatus` in `libs/api/utils/src/lib/services/auth-cache.service.ts` logs `unknown error` for a non-Error rejection instead of `String(error)`. 4. `scripts/db-update.mjs`: the warning about a trailing Doctor run in `db-update:generate` moves to `trailingDoctorWarning` in `scripts/db-update-steps.mjs` and is best-effort. A missing, unreadable or non-JSON package.json gives no warning instead of stopping db-update before any step runs (db-update run in a bare folder, as some Docker tests do, failed with ENOENT)."
