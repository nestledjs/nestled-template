    templateCommit: 8dd9701
    notes:
      - id: 2026-10-06-auth-record-invariants
        title: Keep authentication records consistent across administrative maintenance
        delivery: hybrid
        intent: Keep protected account and email flags readable while assigning their writes to explicit application workflows. Use the generator's @crudReadOnly annotation for User.isSuperAdmin, User.emailValidated, Email.primary, Email.verified and Email.verifyExpires. Session records use @skipCrud with a documented credential-maintenance exception; maintain sessions through the existing explicit authentication/session APIs. Regenerate CRUD, models and the complete SDK. Apply the auth-record-invariants and auth-record-lock-contention migrations to keep email validation and active organization context consistent after administrative changes, including relation reassignment and deletion. Generated standalone writes retry rolled-back conflicts; owner synchronization uses sorted, nonblocking locks so concurrent application workflows can complete.
