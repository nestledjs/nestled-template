    templateCommit: 131607a
    notes:
      - id: 2026-10-23-node-22-23-4-security-pin
        title: Node moves to the 22.23.4 security release, pinned exactly where builds run and as a floor in engines
        delivery: code-patch
        intent: "Every place that chooses a Node version moves to 22.23.4, the Node 22 security release of 2026-10-20. Exact pins (the version that builds and tests actually run on): `.github/workflows/ci.yml` `node-version: 22.23.4` (both jobs), `.tool-versions` `nodejs 22.23.4`, a new `.nvmrc` containing `22.23.4`, and `.dev/Dockerfile` `FROM node:22.23.4-slim` instead of the floating `node:22-slim` tag. The root package.json `engines.node` goes from `^22.14.0` to `>=22.23.4 <23`. Railway's builder (Railpack) reads `engines.node` before `.nvmrc`, so the old range let a deploy build on any 22.x from 22.14.0 up, including unpatched ones. The new floor means no build can pick an unpatched 22.x. `engines` is a floor rather than an exact pin because `.npmrc` sets `engine-strict=true`: an exact version there would make `pnpm install` fail on every machine and agent box that is not on that exact patch, and again on every later Node patch. The template's README and the debugging playbook describe the new pins. Moving to Node 24 is a separate, later change; this note stays on Node 22."
        area: infra
        affectedPaths:
          - package.json
          - .nvmrc
          - .tool-versions
          - .github/workflows/ci.yml
          - .dev/Dockerfile
          - docs/template/README.md
          - agents/debugging-playbook.md
        verification:
          - "git grep -nE \"node-version|FROM node:|\\\"node\\\":|^nodejs \" -- ':!pnpm-lock.yaml'"
          - node -v
          - pnpm install --frozen-lockfile
          - "pnpm typecheck:workspace"
          - pnpm exec nx build api
          - pnpm exec nx test api-utils
        patch: patches/2026-10-23-node-22-23-4-security-pin.diff
