      - id: 2026-10-30-mcp-consent-origin-null
        title: "MCP consent page: Referrer-Policy same-origin, so Approve no longer fails with 400 Bad Request"
        delivery: code-patch
        intent: "apps/web/app/routes/mcp-connect.tsx's `headers()` sent `Referrer-Policy: no-referrer` (added in 2026-10-25-mcp-oauth-consent-and-s256-pkce). With that policy Chrome sends `Origin: null` on the page's own form POST. React Router 7's action CSRF check (`throwIfPotentialCSRFAttack`) treats the string \"null\" as a foreign origin, throws \"The `request.url` host does not match `origin` header from a forwarded action request\" and answers 400. So a user who clicks Approve (or Deny) on the consent page sees \"Bad Request\", and the API's `/api/mcp/authorize/decision` and `/api/mcp/token` are never reached: no remote MCP connector (for example a claude.ai custom connector) can finish connecting. The fix changes that one header to `Referrer-Policy: same-origin`. The page's URL, with its pending request id, is still never sent to another site, and the browser sends the real Origin on the same-origin POST. The other consent-page headers (X-Frame-Options DENY, CSP `frame-ancestors 'none'`, Cache-Control no-store) are unchanged. The CSRF check is not loosened and no `allowedActionOrigins` is added. Reproduce: `curl -i -X POST https://<web-host>/mcp-connect?request=x -H 'Origin: https://<web-host>' ...` gets a 302 (or the action's own answer); the same request with `-H 'Origin: null'` gets 400. Test: apps/web/tests/routes/mcp-connect.spec.tsx asserts the header value."
        area: auth
        affectedPaths:
          - apps/web/app/routes/mcp-connect.tsx
          - apps/web/tests/routes/mcp-connect.spec.tsx
        verification:
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec nx build web --skip-nx-cache
          - "After deploy: `curl -s -o /dev/null -w '%{http_code}\\n' -X POST 'https://<web-host>/mcp-connect?request=x' -H 'Origin: https://<web-host>' -H 'Content-Type: application/x-www-form-urlencoded' --data 'decision=deny'` does not answer 400, and `curl -sI 'https://<web-host>/mcp-connect?request=x'` shows `Referrer-Policy: same-origin`. Then connect a remote MCP client and click Approve."
        patch: patches/2026-10-30-mcp-consent-origin-null.diff
      - id: 2026-10-30-sonar-tidy-ups-and-mcp-cloudflare-docs
        title: SonarCloud tidy-ups (S3776 in ApiTokenAuthMiddleware, S8786 and S6754 in api-availability.ts) and an MCP plugin README on Cloudflare bot protection
        delivery: code-patch
        intent: "Three small changes with no behaviour change, plus a new README. 1. libs/api/custom/src/lib/middleware/api-token-auth.middleware.ts (SonarCloud S3776, cognitive complexity of `use`): the user lookup and attach step moves into a private `attachTokenUser(req, result)`, typed with `ValidatedApiToken` (the non-null result of `ApiTokensService.validateApiToken`). `use` calls `await this.attachTokenUser(req, result)` inside the same try block. The not-found and deactivated-user refusals, their log lines, `recordTokenUse` (called only after the user is attached), the resource-binding refusal and the \"Invalid or expired API token provided\" branch are unchanged, and the existing spec passes unchanged. 2. apps/web/app/api-availability.ts: - S8786: `apiProbeUrl()` trimmed trailing slashes with `.replace(/\\/+$/, '')`, which SonarCloud flags as a slow-regex risk. It now uses a new exported `trimTrailingSlashes(value)`, a loop over `value.endsWith('/', end)`. - S6754: the `useState` pair in `useApiAvailability` is `[phase, setPhase]`; the callback that updates both the ref and the state is renamed from `setPhase` to `changePhase`. 3. New libs/api/custom/src/lib/plugins/mcp/README.md: the MCP endpoint and OAuth routes a remote connector reaches, and a section for an API behind Cloudflare. With bot protection on (Bot Fight Mode, Super Bot Fight Mode or a managed challenge), non-browser MCP clients get a challenge page instead of JSON and connecting fails. Fix it on the API hostname only: make it DNS-only (grey cloud), or add a WAF skip rule for paths starting with `/api/mcp` (the endpoint and `/api/mcp/register`, `/authorize`, `/token`, `/jwks`, `/.well-known/*`), `/.well-known/oauth-` and `/.well-known/openid-configuration`. The web app stays proxied."
        area: api
        affectedPaths:
          - libs/api/custom/src/lib/middleware/api-token-auth.middleware.ts
          - apps/web/app/api-availability.ts
          - libs/api/custom/src/lib/plugins/mcp/README.md
        verification:
          - pnpm exec nx test api-custom --skip-nx-cache
