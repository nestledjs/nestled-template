      - id: 2026-11-10-note-authoring-stays-upstream
        title: "Projects cloned from the template stop asking for upgrade notes: no \"Downstream Upgrade\" PR section, no note scaffold"
        delivery: code-patch
        intent: "Upgrade notes are written only in the source template. A project cloned from the template never writes one: nothing reads a note committed in a downstream project. But the template shipped the source template's note-authoring tools, so every clone told its PR authors to write notes. Four parts. No package changes. 1. `.github/pull_request_template.md`: delete the whole `## Downstream Upgrade` section (the \"Propagate downstream\", \"Upgrade note\", \"Area\", \"Priority\", \"Verification\" and \"Reason\" lines). Keep `## Summary`, `## Verification` and `## Security Review` as they are. 2. Delete `scripts/create-upgrade-note.ts`, and the `template:create-upgrade-note` script from the root package.json. 3. Keep `scripts/validate-upgrade-notes.ts`, the `template:validate-upgrade-notes` script and its CI step, and the `.nestled-updates/` directory (doctor config, security baselines, and the notes already committed there). The validator checks only the notes that exist; it never asks for one. 4. In the project's agent instructions (AGENTS.md, CLAUDE.md or equivalent), remove any section that tells an author to create an upgrade note or fill in a \"Downstream Upgrade\" block, and say instead: \"This project is cloned from the Nestled template. Do not create upgrade notes here: they are written only in the source template.\""
        area: docs
        affectedPaths:
          - .github/pull_request_template.md
          - scripts/create-upgrade-note.ts
          - package.json
          - AGENTS.md
        verification:
          - git grep -n "Downstream Upgrade" -- .github (no match)
          - test ! -e scripts/create-upgrade-note.ts
          - "pnpm template:validate-upgrade-notes"
          - pnpm run nestled-doctor
        patch: patches/2026-11-10-note-authoring-stays-upstream.diff
      - id: 2026-11-10-nx-24-ts-6-eslint-10
        title: "Toolchain: Nx 24.0.5, TypeScript 6, Vite 8, ESLint 10 and eslint-plugin-react-hooks v7, with every new lint rule an error"
        delivery: hybrid
        intent: "Move the workspace to Nx 24.0.5, TypeScript 6.0.3, Vite 8 (Rolldown), ESLint 10 and eslint-plugin-react-hooks 7.1.1. Every rule that hooks v7 and ESLint 10 add is an error, and the violations are fixed without changing behaviour. React stays on 19.1.0 and React Router on 7.18.2; React Router 8 is a separate release. **Run the migration yourself. Do not copy the template's tooling files.** Projects sit on different 22.x versions and carry their own Nx plugins and targets, so the migrate has to see your workspace. package.json, the lockfile, nx.json and tsconfig.base.json are not mirrored by promotion either. 1. Migrate Nx. Run `pnpm exec nx migrate 24.0.5`, not `latest`, so every project lands on the same version. Check the package.json diff, then run `pnpm install --no-frozen-lockfile` and `pnpm exec nx migrate --run-migrations`. Nx 24 drives the run as a step-by-step loop that commits each migration. Follow its runbook (`.nx/migrate-runs/<id>/RUNBOOK.md`) and apply the AI prompts it writes under `tools/ai-migrations/`. Commit `migrations.json` and those prompts, as the template does. 2. TypeScript 6. Accept the `typescript` 6.0.3 package update. If the project is already past Nx 23.1, the migrate no longer offers it: set `\"typescript\": \"6.0.3\"` yourself, and add the @nx/js migrations `23-1-0-add-ignore-deprecations-for-ts6` and `23-1-0-set-tsconfig-root-dir-for-ts6` to `migrations.json` before running it. They add `\"ignoreDeprecations\": \"6.0\"` and pin the pre-TS 6 defaults in tsconfig.base.json (`strict: false`, `noUncheckedSideEffectImports: false`, `types: [\"*\"]`). Keep those pins: they hold the compiler to its TypeScript 5 behaviour. 3. Package versions the template ended on (root package.json): nx and every @nx/* package 24.0.5; typescript 6.0.3; typescript-eslint 8.72.2; vite 8.3.7; @vitejs/plugin-react 6.3.0; jest 30.3.0; ts-jest 29.4.9; rollup 4.68.2; webpack-cli 7.3.1; webpack 5.112.2 and webpack-dev-server 5.2.7 (now direct); storybook and @storybook/* 10.6.7; @chromatic-com/storybook 5.6.0; eslint ^10.14.0; @eslint/js ^10.0.1; eslint-plugin-react-hooks 7.1.1; eslint-plugin-react 7.37.5. The Nestled packages that moved to the same toolchain (see packageReleases): **@nestledjs/generators 4.0.0**, which requires Nx 24 and is a major for that reason only (generator options and output are unchanged); @nestledjs/doctor 0.7.0, whose `typescript` dependency now accepts 6; @nestledjs/forms, forms-core and forms-native 0.9.2; @nestledjs/shared-components 1.0.20 and @nestledjs/access-control 0.0.4, whose only change is the template's lint fixes. Move generators and Nx together: generators 4 on Nx 22 or 23, or generators 3.x on Nx 24, leaves the workspace with two Nx versions. Update the packages a project already declares, at exact pins where it pins today; do not add ones it does not use. 4. Breakage the migrate does not fix, and what the template did: - Tests silently skipped. Since Nx 23, `@nx/vite/plugin` no longer creates a `test` target. If nx.json registers `@nx/vitest` with `testTargetName: \"vite:test\"`, every project without an explicit `test` drops out of `nx run-many -t test`, and the command still exits 0. Set `\"testTargetName\": \"test\"` and `\"testMode\": \"run\"` on that plugin entry. Then compare `nx show projects --with-target test` with the list from before the upgrade. - The removed @nx/jest, @nx/vitest, @nx/vite and @nx/eslint executors. The migrations convert these to inferred targets. Keep each target's dependsOn, configurations and coverage directories. If the migrate adds a second, include-scoped `@nx/vitest` entry with `testMode: \"watch\"`, fold it into the existing entry: the removed executor ran once. - The React Router app's build. A React Router app gets no build, serve or preview target from `@nx/vite/plugin`, so `web:build`, `web:serve` and `web:preview` become explicit `nx:run-commands` targets in apps/web/project.json. **build runs `react-router build`.** Under Vite 8, `vite build` (which the removed `@nx/vite:build` executor called) builds the SSR environment from the client inputs, and emits no `build/server/index.js`. The build passes and the app cannot start. Check for build/server/index.js after building. - `nxViteTsPaths` and `nxCopyAssetsPlugin` are inert stubs in Nx 24. The codemod sets `resolve.tsconfigPaths: true`. Remove the remaining `nxCopyAssetsPlugin` calls. A project whose vite build ships copied files (a published library's README or LICENSE) needs a small replacement plugin (see libs/access-control/vite.config.mts). - Replace `__dirname` with `import.meta.dirname` in vite and vitest configs. - Under TypeScript 6, spec tsconfigs that typecheck vite or vitest configs need `\"module\": \"esnext\"` and `\"moduleResolution\": \"bundler\"`. Vite 8 publishes exports-only types. A vitest config checked by a CommonJS tsconfig fails on `import.meta.dirname`: move it to an ESM tsconfig. - Jest now runs from each project's root, not the workspace root, because the inferred `@nx/jest/plugin` target sets `cwd` to the project. A path or glob key in `coverageThreshold` is resolved against that directory. A key written from the workspace root (`'libs/api/custom/src/...'`) fails `--coverage` runs with \"Coverage data for ... was not found\". Make it project-relative (`'./src/...'`). - The root `vitest.workspace.ts` becomes a root `vitest.config.ts` with `test.projects`. `.nx/migrate-runs` is added to .gitignore. - A Vite plugin typed against Rollup's `OutputBundle` gets a Rolldown bundle. Type only the fields it reads. 5. ESLint 10. Move eslint, @eslint/js, eslint-plugin-react-hooks and eslint-plugin-react to the versions above. eslint-plugin-react's `react.version: 'detect'` calls `context.getFilename()`, which ESLint 10 removed, so every React lint config crashes. The root eslint.config.mjs exports `reactVersionSettings`, which names the installed React version. Spread it after `...nx.configs['flat/react']` in every React lint config, and keep that spread. 6. Lint rules: all new rules are errors. That covers the 14 rules eslint-plugin-react-hooks v7 adds to `recommended` (static-components, use-memo, preserve-manual-memoization, incompatible-library, immutability, globals, refs, set-state-in-effect, error-boundaries, purity, set-state-in-render, unsupported-syntax, config, gating) and ESLint 10's new recommended `no-useless-assignment` and `preserve-caught-error`. `exhaustive-deps` stays a warning. Do not turn rules off or down to warnings. **Fixes must not change behaviour.** When the only fix you can find would change what the code does, keep the code and add an `// eslint-disable-next-line <rule> -- <reason>` with a one-line reason. List every such disable in the outcome. The common fixes the template used: - `set-state-in-effect` - State that follows a prop or route value (a reset when `location.key`, `src` or a URL changes): use React's \"adjust state when a prop changes\" pattern. Keep the previous value in state and set both while rendering: `if (prev !== value) { setPrev(value); setX(...) }`. - A value computable from props or state (an error for a missing token): derive it while rendering and drop the effect. - A client-only flag that is false on the server and true in the browser: use `useSyncExternalStore(() => () => undefined, () => true, () => false)`. - An effect that starts a request and sets state when it settles: set that state in promise callbacks (`.then`, `.catch`, `.finally`), not after `await` in the effect's own async function. Wrap the call as `new Promise(resolve => resolve(call()))` so a synchronous throw still reaches the catch. - Reading browser-only state after hydration (navigator.onLine, localStorage, a DOM element another component renders): keep the effect, with a disable and that reason. Reading it while rendering makes the hydrated HTML differ from the server's. - `refs`: `ref.current = value` during render (the \"latest value\" ref). Write it in a `useLayoutEffect` (no dependency array, or the value's dependencies). That runs before any effect, timer or event handler that reads the ref. Lazy-initialise a ref from impure input with `const [initial] = useState(() => compute())` and `useRef(initial)`. - `immutability`: assigning `globalThis.location.href = url` in a component or handler. Call `globalThis.location.assign(url)`, which does the same thing. Test mocks of `location` need an `assign` that sets `href`. - `preserve-manual-memoization`: a `useCallback` or `useMemo` whose dependency list names `obj?.id` while the body reads `obj.id`. Hoist `const id = obj?.id` and use `id` in both. - `purity`: `Date.now()` or `Math.random()` while rendering, often as a `useRef(...)` argument that runs on every render. Move it into a lazy `useState(() => ...)` initialiser. - `preserve-caught-error`: pass the caught error on, as in `throw new Error(message, { cause: error })`. `ErrorOptions` needs `\"es2022.error\"` in tsconfig.base.json's `lib`; the template's lib is now `[\"es2021\", \"es2022.error\", \"dom\"]`. - `no-useless-assignment`: drop an initial value every path overwrites (`let decoded: T | null = null` before a try that assigns it or throws). **An app the owner has excluded** (a mobile app in the workspace, for example) keeps its existing lint config for that project, untouched, and the outcome records which project was excluded and why."
        area: infra
        affectedPaths:
          - package.json
          - pnpm-lock.yaml
          - nx.json
