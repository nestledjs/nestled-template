      - id: 2026-10-05-auth-generation-claim
        title: Every JWT and API token carries a per-user auth generation; emulation tokens get revocable sessions
        delivery: code-patch
        intent: "Authentication hardening. A new column `User.authGeneration Int @default(0)` (marked `@graphqlOmit`, migration `20261005120000_user_auth_generation`) is a per-user counter. Every JWT the API signs carries it as the `authGeneration` claim, and a token is accepted only while the claim equals the user's current value. A missing claim reads as 0, the starting value for every user, so tokens issued before this release keep working until the user's counter first moves. 1. New `auth-token-claims.ts` in the auth plugin: `AuthTokenClaims`, `claimedAuthGeneration()` and `isAuthTokenCurrent(data, claims, user)`, which checks the generation, that the token's session (if any) is valid and owned by the right user, and, for emulation tokens, the emulating admin's generation. `AuthService.isTokenCurrent()` wraps it. 2. `JwtStrategy.validate()` calls `auth.isTokenCurrent(payload, user)` after loading the user and refuses the request when it returns false. This replaces its direct `isSessionValid()` call. `McpOAuthController /mcp/authorize` applies the same check to the session cookie it reads, and refuses emulation tokens (403 `access_denied`). 3. The counter is incremented (`authGeneration: { increment: 1 }`) inside the same write or transaction as: `AuthService.resetPassword()` (the compare-and-set that consumes the token), `AuthService.deleteUserAccount()`, `AdminService.forcePasswordReset()` and `AdminService.deactivateUser()`. `changePassword()` does NOT increment it, because it keeps the caller's current session; it still revokes the other sessions as before. 4. Tokens are signed with the generation read when the credential was checked, never re-read at signing time. `signUser()` takes an optional fifth argument `{ authGeneration?, adminAuthGeneration? }` and otherwise uses `user.authGeneration` (reading the row only when the caller's object lacks it). `createTemp2FAToken()` now takes `{ id, authGeneration }` instead of a user id and puts the claim in the 2FA temp token; `complete2FALogin()` refuses a temp token whose claim no longer matches and signs the session with the temp token's generation. 5. Emulation tokens are revocable. `emulateUser(input, adminId, { sessionInfo?, adminAuthGeneration?, replacedSessionId? })` creates a UserSession owned by the ADMIN and signs a token carrying that session, the target's generation and the admin's generation (`adminAuthGeneration`). Emulation tokens without a session are refused, including ones issued before this release. When the request authenticated with the admin's session cookie (no bearer header), the resolver passes that session as `replacedSessionId` and it is ended once the emulation token is issued, since the new cookie replaces it. `endEmulation(token, sessionInfo?)` ends the emulation session by compare-and-set and returns the admin to a new session of their own (previously the admin token it issued had no session). `AuthResolver.logout` ends an emulation token's session as the admin's. 6. `AuthCacheService` session-validity entries are fenced. `invalidateSession()` writes a short tombstone instead of deleting the key, and `setSessionValid(id, true)` only fills an empty key (`SET NX`), so a request that read a session as valid before it was revoked cannot write that stale value back after the revocation. 7. API tokens are bound to the generation too. New column `ApiToken.authGeneration Int @default(0)` (`@graphqlOmit`, migration `20261005130000_api_token_auth_generation`) records the owner's generation at issue. `ApiTokensService.generateApiToken()` and `rotateApiToken()` take it as an optional third argument (the resolver passes the authenticated row's value; MCP passes the value from the session that authorized the code, carried on `StoredAuthCode.authGeneration` into `McpOAuthService.createAccessToken(userId, organizationId, authGeneration)`). `validateApiToken()` loads the owner with the token and refuses it when the generations differ or the owner is inactive. So password reset, forced reset, deactivation and account deletion stop the owner's existing API tokens; the token rows themselves are left as they are (not marked revoked). 8. Inactive accounts (`User.isActive === false`) are refused by `JwtStrategy` on both the session token and the API token path, by `complete2FALogin()`, and by the OAuth callback (redirect with `error=account_disabled`), in addition to the password login that already refused them. 9. Any change of `User.isActive`, in either direction and by any path (application code, generated CRUD, nested writes, raw SQL), moves `authGeneration` on. This is enforced in the database by a `BEFORE UPDATE OF \"isActive\"` trigger (migration `20261005140000_auth_generation_follows_is_active`), which leaves alone an update that already moves the counter itself. Reactivating an account therefore never brings back tokens issued before it was deactivated. 10. Emulation tokens last 1 hour instead of 7 days. Every session row now records when its token expires (`UserSession.expiresAt DateTime?`, migration `20261005140100_user_session_expires_at`): `signUser()` passes it to `SessionService.createSession(userId, sessionInfo, twoFactorVerified, expiresAt?)`. `isAuthTokenCurrent()` refuses a session past its `expiresAt`, and `getUserActiveSessions()` (and so the concurrent-session limit) leaves expired sessions out. Sessions created before this release have no `expiresAt` and are governed by their token alone. 11. A revoked session stays revoked and a session's expiry can only move earlier, by any path including generated CRUD (`updateUserSession`). Enforced in the database by a `BEFORE UPDATE OF \"isValid\", \"expiresAt\"` trigger (migration `20261005160000_user_session_revocation_is_final`) that raises on `isValid` false -> true and on a later or cleared `expiresAt`. Revoking a session and reading sessions (admin user details, the data browser, `getUserSessions`) are unchanged."
        area: auth
        affectedPaths:
          - libs/api/prisma/src/lib/schemas/schema.prisma
          - libs/api/prisma/src/lib/migrations/20261005120000_user_auth_generation/migration.sql
