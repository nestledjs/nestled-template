  - id: 2026.10.10
    date: 2026-10-12
    title: Truthful typecheck, lint and e2e gates
    templateCommit: 6c81714
    notes:
      - id: 2026-10-10-truthful-test-and-typecheck-gates
        title: Typecheck, lint and e2e gates that check what they claim
        delivery: code-patch
        intent: "Make every project's typecheck cover all of its TypeScript and fail when it checks nothing, and make lint reach every project. Add scripts/typecheck-project.mjs and the local Nx plugin tools/nx-plugins/typecheck.js, and list the plugin last in nx.json plugins so its `typecheck` target replaces the inferred `tsc --noEmit -p tsconfig.lib.json`. The runner checks every config a project's tsconfig.json references inside the project (lib/app, spec, storybook) one at a time with `tsc --noEmit`, and fails when a config resolves no files, when an `exclude` inherited through `extends` removes files the config's own `include` asks for, or when a tracked .ts/.tsx file under the project, build-tool configs such as vite.config.ts included, is in no checked config. Only a nested directory with both its own project.json and tsconfig.json (one the plugin gives a target) counts as a separate project; either file alone does not hide its files. Projects whose typecheck target is written in project.json (apps/api with tsconfig.typecheck.json, apps/web after typegen) call the runner too, keeping their dependsOn. Typecheck inputs use `default`, not `production`, so spec edits invalidate the cache. Give every tsconfig.spec.json its own `exclude`. The workspace base config excludes `**/*.spec.ts`, `**/*.test.ts` and their tsx forms, and a spec config that inherits that exclude checks no spec at all. Add spec configs (and the solution-config reference) for libraries whose specs had none, and include test folders outside src (for example apps/web/tests) in the spec config that runs them. Then fix the type errors this exposes in tests, stories and tool configs rather than excluding files or loosening strict. Remove `@react-router/dev` and `@types/node` from apps/web/package.json devDependencies; the root manifest declares both. The app-level copies resolved a second Vite with different peers, whose Plugin type is nominally distinct from the root Vite's, so apps/web/vite.config.ts could not typecheck. Delete libs/api/core/data-access/src/lib/models/chapter-stats.ts and user-stats.ts. Nothing imports them and no index exports them; they surfaced once libs/api code had its own typecheck. Widen the web-ui social-links `member` prop from `Partial<User>` to `SocialLinkMember` (Partial<User> plus the facebook/twitter/linkedin/instagram/youtube fields the component reads), and fix stories that passed props their components do not have: the data-table `Loading` story becomes `Empty`, and the simple-list-item stories become `NotClickable`/`Clickable` with the `Selected` story removed. Rename the inferred ESLint target from `eslint:lint` to `lint` in nx.json so `pnpm lint` and CI's `nx affected -t lint` reach every project, and fix the lint errors this exposes. Point the root `pre-commit:lint` script at `lint` too (it ran `nx affected --target eslint`, a target no project has, so it linted nothing), and chain its format step with `&&` rather than `&`, which ran the formatter in the background and dropped its exit status. Make the API e2e result mean that the suite ran and passed. `api-e2e:e2e` runs the same wrapper as `api-e2e:test` (apps/api-e2e/run-tests.sh) instead of the Vitest executor, and both targets set `cache: false`. The wrapper reports PASSED only when Vitest exits 0, its summary counts no failure, and at least one test passed, and prints that count; a run with no test file, or with every test skipped, fails. Remove the wrapper's force-kill fallback, which accepted a non-zero exit when a \"Cleanup complete\" marker appeared: teardown no longer calls process.exit and nothing prints the marker. The e2e Vitest config sets `passWithNoTests: false` and the verbose reporter so the log names every test, and drops both `dangerouslyIgnoreUnhandledErrors` and the onUnhandledError filter for process.exit errors, so every unhandled error fails the run. Remove SKIP_API_CHECK and the `__SKIP_E2E_TESTS__` flag: global setup set it on globalThis, which never reaches the forked test worker, so the option produced a run of failures rather than a skip. Resolve the test database URL in one place. apps/api-e2e/src/support/test-db.ts exports testDatabaseUrl (TEST_DATABASE_URL, else `scripts/test-db.sh url`, the same answer the shell runners use); global setup, test setup and specs import it instead of each carrying the template's hard-coded fallback URL. Replace psql with the pg client: test-db.ts runs SQL through apps/api-e2e/src/support/sql-runner.mjs, which keeps `sql()` synchronous and its `psql -At` output (`|`-joined columns, server text values, one row per line, `:'name'` variables quoted as literals, statements run one at a time with autocommit). Global setup's database probe and disposable-database reset, and the wrapper's probe, use it too; the wrapper probe now uses the URL's own credentials rather than postgres:postgres. Add @types/pg to devDependencies. Stop the e2e API's whole process tree on native Windows. apps/api-e2e/src/support/api-process.ts exports ownedProcessOptions(): POSIX keeps the detached process group; Windows keeps the launcher attached and runs it through a shell, because pnpm is a .cmd shim that Node does not run without one (global setup's `pnpm prisma migrate deploy` gets the same shell). killApiProcessTree runs `%SystemRoot%\\System32\\taskkill.exe /PID <launcher> /T /F` on Windows and returns `tree`, treats taskkill's not-found status (128) as already stopped, never runs it for a launcher Node has already reaped, and throws on any other status, so teardown fails and the exit fallback retries. Teardown logs the tree it stopped. Add process-tree-fixture.mjs and api-process.native.spec.ts, which start a real launcher and descendant and check both stop on teardown, on SIGINT/SIGTERM cancellation and from the exit fallback, plus (on Windows) that a taskkill failure is reported; run them in test-support and in a windows-latest CI job."
        area: infra
        affectedPaths:
          - nx.json
          - scripts/typecheck-project.mjs
          - scripts/typecheck-project.spec.mjs
          - tools/nx-plugins/typecheck.js
          - apps/api/project.json
          - apps/web/project.json
          - apps/web/package.json
          - pnpm-lock.yaml
          - apps/web/tsconfig.spec.json
