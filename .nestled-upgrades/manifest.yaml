      - id: 2026-11-12-data-browser-list-filters
        title: The admin data browser no longer offers or sends filters on list-valued columns (@nestledjs/data-browser 1.0.29)
        delivery: package-release
        intent: "The generated `<Model>FilterInput` has no field for list-valued scalar or enum columns (`String[]`, an enum list such as `Role[]`): the CRUD generator leaves them out, because Prisma filters them with `has` / `hasSome` / `hasEvery`, which it does not model. Since 1.0.28 sends the typed filter input, the data browser's filter panel still offered an enum list on a related model as a related-enum filter (`relation.someEnumList`), and the converter sent it as `{ relation: { someEnumList: { equals } } }`, so GraphQL rejected the variables and the list failed to load. In 1.0.29 the panel offers related-enum filters only for single-valued enums, a URL parameter naming a list-valued column is ignored, and `toFilterInput` drops any value for a list-valued column, own or related, even in operator shape. Upgrade `@nestledjs/data-browser` to the version below in package.json and the lockfile. Do not copy files from libs/data-browser."
        area: admin
