      - id: 2026-10-04-auth-tokens-verified-before-claims-are-trusted
        title: Logout and end-emulation verify the token before trusting its claims
        delivery: code-patch
        intent: "Authentication hardening. `AuthService.decodeToken()` is replaced by `verifyToken(token, { ignoreExpiration? })`, which returns a token's claims only when its signature verifies (null otherwise), and every place that acted on claims read from a token now uses it: 1. `AuthResolver.logout` reads `{ sessionId, userId }` with `verifyToken(token, { ignoreExpiration: true })`, so an expired but genuine token can still end its own session. `AuthService.logout` now takes `(sessionId, userId)` and invalidates the session, and records LOGOUT, only when the session belongs to that user. A failed lookup propagates; the resolver still clears the cookie. 2. `AuthService.endEmulation(token)` verifies the token (expiry enforced) before reading it. 3. The resolver's current-session lookups (`changePassword`, `getUserSessions`) read the session id from a verified token."
        area: auth
        affectedPaths:
