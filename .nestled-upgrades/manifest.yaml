          - pnpm run nestled-doctor
          - gitleaks git . (from a fresh full clone)
        patch: patches/2026-11-12-wave-corrections.diff
      - id: 2026-11-12-config-spec-js-extensions
        title: The stale-config spec accepts a JavaScript extension that resolves to the TypeScript config (`./vite.config.mjs` for vite.config.mts)
        delivery: code-patch
        intent: "Apply after 2026-11-12-wave-corrections. Its part 3 made scripts/vite-config-module-format.spec.mjs fail on any import of a Vite or Vitest config that names no tracked file. But TypeScript and Vite resolve an import's JavaScript extension to the TypeScript source: `./vite.config.mjs` loads vite.config.mts and `./vite.config.js` loads vite.config.ts. The spec reported those working imports as stale. `staleConfigReferences` now accepts `.js` → `.ts`/`.tsx`, `.mjs` → `.mts` and `.cjs` → `.cts` for imports. A Vitest project path (the root config's `projects` list) is still read literally and must name the file exactly. Two new cases cover both rules. No package changes."
