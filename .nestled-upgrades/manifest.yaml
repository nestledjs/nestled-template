          - "Keep each app's structure and apply the same rule where its decision is made. Some apps nest the Me boundary inside another error boundary, so route errors never reach the root ErrorBoundary: put parts 1 and 2 (`awaitsFreshAnswer` and `DeferredAuthRecovery`) in the boundary that does catch them, the outermost one that survives App unmounting. Some resolve Me in the root loader, fetching it with `makeClient().query`: part 4 is the part that matters there (that loader's 401 is exactly the 500 it fixes), and part 3 applies to whatever renders a signed-in area with no user. Some have repo-local session helpers with several callers (`requireUser`, `useSession`, a `SessionProvider`): apply part 3's rule in the helper, so every caller re-checks Me and logs out only on `rejected`, rather than in each layout."
          - "Part 1: a project whose root ErrorBoundary is rendered outside a data router, or that has no `UNSAFE_DataRouterContext` (React Router older than 6.4), revalidates with `useRevalidator()` from a component that is inside the router, or reloads (`reloadForRecovery`). Keep the decision sticky per error object: without it the boundary re-renders when the revalidation starts and shows the error screen, or logs out, over the old 401."
