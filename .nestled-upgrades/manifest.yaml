  - id: 2026.11.3
    date: 2026-11-09
    title: "R3: parallel CI, commit and session hooks, Sonar rules digest, error recovery"
    templateCommit: e5d448e
    notes:
      - id: 2026-11-09-ci-parallel-jobs
        title: CI runs as parallel jobs with per-process heaps, an aggregate CI check, an affected gate on the API e2e job, a gitleaks job, and a configurable e2e readiness wait
        delivery: code-patch
        intent: ".github/workflows/ci.yml is rewritten from one `main` job (plus the Windows job) into parallel jobs, each on its own machine. Nothing it checked before is dropped; every step moves to one of these jobs: - `affected` (Affected): on a pull request, asks Nx whether `api-e2e` is affected (`nx show projects --affected --json | jq -r '.[]'` and an exact-line membership check, not `--projects`, which `nx affected` forwards to every task as an override). On a push it always says yes. - `static` (Static checks): the nxCloudId guard, the public content guard tests, `template:validate-upgrade-notes`, `nestled-doctor`, `prettier --check .`, the three `verify:*` select checks, `node --test scripts/*.spec.mjs`, `typecheck:workspace`, and `node scripts/sonar-rules-digest.mjs --check` (from 2026-11-09-sonar-rules-digest). - `gitleaks` (Secret scan): downloads gitleaks 8.30.1 from its GitHub release, checks the published SHA-256, and scans the pull request's commits (`base..head`) or the pushed range (`before..sha`; the whole history when there is no usable `before`). It reads `.gitleaks.toml` at the repository root, which extends the default rules and allowlists three placeholder encryption keys in the template's two-factor auth specs. The gitleaks GitHub Action is not used because it needs a paid licence on organisation repositories. - `lint`: `nx affected -t lint --parallel=3`, 2 GB heap. - `build-api` and `build`: the API's webpack build alone with a 6 GB heap (only when `api` is affected), and `nx affected -t build --exclude=api --parallel=2` with 3 GB. - `typecheck`: `nx run-many -t typecheck --parallel=3`, 2 GB heap, unscoped. - `tests-api` and `tests-web`: `nx run-many -t test --parallel=2 -- --coverage` (3 GB), split by a workflow-level `WEB_TEST_PROJECTS` list. `tests-web` runs that list with `--projects`; `tests-api` runs every other project with `--exclude`, so a new project is tested without being listed. `tests-api` has the Redis service; `tests-web` is the only job that installs Playwright Chromium (web-ui's Storybook browser tests), with `~/.cache/ms-playwright` cached by Playwright version through `actions/cache`. Each uploads its `coverage` directory as a `coverage-*` artifact. - `api-e2e`: the API e2e run with the Postgres and Redis services, 6 GB heap, `E2E_API_START_TIMEOUT_SECONDS: 300`. On a pull request it runs only when `affected` says so. - `generated-artifacts`: runs `pnpm db-update` (with the compose images pulled from Google's Docker Hub mirror and retagged) and fails if any tracked file changed. scripts/db-update.mjs now drops `NX_CLOUD_ACCESS_TOKEN` and `NX_CLOUD_AUTH_TOKEN` from the environment of its API build and sets `NX_NO_CLOUD=true`, instead of replacing them with the `db-update-disabled` placeholder it gives every other credential: with the placeholder, Nx refused to run (\"Workspace is unable to be authorized\"), in CI and on any machine with the token in `.env`. - `sonar`: needs only the three test jobs, runs when none failed or was cancelled (a skipped `api-e2e` is fine), downloads `coverage-*` with `merge-multiple: true`, normalizes the lcov paths and scans with `SonarSource/sonarqube-scan-action` (the deprecated `sonarcloud-github-action` is gone). Still skipped when there is no `SONAR_TOKEN`. - `windows-process-cleanup`: unchanged. - `ci-ok`, named `CI`: `if: always()`, needs every job above, and fails unless each one succeeded. The only accepted skip is `api-e2e` on a pull request. Shared setup is in two composite actions: `.github/actions/setup` (pnpm, Node 22.23.4 with the pnpm cache, `pnpm install --frozen-lockfile --ignore-scripts`, `pnpm prisma:generate`) and `.github/actions/nx-base` (nrwl/nx-set-shas with `main-branch-name: develop`). Every Linux job uses `runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}`, and each sets its own `NODE_OPTIONS=--max-old-space-size=...` instead of one job-wide value, sized so heap times parallelism plus 1 GB stays under the 7.9 GB of GitHub's standard private-repository runner. The concurrency block, the Nx Cloud token selection and the service images are unchanged. No suite is sharded in the template: its longest test target (api-custom, about 1.5 minutes) is about as long as the typecheck, and every test target is already cached in Nx with its coverage directory as an output, so a cache hit restores the lcov the scan reads. API e2e readiness: apps/api-e2e/src/support/global-setup.ts waited a fixed 120 seconds for the API it started with `nx serve api`, which builds the API first. It now waits `E2E_API_START_TIMEOUT_SECONDS` (default 300; an unusable value warns and uses the default), and on a timeout prints the API's last 40 non-empty output lines. The helpers are in the new apps/api-e2e/src/support/api-readiness.ts with a spec in the support suite (vitest.support.config.mts and tsconfig.support.json list both). apps/api-e2e/README.md documents the variable."
        area: infra
        affectedPaths:
          - .github/workflows/ci.yml
          - .github/actions/setup/action.yml
          - .github/actions/nx-base/action.yml
          - .gitleaks.toml
          - scripts/db-update.mjs
          - apps/api-e2e/src/support/global-setup.ts
          - apps/api-e2e/src/support/api-readiness.ts
          - apps/api-e2e/src/support/api-readiness.spec.ts
          - apps/api-e2e/vitest.support.config.mts
          - apps/api-e2e/tsconfig.support.json
          - apps/api-e2e/README.md
        verification:
          - "pnpm exec nx run api-e2e:test-support --skip-nx-cache"
          - pnpm exec prettier --check .
          - pnpm run nestled-doctor
          - "docker run --rm -v \"$PWD:/repo\" -w /repo rhysd/actionlint:1.7.12 -color"
          - "In the pull request: every job is green, including the aggregate `CI` check, and SonarCloud reports coverage for the pull request."
        patch: patches/2026-11-09-ci-parallel-jobs.diff
      - id: 2026-11-09-error-recovery-r3
        title: "Error recovery R3: keep the session when the server render cannot reach the API, Me retry backoff, re-arm the confirmation timer, separate offline and server-trouble messages"
        delivery: code-patch
        intent: "Follow-up to 2026-11-04-error-recovery-followups (apply that first; this note changes the code it added). Four parts, in the web app and the shared Apollo lib. No package changes. 1. A connectivity failure during the server render signed the user out. apps/web/app/entry.server.tsx `onShellError` cleared the session cookie and 302'd to /force-logout whenever the shell error was Apollo's redacted stream error (\"Error from event stream. Redacted for security concerns.\"). The streamed query ref redacts every preload failure, so a rejected token and an unreachable API looked the same, and a signed-in user who reloaded while the API was down or restarting was logged out. The real cause is now recorded where it is still visible, in the loader's own Apollo client: - libs/shared/apollo/src/lib/apollo.ts: new `classifyApiFailure(error)` returns `unauthenticated` (HTTP 401, or a GraphQL authentication error such as `UNAUTHENTICATED`, by the same test the error link uses to log out), `unavailable` (`isRetryableConnectivityError`: no response, or a proxy's 502/503/504) or `other` (any other answered error). `makeClient` takes a new `onApiFailure(cause)` option; the error link calls it for each failed operation. - libs/shared/apollo/src/lib/apollo-loader.ts: `apolloLoader` builds each loader's client with `onApiFailure`, records the most decisive cause (unauthenticated > unavailable > other), and attaches the record to the data the loader returns under a non-enumerable symbol key (never serialized to the browser, invisible to code reading the data; a returned Response passes through untouched). New `ssrApiFailureCause(loaderData)` reads it back. Loaders keep the same `apolloLoader()(...)` call; nothing changes in the routes. - apps/web/app/entry.server.tsx: `onShellError` reads `ssrApiFailureCause(routerContext.staticHandlerContext.loaderData)` and decides with the new exported `shellErrorOutcome(error, cause)`. `unauthenticated` clears the cookie and 302s to /force-logout exactly as before (same cookie name and domain logic, same `return_url`). `unavailable`, or a redacted Apollo error with no recorded cause, keeps the cookie and rejects with `new Response(null, { status: 503 })`: React Router renders the root ErrorBoundary for that 503, which shows the self-recovering screen and reloads once the API answers. Any other shell error (an ordinary render error, or an API that answered with some other error) is rejected unchanged and gets React Router's 500 handling, as before. An unknown cause therefore never destroys a session; a real 401 comes back on the client and goes through the normal 401 path there. No reachability probe from the server is needed: the recorded cause decides, and an unknown cause fails safe either way. 2. The Me retry backoff reset on cached data. apps/web/app/app.tsx: `AppWithUser` called `onLoaded` on every render with a query ref, so under the default `cache-and-network` policy a cached Me reset the backoff before the network request failed again, and a /graphql that kept failing while /api/uptime answered was retried without backing off. It now calls `onLoaded` only when `useReadQuery` reports `networkStatus === NetworkStatus.ready` (the network answered). `handleMeLoaded` then also cancels a retry still queued from the outage (`clearTimeout`, timer set to undefined) and clears `meFailedOfflineRef`, so that retry no longer revalidates every loader once more after recovery. 3. The confirmation timer was not re-armed after an effect replay. apps/web/app/api-availability.ts, `useApiAvailability`: the mount effect's cleanup cancels the pending timer, but setup only rescheduled in the `unavailable` phase. A failure reported before a replay (React StrictMode in development, or any re-run) left the phase stuck at `confirming`. Setup now re-arms whatever the phase needs: the confirmation step at `CONFIRM_DELAYS_MS[confirmAttemptRef.current]` while `confirming`, the retry while `unavailable`. The hook also returns `phase`. 4. Separate \"you are offline\" and \"our servers are in trouble\" messages. - apps/web/app/api-availability.ts: new `probeConnectivity()` replaces `probeApi` as the hook's default probe. With `navigator.onLine === false` it reports `offline` without a request. It probes /api/uptime as before; a proxy's 502/503/504 reports `server` (the connection works). When the API does not answer at all it sends a HEAD to the web app's own origin (`webOriginProbeUrl()`, `/favicon.ico`; any HTTP answer counts, a 404 included, so no new route is needed): an answer reports `server`, none reports `offline`. The hook returns `reason: 'offline' | 'server'` (and `offline` as shorthand), re-checked on every probe, and set at once by the browser's `offline` (offline) and `online` (server, until the probe it triggers says otherwise) events. The `probe` option may return a boolean as before or `{ reachable, reason }`; a new `initialReason` option sets the reason before the first probe. Phases, delays and debounce are unchanged; `probeApi` is kept. - apps/web/app/api-unavailable.tsx: `ApiUnavailableScreen` takes `reason` instead of `offline`, and an optional `copy` prop (`ApiUnavailableCopy`: `offlineTitle`, `offlineMessage`, `serverTitle`, `serverMessage`, `retryLabel`); keys left out fall back to the English in `API_UNAVAILABLE_COPY`. The offline copy is unchanged (\"You’re offline\" / \"We’ll reconnect automatically when your connection is back.\"). The server copy is new and has its own keys: `SERVER_TROUBLE_TITLE` \"We’re having trouble reaching our servers\" and `SERVER_TROUBLE_MESSAGE` \"Retrying automatically.\" (they replace `SERVER_DOWN_TITLE` \"Can’t reach the server\" and `SERVER_DOWN_MESSAGE`). Both keep the \"Try again\" button. `RecoveringApiUnavailable` passes `initialReason` and `copy` through. - apps/web/app/root.tsx: the root ErrorBoundary passes `initialReason=\"server\"` for a 502/503/504 route response, so the server-rendered 503 from part 1 always opens with the server-trouble message: the page reached the browser, so the connection works. - apps/web/app/app.tsx passes `reason={api.reason}` to both of its `ApiUnavailableScreen`s. Tests: apps/web/tests/entry-server-shell-error.spec.tsx (new; renders through React Router's request handler, the real entry.server.tsx and root route, with the Me preload going through the production Apollo client to a stubbed fetch: unreachable API and 502/503/504 give a 503 with the server-trouble screen and no Set-Cookie; 401 and UNAUTHENTICATED clear the cookie and 302 to /force-logout with return_url; a redacted error with no recorded cause gives 503 and keeps the cookie; an ordinary render error stays a 500), apps/web/tests/api-availability.spec.tsx (offline vs server: onLine false, web answers but API does not, neither answers, online/offline events and between retries, the 503 route response, translated copy; `probeConnectivity`; the effect replay under StrictMode; the Me backoff and the queued retry under `cache-and-network`) and libs/shared/apollo/src/lib/apollo.spec.ts (`classifyApiFailure`, `onApiFailure`, the `apolloLoader` record). apps/web/vite.config.ts inlines `@apollo/client-integration-react-router` in Vitest (`test.server.deps.inline`) so the server-render test shares one `react-router` instance; no effect on the app build."
        area: web
        affectedPaths:
          - apps/web/app/entry.server.tsx
          - apps/web/app/api-availability.ts
          - apps/web/app/api-unavailable.tsx
          - apps/web/app/app.tsx
          - apps/web/app/root.tsx
          - libs/shared/apollo/src/lib/apollo.ts
          - libs/shared/apollo/src/lib/apollo-loader.ts
          - apps/web/vite.config.ts
          - apps/web/tests/entry-server-shell-error.spec.tsx
          - apps/web/tests/api-availability.spec.tsx
          - apps/web/tests/routes/authenticated-layout-me-recovery.spec.tsx
          - libs/shared/apollo/src/lib/apollo.spec.ts
        verification:
          - pnpm typecheck
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec nx test apollo --skip-nx-cache
          - pnpm exec nx build web --skip-nx-cache
          - pnpm run nestled-doctor
          - "Manual: build and serve the web app with the API stopped. Signed in, reload a signed-in page: the response is a 503, the session cookie is still there, and the screen says \"We’re having trouble reaching our servers\". Start the API: the page reloads by itself, still signed in. Then take the browser offline (devtools, or Playwright `context.setOffline(true)`) and make a request fail: the screen says \"You’re offline\", and changes back when the connection returns."
        patch: patches/2026-11-09-error-recovery-r3.diff
      - id: 2026-11-09-precommit-and-session-hooks
        title: A dependency-free pre-commit hook (Prettier and gitleaks on staged files) and a Claude Code cloud SessionStart hook that installs dependencies
        delivery: code-patch
        intent: "1. New `.githooks/pre-commit` (executable, POSIX sh). On the staged files only (`git diff --cached --name-only --diff-filter=ACMR -z`, NUL-separated so unusual paths are not quoted) it runs `node_modules/.bin/prettier --write --ignore-unknown` and re-stages them with `git add`. When node_modules has no Prettier it prints that the files were not formatted and lets the commit through (CI's `prettier --check .` is the gate; a hook that fails there would push people to --no-verify). Then, if `gitleaks` is on the PATH, it runs `gitleaks git --pre-commit --staged --redact` and a finding blocks the commit; otherwise it prints one line saying the secret scan was skipped. CI's gitleaks job (note 2026-11-09-ci-parallel-jobs) is the enforced layer, and both read `.gitleaks.toml`. 2. Root package.json, by hand (package.json is not mirrored by promotion): add `\"prepare\": \"git config core.hooksPath .githooks || true\"` to `scripts`. `pnpm install` runs it and wires the hook. It no-ops where there is no `.git` (Railway and Docker builds) or no git at all, through `|| true`, and CI installs with `--ignore-scripts`, so it never runs there. No husky or lint-staged: their transitive dependencies re-key the pnpm lockfile. 3. New `.claude/hooks/session-start.sh` (executable) and a `hooks.SessionStart` entry in `.claude/settings.json` (matcher `startup|resume`, command `sh \"$CLAUDE_PROJECT_DIR/.claude/hooks/session-start.sh\"`, timeout 600). It does nothing unless `CLAUDE_CODE_REMOTE=true` (a Claude Code cloud session). It skips when `node_modules/.session-start-lockfile-hash` matches `git hash-object` of pnpm-lock.yaml and the Prisma schema, the Prisma client exists and `core.hooksPath` is `.githooks`. Otherwise it runs `pnpm install --frozen-lockfile` (with scripts, so `prepare` wires the hook; `npm_config_engine_strict=false` so a patch-level Node difference in the cloud image does not refuse the install, while a different major still stops it) and `pnpm prisma:generate`, then writes the marker. On any failure it prints what failed and how to format by hand, and exits 0 so the message reaches the session's context. 4. CLAUDE.md, by hand (CLAUDE.md is not mirrored by promotion), add near the top: \"Commits: `.githooks/pre-commit` formats the staged files with Prettier. If the hook did not run, format the files you changed (never the whole tree) with `pnpm exec prettier --write <files>` before committing; never use `--no-verify`.\" AGENTS.md's commit guidelines in the template say the same; add a sentence to the project's own AGENTS.md if it has a commit section."
        area: infra
        affectedPaths:
          - .githooks/pre-commit
          - .claude/hooks/session-start.sh
          - .claude/settings.json
          - package.json
          - CLAUDE.md
          - AGENTS.md
        verification:
          - pnpm install
          - git config core.hooksPath
          - "Stage an unformatted file and commit on a throwaway branch: the commit contains the formatted file. Then discard the branch."
          - CLAUDE_CODE_REMOTE=true CLAUDE_PROJECT_DIR="$PWD" sh .claude/hooks/session-start.sh
          - pnpm exec prettier --check .
        patch: patches/2026-11-09-precommit-and-session-hooks.diff
      - id: 2026-11-09-sonar-rules-digest
        title: A generated digest of the active SonarCloud TypeScript rules, linked from AGENTS.md
        delivery: code-patch
        intent: "New `scripts/sonar-rules-digest.mjs` writes `docs/quality/sonar-rules.md` from `docs/quality/sonar-rules.json`, a committed copy of the active rules of the project's TypeScript quality profile. The digest lists each rule once with its severity and a link to its description, grouped as React/JSX/accessibility, tests, bugs, vulnerabilities and code smells, and leaves out rules tagged for frameworks the template does not use (the JSON's `excludeTags`: angular, vue, aws, gcp, cypress, mocha and so on), saying how many. Both files are formatted with the repository's Prettier. - `node scripts/sonar-rules-digest.mjs` regenerates the digest from the JSON, with no network. - `--check` exits 1 when the digest does not match the JSON; CI's `static` job runs it. - `--refresh` re-fetches the list: it reads `sonar.organization` and `sonar.projectKey` from sonar-project.properties, finds the project's `ts` quality profile through SonarCloud's `api/qualityprofiles/search` and pages `api/rules/search` (`activation=true`). A public organization answers anonymously; a private one needs `SONAR_TOKEN`. `SONAR_HOST_URL` overrides https://sonarcloud.io. `scripts/sonar-rules-digest.spec.mjs` covers the properties parser, the grouping, sorting and exclusion, the Markdown, the paged fetch (with a stubbed fetch) and the three modes. CI runs it with the other `node --test scripts/*.spec.mjs` specs. Root package.json, by hand (not mirrored by promotion): add `\"sonar:rules-digest\": \"node scripts/sonar-rules-digest.mjs\"` to `scripts`. AGENTS.md, by hand (not mirrored by promotion): in the \"SonarQube Quality Expectations\" section, link `docs/quality/sonar-rules.md`, say it is generated by `pnpm sonar:rules-digest` from the committed JSON (`--refresh` re-fetches it), and keep the hand-written list of the findings that come up most often."
        area: docs
        affectedPaths:
          - scripts/sonar-rules-digest.mjs
          - scripts/sonar-rules-digest.spec.mjs
          - docs/quality/sonar-rules.json
          - docs/quality/sonar-rules.md
          - package.json
          - AGENTS.md
        verification:
          - node scripts/sonar-rules-digest.mjs --refresh
          - node scripts/sonar-rules-digest.mjs --check
          - node --test scripts/sonar-rules-digest.spec.mjs
          - pnpm exec prettier --check docs/quality scripts
        patch: patches/2026-11-09-sonar-rules-digest.diff
  - id: 2026.11.4
    date: 2026-11-10
    title: "R5b: Nx 24, TypeScript 6, ESLint 10, R3 follow-ups"
    templateCommit: 7c0f1c0
    notes:
      - id: 2026-11-10-data-browser-offline-copy
        title: The admin data browser tells "you're offline" from "our servers are in trouble", like the app shell (@nestledjs/data-browser 1.0.27)
        delivery: hybrid
        intent: "Follow-up to 2026-11-09-error-recovery-r3, which gave the app shell's recovering screen separate offline and server-trouble messages. Apply that note first: this one uses its `probeConnectivity()` in apps/web/app/api-availability.ts. Two parts. 1. Package. Upgrade `@nestledjs/data-browser` to 1.0.27 in package.json and the lockfile. Do not copy files from libs/data-browser. The admin data routes' recovering panel (shown by `AdminDataErrorBoundary`, `AdminDataCreateErrorBoundary`, `AdminDataEditErrorBoundary` and `AdminRouteErrorBoundary` for a network error) used to say \"Can't reach the server\" whenever the browser was online. It now shows one of two messages, with the shell's wording and rule: - offline: \"You’re offline\" / \"We’ll reconnect automatically when your connection is back.\"; - server trouble: \"We’re having trouble reaching our servers\" / \"Retrying automatically.\" The reason is re-checked on every probe (backoff, \"Try Again\", the tab being shown again) and set at once by the browser's `offline` (offline) and `online` (server, until the probe it triggers says otherwise) events. Package API, all additive: - The `probe` option (on `AdminDataProvider` and on each boundary) may now resolve `{ reachable: boolean, reason?: 'offline' | 'server' }`, the shape `probeConnectivity()` returns (`AdminApiProbeResult`, `AdminUnavailableReason`). A probe that resolves a plain boolean keeps working: the panel then shows offline when `navigator.onLine` is false and server trouble otherwise. - Without any probe the panel uses the new `probeAdminConnectivity()`: offline when `navigator.onLine` is false or a HEAD on the web app's own `/favicon.ico` gets no answer; otherwise it revalidates the route. - Copy is overridable for i18n: new exports `ADMIN_SERVER_TROUBLE_TITLE`, `ADMIN_SERVER_TROUBLE_MESSAGE`, `ADMIN_RETRY_LABEL`, `ADMIN_BACK_LINK_LABEL` and `ADMIN_API_UNAVAILABLE_COPY` (alongside the existing `ADMIN_OFFLINE_TITLE` / `ADMIN_OFFLINE_MESSAGE`), type `AdminApiUnavailableCopy` (`offlineTitle`, `offlineMessage`, `serverTitle`, `serverMessage`, `retryLabel`, as in the shell's `ApiUnavailableCopy`, plus `backLinkLabel`). Pass `unavailableCopy` on `AdminDataProvider`, or `copy` on a boundary; keys left out fall back to the English, and a boundary's `copy` wins over the provider's. - `ADMIN_SERVER_DOWN_TITLE` and `ADMIN_SERVER_DOWN_MESSAGE` are still exported, unchanged, but deprecated and no longer shown. A test that looked for \"Can’t reach the server\" in the admin panel now looks for `ADMIN_SERVER_TROUBLE_TITLE`. - New helpers `normalizeAdminProbeResult()` and `adminWebOriginProbeUrl()`; `useAdminApiRecovery()` also returns `reason`. 2. App. In apps/web/app/routes/admin/data/_layout.tsx, pass the shell's reason-aware probe to `AdminDataProvider` instead of `probeApi`: import { probeConnectivity } from '../../../api-availability' const probeAdminApi = () => probeConnectivity() // <AdminDataProvider ... probe={probeAdminApi}> `probeApi` stays exported for anything else that uses it."
