      - id: 2026-11-14-api-auth-error-codes
        title: "The API keeps 401 / UNAUTHENTICATED for a dead session only: no active organization becomes a 403 ORGANIZATION_CONTEXT_REQUIRED, a provider-rejected OAuth link a 403 OAUTH_PROVIDER_REJECTED, and the web keeps the session for both"
        delivery: code-patch
        intent: "Follow-up to 2026-11-11-logout-only-on-unambiguous-401 (apply it first). Clients log a user out on an HTTP 401 or a GraphQL error whose `extensions.code` is `UNAUTHENTICATED`, and `@nestjs/apollo` gives that code to every `UnauthorizedException`. So anything the API throws as Unauthorized that is not \"the session or token is missing, invalid or expired\" logs the user out. The rule: a dead session stays a 401; a permission denial, a business-rule failure or \"you need a different/elevated session\" is a `ForbiddenException` (403), with a specific code when a client should handle it on its own terms. No package changes. 1. API: a 403 with its own GraphQL code, and no organization context. New libs/api/utils/src/lib/errors/api-error-code.ts (exported from `@nestled-template/api/utils`): `API_ERROR_CODES` (`ORGANIZATION_CONTEXT_REQUIRED`, `OAUTH_PROVIDER_REJECTED`), `forbiddenWithCode(code, message)` (a `ForbiddenException` whose body is `{ statusCode: 403, error: 'Forbidden', message, code }`), `organizationContextRequired(message?)`, and `formatApiError`, the GraphQL `formatError`. `@nestjs/apollo` runs first and overwrites the code of every HTTP exception with the one for its status (403 -> FORBIDDEN), keeping the body as `extensions.originalError`; `formatApiError` puts back the body's `code` (upper snake case only), and never on a 401 or as `UNAUTHENTICATED`. libs/api/core/feature/src/lib/api-core-feature.module.ts passes `formatError: formatApiError` to `GraphQLModule.forRoot`. `CtxOrganization` and `CtxOrganizationId` (libs/api/utils/src/lib/decorators/ctx-organization.decorator.ts) threw `UnauthorizedException('Organization context required...')` when the active organization was missing or stale, so a signed-in user with no organization (or one removed from theirs) was logged out by any query that read it, including `currentSubscriptionActive`, which the signed-in layout runs on every page. They now throw `organizationContextRequired()`: a 403 with `extensions.code: 'ORGANIZATION_CONTEXT_REQUIRED'` and `extensions.originalError.statusCode: 403`. The other \"no organization context\" refusals, already 403 `FORBIDDEN`, get the same code so clients see one shape: `PermissionsGuard` (permissions.guard.ts), `GqlOrganizationScopedGuard` when no context attaches (gql-organization-scoped.guard.ts), and `SubscriptionGuard` when no organization attaches (subscription.guard.ts). Their messages are unchanged. Affected paths: libs/api/utils/src/lib/errors/api-error-code.ts, libs/api/utils/src/lib/errors/api-error-code.spec.ts, libs/api/utils/src/index.ts, libs/api/utils/src/lib/decorators/ctx-organization.decorator.ts, libs/api/utils/src/lib/guards/permissions.guard.ts, libs/api/utils/src/lib/guards/gql-organization-scoped.guard.ts, libs/api/utils/src/lib/guards/subscription.guard.ts, libs/api/core/feature/src/lib/api-core-feature.module.ts, apps/api-e2e/src/auth/auth-error-codes.spec.ts. Verification: `pnpm exec nx test api-utils --skip-nx-cache` (api-error-code.spec.ts runs a real Nest GraphQL module with `formatApiError`: `CtxOrganizationId` / `CtxOrganization` with no context answer `ORGANIZATION_CONTEXT_REQUIRED` with `originalError.statusCode` 403, an `UnauthorizedException` still answers `UNAUTHENTICATED`, and a 403 that claims `UNAUTHENTICATED` stays `FORBIDDEN`); the API e2e suite (auth-error-codes.spec.ts: a bad bearer gets `UNAUTHENTICATED` with `originalError.statusCode` 401; a signed-in user whose active organization is one it does not belong to gets `ORGANIZATION_CONTEXT_REQUIRED` with 403 on `currentSubscriptionActive`, and `me` still answers). By hand against a running API: `curl -s localhost:3000/graphql -H 'content-type: application/json' -H 'authorization: Bearer bad' -d '{\"query\":\"{ currentSubscriptionActive }\"}'` shows `\"code\":\"UNAUTHENTICATED\"`; the same with a real token for a user with no active organization shows `\"code\":\"ORGANIZATION_CONTEXT_REQUIRED\"` and `\"statusCode\":403`. 2. API: the audit of every other `UnauthorizedException`. Verdicts in the template: - libs/api/custom/src/lib/plugins/auth/oauth.service.ts `verifyGoogleToken` (bad payload, failed verification) and `verifyGitHubCode` (profile fetch failed, no verified email, failed code exchange): these say the provider refused a token or code, not that the session is bad, and `linkOAuthAccount` calls them inside a signed-in session, so a failed provider check logged the user out. Now `forbiddenWithCode('OAUTH_PROVIDER_REJECTED', <same message>)` through a local `providerRejected(message)`; the rethrow guards check `ForbiddenException` instead of `UnauthorizedException`. The sign-in callback (oauth.controller.ts `handleCallback`) catches every error and redirects to /auth/oauth-error?error=authentication_failed, so the login flow and its messages are unchanged. Password login, 2FA and invitation failures were already `BadRequestException` and are untouched. - oauth.service.ts `unlinkOAuthAccount` \"User not found\": the session's own user no longer exists, a dead session. Stays 401. - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts (invalid payload, user missing or disabled, session invalidated): dead session. Stays 401. - libs/api/utils/src/lib/guards/access-policy.guard.ts `if (!request.user?.id) throw new UnauthorizedException()`: no authenticated user. Stays 401. access-policy.decorator.ts only mentions it in a comment. - libs/api/utils/src/lib/guards/subscription.guard.ts `HttpException('Authentication required', 401)` with no user: stays 401. - libs/api/custom/src/lib/plugins/mcp/mcp.controller.ts (no or invalid bearer, RFC 6750 challenge) and mcp-oauth.controller.ts `login_required` (no session cookie): REST, for MCP clients, and both are \"no valid credential\". Stay 401. - libs/shared/apollo/src/lib/apollo.ts: client code, mentions it in a comment only. - No `AuthenticationError` remains anywhere. Affected paths: libs/api/custom/src/lib/plugins/auth/oauth.service.ts, libs/api/custom/src/lib/plugins/auth/oauth.service.spec.ts. Verification: `pnpm exec nx test api-custom --skip-nx-cache` (oauth.service.spec.ts: every provider refusal, including `linkOAuthAccount` with a token Google rejects, is a 403 `ForbiddenException` with body code `OAUTH_PROVIDER_REJECTED` and not an `UnauthorizedException`); `grep -rn \"UnauthorizedException\\|AuthenticationError\\|HttpStatus.UNAUTHORIZED\\|status(401)\" apps/api libs/api` lists only the dead-session sites above. 3. Web: keep the session, and say what is wrong. libs/shared/apollo/src/lib/apollo.ts exports `ORGANIZATION_CONTEXT_REQUIRED_CODE`, and the error link's `isForbiddenError` now treats the whole 403 family as access denied: `FORBIDDEN`, or any other code whose `extensions.originalError.statusCode` is 403 (what `forbiddenWithCode` produces), except `ORGANIZATION_CONTEXT_REQUIRED`. Only `UNAUTHENTICATED` or an HTTP 401 ever logs out, as before, so none of these do. A query refused with `ORGANIZATION_CONTEXT_REQUIRED` (for example `currentSubscriptionActive`, which the signed-in layout's subscription context runs on every page) dispatches the new `APOLLO_ORGANIZATION_REQUIRED_EVENT`; a mutation is left to the UI that called it. New apps/web/app/organization-required.tsx: `isOrganizationContextRequired(error)` (a `CombinedGraphQLErrors`, or the older `graphQLErrors` shape, carrying the code) and the `OrganizationRequired` picker. It lists the user's organizations (`myOrganizations`); choosing one calls `switchActiveOrganization`, stores the id as `activeOrganizationId` in localStorage (the client sends it as `X-Organization-ID`, which the API reads before the user's active organization, so a stale stored id would keep the refusal) and reloads. With no organizations it says so and offers a normal sign-out (a link to /logout). A failed switch shows a message and leaves the list up to try again; a failed list load shows a message and \"Try again\". The session is kept in every case. It is shown from three places: - apps/web/app/app.tsx: on `APOLLO_ORGANIZATION_REQUIRED_EVENT` (state cleared on navigation, like the access-denied state), ahead of the access-denied screen; - apps/web/app/root.tsx `ErrorBoundary` (`refusalScreen`): for that code from a loader or suspense query, after the 401 / deferred-auth recovery checks of 2026-11-14-session-recovery-gaps, which are unchanged; - the signed-in layout's Me re-check (2026-11-14-session-recovery-gaps): apps/web/app/session-recheck.tsx `sessionRecheckOutcome` returns `organization-required` for that code, and apps/web/app/routes/_authenticated/_layout.tsx renders the picker for it: no /force-logout, and no retry, since asking again gets the same answer until an organization is chosen. Affected paths: libs/shared/apollo/src/lib/apollo.ts, libs/shared/apollo/src/lib/apollo.spec.ts, apps/web/app/organization-required.tsx, apps/web/app/app.tsx, apps/web/app/root.tsx, apps/web/app/session-recheck.tsx, apps/web/app/routes/_authenticated/_layout.tsx, apps/web/tests/organization-required.spec.tsx, apps/web/tests/auth-error-navigation.spec.tsx, apps/web/tests/routes/authenticated-layout-me-recovery.spec.tsx. Verification: `pnpm exec nx test apollo --skip-nx-cache` (a `CurrentSubscriptionActive` query answered with `ORGANIZATION_CONTEXT_REQUIRED` dispatches the organization-required event and does not log out; a mutation answered with it dispatches nothing; another coded 403 dispatches access-forbidden and does not log out; `classifyApiFailure` calls the code `other`); `pnpm exec nx test web --skip-nx-cache` (organization-required.spec.tsx: the list renders; choosing one switches, stores the id and reloads; with none, the copy and the Sign out link to /logout appear; a failed switch shows the message, keeps the list and never reloads or logs out; auth-error-navigation.spec.tsx: the root `ErrorBoundary` and the App event both show the picker, never `location.assign`; authenticated-layout-me-recovery.spec.tsx: a Me re-check answered with the code shows the picker, stays on the page and asks Me only once). 4. Web: the picker stores the organization and reloads only after the switch succeeded. apps/web/app/organization-required.tsx read a failed `switchActiveOrganization` with try/catch, but the app's client (`makeClient`) sets `defaultOptions.mutate.errorPolicy: 'all'`, under which a GraphQL refusal (the API answering the mutation with an error, for example \"You are not a member of this organization\") resolves with the error instead of throwing. The catch never ran: the picker stored the refused id as `activeOrganizationId` and reloaded, and the reload, sending that id as `X-Organization-ID`, got the same refusal again. The `useMutation` call now passes `errorPolicy: 'none'`, so a GraphQL error rejects, the catch shows `SWITCH_FAILED_MESSAGE` and keeps the list up, and nothing is stored or reloaded. The rest of the 2026-11-14 code was checked for the same pattern (errors read with try/catch, or `.then`/`.catch`, on a call that inherits `errorPolicy: 'all'`): session-recheck.tsx's Me query already passes `errorPolicy: 'none'`, and the picker's `myOrganizations` `useQuery` reads `error` from the hook result (`watchQuery` has no `errorPolicy` default in `makeClient`), so neither needed a change. Affected paths: apps/web/app/organization-required.tsx, apps/web/tests/organization-required.spec.tsx. Verification: `pnpm exec nx test web --skip-nx-cache` (organization-required.spec.tsx, whose client now takes `makeClient`'s `defaultOptions`: a switch the API refuses with a GraphQL error shows the message, leaves the button enabled, never reloads or calls `location.assign`, and leaves `activeOrganizationId` unset). 5. Web: a loader's ORGANIZATION_CONTEXT_REQUIRED during the server render shows the picker, not the generic error page. A loader that awaits a query the API refuses with `ORGANIZATION_CONTEXT_REQUIRED` throws a `CombinedGraphQLErrors` carrying the code. In production React Router replaces it with a bare \"Unexpected Server Error\" before `handleRequest` runs, so `handleError` (apps/web/app/entry.server.tsx) recorded it only as `other`, the root `ErrorBoundary` got the sanitized error, and a signed-in user with no active organization saw the generic error page instead of the picker. `handleError` now also records, per request, whether the error was that refusal (`isOrganizationContextRequired`), the same way it records a 401's cause (2026-11-14-session-recovery-gaps parts 4 and 8); only that fact is kept, never the error or its message. `routeErrorOutcome` takes it as a fourth argument (`thrownOrganizationRequired`, default false) and returns the new outcome `organization-required` when neither `force-logout` nor `unavailable` applies; `handleRequest` then keeps the cookie and rejects with `organizationRequiredResponse()` (new in apps/web/app/organization-required.tsx: a 403 whose JSON data is `{ code: 'ORGANIZATION_CONTEXT_REQUIRED' }` and nothing else). React Router renders the root `ErrorBoundary` for it as a route error response; the guard set that lets the recovering 503's second render go ahead (`servedUnavailable`) is renamed `servedErrorResponse` and covers both. `isOrganizationContextRequired` recognises that 403 route error response too, and the root `ErrorBoundary`'s `refusalScreen` checks it before the generic 403 (access denied). Logout precedence is unchanged: a request that also holds an unambiguous 401 still logs out, and a 401 beside outage evidence still serves the recovering 503. Affected paths: apps/web/app/entry.server.tsx, apps/web/app/organization-required.tsx, apps/web/app/root.tsx, apps/web/tests/entry-server-shell-error.spec.tsx. Verification: `pnpm exec nx test web --skip-nx-cache` (entry-server-shell-error.spec.tsx renders a signed-in reload through a production `createRequestHandler` with the real entry.server.tsx and root route, whose members loader awaits a query answered with `ORGANIZATION_CONTEXT_REQUIRED`: the response is a 403 with the picker's title, the cookie kept, no redirect, and neither the access-denied screen, the generic error nor the API's message in the page; `routeErrorOutcome` returns `organization-required` for the recorded refusal and still `force-logout` or `unavailable` when a 401 is in the request). By hand: `pnpm exec nx build web`, start the built server, sign in as a user with no active organization and reload a page whose loader queries something organization-scoped: the picker renders, not \"Something went wrong\"."
        area: auth
