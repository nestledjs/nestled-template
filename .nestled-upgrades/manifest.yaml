      - id: 2026-10-05-organization-context-and-billing-authorization
        title: Organization context is always membership-checked; billing operations require billing permissions
        delivery: code-patch
        intent: "Authorization hardening for organization-scoped work. Independent of 2026-10-05-auth-generation-claim and 2026-10-05-auth-email-and-guard-hardening; apply in any order. 1. `TenancyMiddleware` is removed, with its registration in `AppModule.configure()`, the `TenancyModule` import, its exports from the custom library's middleware barrel, and its spec. Nest middleware runs before guards, so it never saw an authenticated user and never did anything. Organization context comes only from `OrganizationContextService.attach()`, called by `GqlAuthGuard`, `GqlOrganizationScopedGuard` and `AccessPolicyGuard`. `AuthCacheService` is still provided by the global `GuardsModule`. 2. `OrganizationContextService.attach()` resolves the organization first (explicit id, scoped API token, `x-organization-id`, active organization) and reuses `req.organizationContext` only when its `userId` is the request's user and its `organizationId` is that organization. Otherwise it clears `req.organizationContext` and recomputes it from the membership, leaving it unset when there is no membership. 3. `UserSubscriptionResolver` (`default/subscription/user-subscription.resolver.ts`) drops its class-level `@Authenticated()`/`@UseGuards(GqlAuthGuard)`. `createCheckoutSession`, `createPortalSession` and `cancelSubscription` use `@RequireOrganizationPermission(['billing:manage'])`; `currentSubscription` and `currentUsage` use `@RequireOrganizationPermission(['billing:read', 'billing:manage'])`. All five act on `@CtxOrganizationId()`, the organization the permission was checked in, instead of `user.activeOrganizationId`. With the seeded roles, Owner can do everything, Admin can read, and Member can do neither. `availablePlans` stays public. `currentPlan` stays available to any member (feature gating needs it) but reads the organization from the context `GqlAuthGuard` attached, through the new `@CtxOptionalOrganizationId()` decorator (api/utils), returning null when there is none. The guard baseline is updated for the five operations. 4. Removing a membership clears the removed user's `activeOrganizationId` when it names that organization, in the same transaction: `OrganizationService.removeOrganizationMember()` and `userDeleteOrganization()` (which now runs its deletes in one transaction and clears every user whose active organization was the deleted one). Nothing derives authority from the raw field any more: the billing resolvers above, `currentPlan`, and `SubscriptionGuard` (which now calls `attach()` and refuses when there is no context) all use the membership-checked context. `userCreateOrganization()` and `acceptOrganizationInvitation()` replace an active organization the user is no longer a member of, as they already did an empty one. 5. Web: `SubscriptionProvider` (`libs/web`) only requests `currentSubscription` when the active membership holds `billing:read`, `billing:manage` or `all:manage` (or the user is a super admin), and otherwise reports no subscription. The billing settings page was already limited to owners."
        area: auth
