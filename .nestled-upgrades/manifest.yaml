        skipIf:
          - The project's API answers every internal failure in its authentication path (token and session lookups, guards, middleware, strategies) with a 5xx, gives a 401 only for a missing, invalid, expired or revoked credential, and its organization decorators null-check the request.
        agentHints:
          - "Part 1: if the project's jwt.strategy has no API-token branch, check whatever authenticates API tokens (a separate strategy, a guard, middleware) for the same catch. Keep `return this.fail(…, 401)` for each genuine refusal and change only the catch. In a passport strategy use `this.error(err)`, not `throw` (an `authenticate` override that throws inside an async function gives passport an unhandled rejection) and not `this.fail(…, 503)` (AuthGuard turns any `fail` into an `UnauthorizedException`, whatever the status). Check that the project's AuthGuards do not override `handleRequest` to map every `err` to `UnauthorizedException`; if one does, make it rethrow `err` when there is one."
          - "Part 2, the audit recipe (it replaces 2026-11-14-api-auth-error-codes part 2's grep; re-run it even if that part is applied). Over the whole API, specs excluded: `grep -rnE \"this\\.fail\\(|fail\\([^)]*401|res\\.status\\(401\\)|status\\(401\\)|statusCode: ?401|HttpStatus\\.UNAUTHORIZED|UnauthorizedException|AuthenticationError|UNAUTHENTICATED|invalid_token|token_invalid\" apps libs --include='*.ts' | grep -v '\\.spec\\.ts'`. Then, for every file it lists and every file that checks a credential (`grep -rlnE \"validateApiToken|jwtService\\.verify|\\.verify\\(|isTokenCurrent|isSession|validateUser|authenticate\\(\"`), read each `catch (` and `.catch(` and ask: can a database, network or programming error end as a 401, as `false`/`null` that a caller reads as \"invalid\", or as a request continued without `req.user` that a later check answers with a 401? Such a catch rethrows, or answers 503 (`ServiceUnavailableException`; `this.error(…)` in a passport strategy, `next(err)` in middleware) when a retry may succeed, or 500 for a bug. A catch around a synchronous signature/expiry check (`jwtService.verify`) may stay. A credential or signature failure (no token, unknown, expired, revoked, bad signature, the credential's user gone or disabled) stays a 401. List every site with its verdict in the PR. Anything ambiguous (a catch that both covers a real refusal and an outage, a project endpoint whose client contract you cannot see, such as a browser extension or mobile app keyed on its own error string) is listed, not changed, and named in the report for the owner."
          - "Part 2: a catch that turns any error into 401 in a project endpoint (a translation or extension \"verify\" route answering `token_invalid`, say) splits in two: the cases that really are a missing or invalid credential keep the 401 and its body, as the client expects; the catch-all goes. Keep any non-401 refusal it also served (for example \"no access to this feature\") on a 403 with its own code, after checking what the client reads."
          - "Part 3: if the project's GraphQL context builder can leave `req` undefined (subscriptions without connection params), the decorators were already throwing a TypeError; this only makes it an explicit 500. If the project has its own decorators reading `gqlContext.req` (a `CtxUser`, a project `CtxOrganization`), give the ones that throw on a missing value the same null check; never answer a missing request with a 401 or 403."
          - "Part 5: no code change unless the project changed `formatApiError`. If it composes its own `formatError`, check its codes survive: run its own `forbiddenWithCode('<ITS_CODE>', …)` through the GraphQL module in a test, as api-error-code.spec.ts does."
          - "Part 6: replace the project's copy of the spec with the template's, then adapt only what this project lacks: an `OrganizationMember` table under another name (change the SQL), no organizations at all (drop the second test and say so), or an API that ignores `x-organization-id` (move the outsider's saved organization the way the API reads it). Do not pin it to a named operation again. If the outsider gets no 403 anywhere, the project does not refuse a non-member's organization header: report that, it is a tenancy finding, not a test to loosen."
