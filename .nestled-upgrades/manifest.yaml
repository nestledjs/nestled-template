      - id: 2026-11-14-tooling-spec-fixes
        title: "Repo-tooling spec fixes from the 2026.11.6 rollout: relative Vitest project paths, a local list of tracked-but-ignored files, the IntersectionObserver teardown flake, TS5112 in the lcov spec, no hard-coded plugin folder, and coverage for the lcov runner"
        delivery: code-patch
        intent: "Fixes to the workspace specs that 2026-11-11-r5b-wave-followups, 2026-11-12-wave-corrections and 2026-11-12-config-spec-js-extensions added (apply those first). Six parts, each independent. No package changes, and no change to package.json, nx.json or tsconfig.base.json. 1. scripts/vite-config-module-format.spec.mjs: `listedConfigPaths` dropped every listed path that starts with `.`, so a root Vitest `projects` entry written as `'./libs/ui/vite.config.ts'` or `'../x/vite.config.ts'` was never checked, and a stale one passed. Relative paths are now kept; `staleConfigReferences` already resolves each listed path against the listing file's directory, still literally (no extension substitution). Import specifiers (`from '...'`, `import('...')`) are stripped before matching, so an import inside a Vitest config is checked once, by the import rule, with its `.mjs` → `.mts` substitution. Only project paths are read: the strings inside a config's `projects: [...]` (brackets matched), or anywhere in a vitest.workspace file, whose export is the project list. Other strings, such as a coverage exclusion naming a config that may legitimately be absent, are no longer checked. Three new cases. 2. scripts/gitignore-test-output.spec.mjs, \"ignores no tracked file\": it failed in projects that track files their .gitignore matches, and the only way through was editing the spec, which the next upgrade replaces. The test is now \"ignores no tracked file outside the known list\". It reads new scripts/known-tracked-ignored.json, a JSON array of repo-relative paths (`[]` in the template; an absent file counts as empty; anything but an array of strings is an error). It fails for every tracked-but-ignored file the list does not name, and for every listed file that is no longer tracked-but-ignored. The comparison is the exported `compareWithAllowlist`, and the reader `readKnownTrackedIgnored`; new cases cover unlisted, stale, absent and malformed lists. 3. libs/web/src/lib/hooks/useInfiniteApolloList.spec.tsx failed at random on CI with \"ReferenceError: IntersectionObserver is not defined\", thrown from the hook's effect during React's flushPassiveEffects. The cause is teardown order. Testing Library's auto-cleanup is an afterEach registered when it is imported, and Vitest runs afterEach hooks in reverse order, so it ran after the spec's own afterEach, which had already called `vi.unstubAllGlobals()`. When a state update landed outside act() (a test that awaits a DOM change with `waitFor`, as a spec written in a downstream does), the effect that re-creates the observer for the new `isLoading` was still pending when the test ended; unmounting flushed it against the unstubbed global. Whether it was still pending depended on whether Node ran waitFor's final `setTimeout(0)` before React's `setImmediate`, which varies from run to run. The spec's afterEach now calls `cleanup()` (imported from @testing-library/react) before `vi.unstubAllGlobals()`. A new last test reproduces the race on every run: a `vi.hoisted` block delays `setImmediate` before React loads, so the pending effect always outlives `waitFor`; it fails without the `cleanup()` call. The hook is unchanged. 4. scripts/normalize-lcov-paths.spec.mjs compiles the lcov script with tsc by naming the files on the command line. From TypeScript 6 that is error TS5112 when a tsconfig.json is in the working directory, as it is in any project with a root tsconfig.json. TypeScript 5 has no TS5112 and rejects `--ignoreConfig` as an unknown option (TS5023), so new exported `ignoreConfigFlag(tsc)` probes `tsc --ignoreConfig --version` and the spec adds the flag only where it exists. A new case compiles from a temporary directory holding a tsconfig.json. No other script, note verification or project target in the template runs tsc with a file list; the others use `-p`. 5. scripts/gitignore-test-output.spec.mjs named `tools/workspace-plugin`, which most projects do not have under that name. TEST_OUTPUT now uses neutral examples (`tools/some-plugin/coverage/...`), and the coverage test also checks `<dir>/coverage/lcov.info` beside every tracked project.json other than the root one (exported `projectCoverageOutput`), so a project's plugin is covered whatever it is called. Where an older note names `tools/workspace-plugin`, read it as the project's own plugin folder. 6. scripts/normalize-lcov-paths.ts, the runner, imports `./normalize-lcov-paths.lib` without an extension, so `node --test` cannot load it and no spec can cover it that way; the spec covers the .lib.ts file. The template excludes `scripts/**` from Sonar coverage and has no CI step that measures script coverage, so it needs no change here. See the hint for a project that does."
        area: infra
        affectedPaths:
          - scripts/vite-config-module-format.spec.mjs
          - scripts/gitignore-test-output.spec.mjs
          - scripts/known-tracked-ignored.json
          - libs/web/src/lib/hooks/useInfiniteApolloList.spec.tsx
          - scripts/normalize-lcov-paths.spec.mjs
          - sonar-project.properties
        verification:
          - node --test scripts/*.spec.mjs
          - pnpm exec nx test web-components --skip-nx-cache
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec nx run-many -t lint --skip-nx-cache
          - pnpm run nestled-doctor
        agentHints:
          - "Applying a raw patch for any part: run `patch -N` (or `git apply --3way`), never plain `patch`. Without a terminal, plain `patch` treats hunks that are already applied as reversed and undoes them. After any patch run, re-check every file you edited by hand and read `git diff`."
          - "Part 1: run the spec; every stale `./` or `../` project path it now lists is pointed at the config's current name."
          - "Part 2: if the spec fails, untrack each file it lists (`git rm --cached <path>`) unless the project means to keep it, and list the ones it keeps in scripts/known-tracked-ignored.json. That file belongs to the project: a later upgrade that ships a new copy of the spec does not replace it. Never commit a large binary to make the list pass; tell the owner about one instead."
          - "Part 3: a project that kept its own useInfiniteApolloList spec (or any spec that stubs a browser global and calls `vi.unstubAllGlobals()` in afterEach while rendering with Testing Library) applies the same fix: import `cleanup` and call it first in that afterEach. Search with `grep -rln \"unstubAllGlobals\" --include=*.spec.tsx apps libs`. Prove it with the file run 20 times, for example `for i in $(seq 20); do pnpm exec vitest run --config libs/web/vitest.config.mts --sequence.shuffle --sequence.seed=$i <spec> || break; done`."
          - "Part 4: a project that runs tsc with a file list anywhere else (a project.json command, a script, a CI step) adds `--ignoreConfig` there when its TypeScript is 6 or later (`pnpm exec tsc -v`), or switches it to `-p <tsconfig>`."
          - "Part 5: a project that renamed the plugin path in its copy of the spec takes the template's copy; no rename is needed any more."
          - "Part 6: only for a project whose CI measures script coverage (`node --test --experimental-test-coverage ...`) or whose sonar.coverage.exclusions does not cover `scripts/**`. Add `--test-coverage-exclude=scripts/normalize-lcov-paths.ts` to that node command, and `scripts/normalize-lcov-paths.ts` to sonar.coverage.exclusions (keep the backslash continuations). Otherwise mark part 6 `not-applicable`."
        patch: patches/2026-11-14-tooling-spec-fixes.diff
  - id: 2026.11.8
    date: 2026-11-16
    title: Sign-out during outages, organization consistency, API internal errors
    templateCommit: b1d42fd
    notes:
      - id: 2026-11-16-api-internal-errors-not-401
        title: "The API stops turning internal failures into 401s: a failed API-token lookup is a 503, a GraphQL context with no request a 500, and the 401 audit recipe covers passport's fail(…, 401) and catch blocks around token checks"
        delivery: code-patch
        intent: "Follow-up to 2026-11-14-api-auth-error-codes (apply it first). Clients drop a session or an API token on an HTTP 401 or a GraphQL `UNAUTHENTICATED`, so a 401 must mean \"this credential is missing, invalid, expired or revoked\" and nothing else. A database outage, a bug or any other internal failure is never a 401: it is a 503 when the request may well succeed on a retry (the web's outage detection treats a 502/503/504 as outage evidence), or a 500 for a server bug. Six parts. No package changes, and no change to package.json, nx.json or tsconfig.base.json. 1. API: a failed API-token lookup is a 503, not a 401. libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts `authenticate` wrapped the API-token path (`validateApiToken`, then `validateUser`) in a try/catch whose catch answered `this.fail({ message: 'API token validation failed' }, 401)`, so a database outage told every API-token client its token was bad. Every \"this token is not good\" answer in that block is a `return this.fail(…)`, not a throw (`validateApiToken` returns null for an unknown, revoked, expired or stale-generation token, a disabled owner or a lost membership); the catch only ever sees a failed lookup. It now logs the error with its stack and calls `this.error(new ServiceUnavailableException('API token validation is temporarily unavailable'))`. Passport hands `error(err)` to `AuthGuard`, which throws it, so REST callers get an HTTP 503, which clients (the web's `isRetryableConnectivityError` and the server render's outage check, both keyed on 502/503/504) treat as outage evidence and retry, and GraphQL callers get `extensions.code: INTERNAL_SERVER_ERROR` with `extensions.status: 503`, never `UNAUTHENTICATED`. 503 rather than 500 because the failure is the dependency's, and a retry is the right client response. The genuine refusals are unchanged: an invalid, expired or revoked token, a token bound to another resource, and a token whose user is missing or inactive stay 401; an organization-scope mismatch stays 403. Session JWTs were already right: `validate()` does not catch, so a failed `validateUser` / `isTokenCurrent` reaches passport as an error (a 500), and a test now pins that. Affected paths: libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts, libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.spec.ts. Verification: `pnpm exec nx test api-custom --skip-nx-cache` (jwt.strategy.spec.ts, \"JwtStrategy API token internal failures\": a rejected `validateApiToken` and a rejected `validateUser` each call `error` with a `ServiceUnavailableException` (status 503) and never `fail`; a null `validateApiToken` still fails with 401; a rejected session `validateUser` rejects with the database error, not an `UnauthorizedException`). 2. API: the other catch-all-to-401 sites. The template API was audited with part 4's recipe. Changed: - libs/api/custom/src/lib/middleware/api-token-auth.middleware.ts (`ApiTokenAuthMiddleware`, in front of `McpController`): its catch logged a failed `validateApiToken` or user lookup and called `next()` with no user, so `McpController` answered the MCP client with a 401 `WWW-Authenticate: … error=\"invalid_token\"` and the client threw away a good token and re-authorized. The catch now calls `next(new ServiceUnavailableException(…))`: still no user (fail closed), but a 503. An unknown, revoked, expired or resource-mismatched token and a missing or inactive user still leave the request without a user, and the 401 challenge. - libs/api/custom/src/lib/plugins/auth/auth.service.ts `isSessionValid`: its catch answered `false` (\"invalid session\") for a failed lookup. Nothing in the template calls it, but a caller would have logged users out over an outage. It no longer catches; the error propagates. Checked and left as they are (the PR lists the same): - jwt.strategy.ts `validate`: invalid payload, user missing or inactive, session invalidated: dead session, stays 401. `authenticate`'s API-token refusals: see part 1, stay 401. - jwt.strategy.ts `createHeaderAndCookieExtractor`, libs/api/core/feature/src/lib/ws-session-token.ts and auth.service.ts `verifyToken`: catch → null around `jwtService.verify` only, a synchronous signature/expiry check with no I/O. Correct. - libs/api/custom/src/lib/plugins/mcp/mcp.controller.ts (401 challenge with no user) and mcp-oauth.controller.ts `login_required` ×2 (`getSessionFromCookie` catches only `jwtService.verify`; `isSessionTokenCurrent` errors propagate as a 500): no valid credential, stay 401. - libs/api/utils/src/lib/guards/access-policy.guard.ts and subscription.guard.ts (no `req.user`), and oauth.service.ts `unlinkOAuthAccount` (\"User not found\": the session's own user is gone): stay 401. - Ambiguous, listed and not changed: libs/api/utils/src/lib/guards/gql-auth.guard.ts swallows a failed `organizationContextService.attach` (a database error included) so plain authenticated operations still run; an organization-scoped field then answers 403 `ORGANIZATION_CONTEXT_REQUIRED` during an outage. Not a 401, so the session is kept, but the user may see the organization picker instead of the outage screen. Likewise auth-cache.service.ts returns null on a Redis error (read as \"not cached\", so the database is asked instead). The graphql-ws `onConnect` throws a plain `Error` for a missing cookie (no HTTP status; graphql-ws closes the socket), unchanged. - No `AuthenticationError`, `res.status(401)` outside MCP, or `HttpStatus.UNAUTHORIZED` outside subscription.guard.ts remains. Affected paths: libs/api/custom/src/lib/middleware/api-token-auth.middleware.ts, libs/api/custom/src/lib/middleware/api-token-auth.middleware.spec.ts, libs/api/custom/src/lib/plugins/auth/auth.service.ts, libs/api/custom/src/lib/plugins/auth/auth.service.spec.ts. Verification: `pnpm exec nx test api-custom --skip-nx-cache` (api-token-auth.middleware.spec.ts: a rejected `validateApiToken` and a rejected user lookup each call `next` with a `ServiceUnavailableException` (503), attach no user and record no use; an unknown token calls `next()` with no error; auth.service.spec.ts: `isSessionValid` rejects with the database error instead of answering false). 3. API: organization decorators with no request are a 500. libs/api/utils/src/lib/decorators/ctx-organization.decorator.ts `CtxOrganization`, `CtxOrganizationId` and `CtxOptionalOrganizationId` read `gqlContext.req.organizationContext`. A GraphQL context with no `req` (a graphql-ws subscription whose context builder got no request, a decorator used outside GraphQL) threw a `TypeError`, a 500 with no status. A local `requestFrom(ctx)` now throws `InternalServerErrorException('Organization context cannot be read: the GraphQL context has no request.')` for it: never a 401, which would log the user out, and never the 403 `ORGANIZATION_CONTEXT_REQUIRED`, which would send them to the organization picker for a server bug. A request with no organization context still gets the 403. Affected paths: libs/api/utils/src/lib/decorators/ctx-organization.decorator.ts, libs/api/utils/src/lib/decorators/ctx-organization.decorator.spec.ts, libs/api/utils/src/lib/errors/api-error-code.spec.ts. Verification: `pnpm exec nx test api-utils --skip-nx-cache` (ctx-organization.decorator.spec.ts: each of the three decorators throws `InternalServerErrorException`, neither Unauthorized nor Forbidden, for a context of `{}`, `{ req: undefined }` and undefined; a request without context still gets the 403; api-error-code.spec.ts: through the real Nest GraphQL pipeline, a context with no `req` answers `INTERNAL_SERVER_ERROR` with `extensions.status: 500`). 4. Guidance: the 401 audit recipe of 2026-11-14-api-auth-error-codes part 2 missed sites. Its grep (`UnauthorizedException|AuthenticationError|HttpStatus.UNAUTHORIZED|status(401)`) does not find passport's `this.fail(…, 401)` (nor a bare `this.fail(challenge)`, which passport also answers with a 401), a `statusCode: 401` body, a GraphQLError built with `UNAUTHENTICATED`, or a catch block that turns a failed lookup into \"invalid\" without ever naming a 401: a `return false` / `return null` read as \"bad token\", or a request continued without `req.user` that a later check refuses with a 401. The template's own audit missed four `fail(…, 401)` lines and the catch-alls fixed in parts 1 and 2. Part 2's agentHint gives the corrected recipe; projects that already applied 2026-11-14 part 2 re-run it. No code in this part. 5. API: `formatApiError` keeps an app's own codes (documentation and a test). libs/api/utils/src/lib/errors/api-error-code.ts: `formatApiError` already restored any upper-snake-case code a 403 was thrown with through `forbiddenWithCode`, not only `API_ERROR_CODES`; the doc comments on `forbiddenWithCode` and `formatApiError` now say so (an app's workflow states, plan limits and so on reach its clients as-is), and that a 500/503 keeps Nest's `INTERNAL_SERVER_ERROR` and `extensions.status`. It still never sets a code on a 401 or sets `UNAUTHENTICATED`. Affected paths: libs/api/utils/src/lib/errors/api-error-code.ts, libs/api/utils/src/lib/errors/api-error-code.spec.ts. Verification: `pnpm exec nx test api-utils --skip-nx-cache` (api-error-code.spec.ts, real Nest GraphQL pipeline: `forbiddenWithCode('WORKFLOW_STEP_LOCKED', …)` answers `extensions.code: WORKFLOW_STEP_LOCKED` with `originalError.statusCode` 403 and its message; a `ServiceUnavailableException` answers `INTERNAL_SERVER_ERROR` with `extensions.status` 503). 6. API e2e: auth-error-codes.spec.ts no longer assumes the template's operations. apps/api-e2e/src/auth/auth-error-codes.spec.ts queried `currentSubscriptionActive` with no arguments, moved the user's saved `activeOrganizationId` with SQL (an API that repairs a stale saved organization repaired it away), and expected `ORGANIZATION_CONTEXT_REQUIRED` (an access-policy guard refuses first with a plain 403 `FORBIDDEN`). It now reads the schema (introspection, else the `api-schema.graphql` the API writes at the workspace root) and builds `query { field }` / `query { field { __typename } }` for every query whose arguments are all optional. A bad bearer: the queries that need a session are the ones it gets `UNAUTHENTICATED` for (with `originalError.statusCode` 401), and there must be at least one. A signed-in outsider sending `x-organization-id` for another user's organization (read from `OrganizationMember`): none of those queries answers 401 or `UNAUTHENTICATED`, every `ORGANIZATION_CONTEXT_REQUIRED` carries 403, and at least one of them answers the outsider without errors in its own organization yet refuses it with a 403 (any code) in the foreign one. That control comparison keeps admin-only refusals and public queries from satisfying the check: with the header ignored, the spec fails. Affected paths: apps/api-e2e/src/auth/auth-error-codes.spec.ts. Verification: the API e2e suite (`pnpm exec nx run api-e2e:e2e`, or CI)."
