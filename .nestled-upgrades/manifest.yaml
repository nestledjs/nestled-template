      - id: 2026-11-10-r3-followups-tooling
        title: "R3 tooling follow-ups: the pre-commit hook never commits unstaged hunks, Postgres readiness over TCP, the API e2e gate sees root files, untracked generator output, full-history gitleaks on develop, Sonar digest and session-hook fixes"
        delivery: code-patch
        intent: "Follow-up to 2026-11-09-precommit-and-session-hooks, 2026-11-09-ci-parallel-jobs and 2026-11-09-sonar-rules-digest (apply those first; this note changes the files they added). Nine parts. No package changes. 1. `.githooks/pre-commit` re-staged whole files. Before formatting, it now lists the staged paths that also have unstaged changes (`staged_paths | xargs -0 git diff --name-only --`). If there are any, it prints them, says how to proceed (stage the whole file, or `git stash push --keep-index`, commit, `git stash pop`) and exits 1, before Prettier touches anything: re-staging such a file would commit its unstaged hunks. Re-staging is now `git add -f --`, because every path is already in the index and an ignore rule (a force-added `.claude/settings.json` under an ignored `.claude/`) made a plain `git add` fail the commit. New `scripts/pre-commit-hook.spec.mjs` runs the hook in a throwaway repository with a Prettier stand-in and covers the normal case, a partially staged file and a force-added ignored file. 2. `scripts/db-update.mjs` `waitForPostgres` asked `pg_isready` over the Unix socket. On a fresh data directory the postgres image's temporary init server answers there and then shuts down, so `createdb` raced it (\"the database system is shutting down\") and the generated-artifacts job failed now and then. It now passes `-h 127.0.0.1`. The same flag is added to `scripts/test-db.sh` `wait_for_db` and to both Postgres healthchecks in `.dev/docker-compose.yml`. New `scripts/postgres-readiness.spec.mjs` fails on any socket-only `pg_isready` in those three files. 3. CI `affected` job (`.github/workflows/ci.yml`): Nx maps a changed file to the project that owns it, so a PR touching only root files the e2e run reads (prisma.config.ts, package.json, the lockfile, .env.example, tsconfig.base.json, scripts/, .github/actions/) left api-e2e unaffected and skipped the suite. A changed-path fallback now runs it whenever `git diff --name-only \"$NX_BASE...$NX_HEAD\"` lists a file outside `apps/` and `libs/`, except docs (`docs/**`, `**/*.md`), `.nestled-updates/**`, `.claude/**`, `.githooks/**`, `.cursor/**`, `.vscode/**` and `LICENSE`. 4. nx.json, by hand (nx.json is not mirrored by promotion): add `\"{workspaceRoot}/.github/actions/**/*\"` to `namedInputs.sharedGlobals`, next to `\"{workspaceRoot}/.github/workflows/ci.yml\"`, so a change to a composite action no longer replays cached results. 5. The generated-artifacts drift check counted only tracked files (`git diff --quiet`), so a generator that adds a new file passed. It now fails when `git status --porcelain --untracked-files=all` prints anything, and prints that list. 6. gitleaks on a develop push scanned only `github.event.before..github.sha`. A newer push replaces a queued develop run, so the replaced run's commits were never scanned. A develop push now scans the whole history (seconds); a pull request still scans `base..head`. 7. `scripts/sonar-rules-digest.mjs` `groupRules` dropped a rule carrying an excluded tag even when another of its tags had been turned back on (S6302 is tagged `aws` and `gcp`; a project that removes `aws` from `excludeTags` still lost it to `gcp`). A default-excluded tag missing from the project's `excludeTags` now keeps the rule, like a KEEP_TAGS tag. New test in `scripts/sonar-rules-digest.spec.mjs`. The template's digest output does not change. 8. `scripts/sonar-rules-digest.spec.mjs` stubbed `log` as `() => {}`, which ESLint `no-empty-function` rejects; it is now `() => undefined`. 9. `.claude/hooks/session-start.sh` could exit non-zero under `set -e`: when git was missing, when `git hash-object` was given a missing file, or when `CLAUDE_PROJECT_DIR` did not exist. Each case is now handled explicitly with a one-line message (without git or with an input missing there is no fingerprint, so the warm-up always runs), and an EXIT trap turns any other failure into a message and exit 0. New `scripts/session-start-hook.spec.mjs` covers the missing git, missing schema and missing directory cases and the skip-when-current path."
        area: infra
        affectedPaths:
          - .githooks/pre-commit
          - .claude/hooks/session-start.sh
          - .github/workflows/ci.yml
          - .dev/docker-compose.yml
          - nx.json
          - scripts/db-update.mjs
          - scripts/test-db.sh
          - scripts/sonar-rules-digest.mjs
          - scripts/sonar-rules-digest.spec.mjs
          - scripts/pre-commit-hook.spec.mjs
          - scripts/postgres-readiness.spec.mjs
          - scripts/session-start-hook.spec.mjs
        verification:
          - node --test scripts/*.spec.mjs
          - node scripts/sonar-rules-digest.mjs --check
          - pnpm exec prettier --check .
          - pnpm run nestled-doctor
          - actionlint .github/workflows/ci.yml (where actionlint is installed)
          - "Stage one hunk of a changed file with `git add -p` and try to commit on a throwaway branch: the hook refuses and names the file, and the index still holds only that hunk. Then discard the branch."
          - On the PR, CI's "Generated artifacts are up to date" job passes (no untracked generator output) and the gitleaks job passes.
        patch: patches/2026-11-10-r3-followups-tooling.diff
      - id: 2026-11-10-r3-followups-web
        title: "R3 web follow-ups: a recorded API failure no longer re-labels an unrelated render error, RequireAuth's redirect cannot loop, frozen loader data is safe, three Sonar findings"
        delivery: code-patch
        intent: "Follow-up to 2026-11-09-error-recovery-r3 (apply that first; this note changes the code it added). Four parts, in the web app and the shared libs. No package changes. 1. apps/web/app/entry.server.tsx `shellErrorOutcome(error, cause)` applied the recorded cause before looking at the error. `ssrApiFailureCause()` aggregates every loader's Apollo failures in the request, so the cause could belong to a preload whose failure a Suspense boundary contained. An ordinary render bug in the shell then became the 503 recovering screen (`unavailable` recorded) or a sign-out (`unauthenticated` recorded). The recorded cause now applies only when the shell error is itself an API failure: Apollo's redacted stream error (no recorded cause still means `unavailable`), or an error `classifyApiFailure` does not call `other` (then the recorded cause, else the error's own). Any other shell error is `error` and goes to `reject(error)`, whatever was recorded. `classifyApiFailure` is imported from `@nestled-template/shared/apollo`. apps/web/tests/entry-server-shell-error.spec.tsx: new end-to-end cases where the Me preload fails as a 503 or a 401 and the root component throws a plain render error (expected: 500, no Set-Cookie, no Location); the `shellErrorOutcome` table now expects `error` for a plain error with a recorded cause, and covers non-redacted API errors. 2. libs/web/src/lib/components/require-auth.tsx redirected with `<Navigate to={redirectTo} state={{ from: location }} replace />`. `<Navigate>` re-runs `navigate()` when its props change, and the `state` object is new on every render; in framework mode each navigation passes through the loading state, so every re-render aborted the pending redirect and started another (thousands of aborted `.data` requests a second in a production build). The `state` prop and the `useLocation` call are removed; nothing read `location.state.from`. The component stays exported, since a project may use it. New libs/web/src/lib/components/require-auth.spec.tsx asserts that a signed-out render starts exactly one navigation while the login route's loader is pending. 3. libs/shared/apollo/src/lib/apollo-loader.ts `attachRecord` defined a symbol property on the loader's returned object, which throws for frozen or non-extensible data (`return Object.freeze({...})`). The record now lives in a WeakMap keyed by the returned data (kept on `globalThis` under `Symbol.for('nestled.ssrApiFailureRecords')`, so a second copy of the module finds it), and `ssrApiFailureCause` reads it from there. The data is never modified. New test in libs/shared/apollo/src/lib/apollo.spec.ts for frozen and non-extensible data; the cause test now returns frozen data. 4. SonarCloud findings in the R3 code: apps/web/app/api-availability.ts drops the redundant `type Phase = ApiAvailabilityPhase` alias (S6564; use `ApiAvailabilityPhase` directly) and the never-read initial value of `result` in `runProbe` (S1854; `let result: ConnectivityProbeResult`). apps/web/app/entry.server.tsx marks the intentional `reject(new Response(null, { status: 503 }))` with `// NOSONAR` and a comment saying why (S6671: React Router needs the 503 `Response`; an Error would be a 500)."
