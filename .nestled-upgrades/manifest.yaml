    templateCommit: cba3109
    notes:
      - id: 2026-11-20-mutation-errorpolicy-follow-ups
        title: "Mutation errorPolicy follow-ups: find the call sites that still read a refusal from the result, and declare the client's default error policies to TypeScript (Apollo Client 4.2+)"
        delivery: code-patch
        intent: "Follow-up to 2026-11-19-mutation-errorpolicy-none (the web client's mutation default became 'none'); apply that first. Two parts. No package changes and no change to package.json, nx.json or tsconfig.base.json. No logout path changes: the session rule is unchanged (log a user out only when the API has definitely rejected the session, a real HTTP 401 or a GraphQL `UNAUTHENTICATED` with no outage evidence; outage evidence outranks a 401; anything else keeps the session). Behaviour changes, plainly: none in the app itself beyond the sites part 1 finds; each one fixed there now shows a refusal it used to lose. Part 2 is types only. 1. Sites that read a refusal from the result. Under the 'none' default a refused mutation rejects and never resolves with `error`, so a site that sets no `errorPolicy` of its own and reads `result.error` / `result.errors` (or destructures `{ error }`, or hands the whole result to an error helper) never sees the refusal there. In a `try` with a `catch` (or with a `.catch`) the catch sees it and the read is only dead code. Without one, the refusal is an unhandled rejection: no message, and whatever the error branch did (stay on the form, show the API message) never runs. 2026-11-19's grep finds every mutation site but does not single these out, and in a project whose sweep left them on the default they can be most of what is left. The template adds scripts/audit-mutation-error-reads.mjs (plain Node and the workspace's `typescript`; no build) to list them: node scripts/audit-mutation-error-reads.mjs            (scans apps and libs; or pass folders) node scripts/audit-mutation-error-reads.mjs --json It looks at `useMutation(doc, options)`, generated `useXxxMutation(options)` hooks and `client.mutate(options)`, skips every call whose hook or executor options set `errorPolicy` (`save({ errorPolicy })` wins over the hook's), follows an executor into a helper of the same file it is handed to (a catch around that helper call counts), counts a `try` only when the call is awaited inside it (a promise merely started there rejects after the `try` is over), and sorts each read into: - `uncaught`: nothing catches the rejection. Fix it: move the handling into a `catch` (show the API's message, keep the form or dialog open, do not navigate or show success). The script exits 1 while any is left. - `dead-read`: a catch already sees the refusal. Works as is; dropping the read is optional. - `check-by-hand`: the options are a variable or spread another object, so `errorPolicy` may be set where the script cannot see (a wrapper such as a `useGuardedMutation`). Check the wrapper once, then its callers for how they use what it returns. scripts/audit-mutation-error-reads.spec.mjs (run by CI's `node --test scripts/*.spec.mjs`) tests the script and asserts this repository has no `uncaught` site, so a new one fails CI. A project that cannot fix all of its `uncaught` sites in one PR (one needs an owner decision) fixes the rest, lists the remainder in the PR, and gives those hooks `errorPolicy: 'all'` with a comment (\"reads the refusal from the result; move it into a catch, then drop this\"), which the script skips; do not weaken the spec. Template sites: none in apps/web or libs/web. The data browser's create, edit and delete pages (libs/data-browser, the published `@nestledjs/data-browser`) were `dead-read`: inside try/catch, reading `result.errors`, which Apollo 4 never sets, so under a host client that defaults mutations to 'all' a refusal was reported as success. They now pass `errorPolicy: 'none'` themselves and the dead reads are gone. That ships with the next data-browser release; nothing to do downstream until it is published (the published 1.0.29 inherits the host's 'none' default and its catch already shows the message). 2. Declare the default error policies to TypeScript. From Apollo Client 4.2 a default `errorPolicy` in `new ApolloClient({ defaultOptions })` that is not declared fails to type-check: TS2322, \"A default option for mutate.errorPolicy must be declared in ApolloClient.DeclareDefaultOptions before usage\" (the same for `query`). The template pins `@apollo/client` `^4.1.8`, so a lockfile refresh or `pnpm update` that lands 4.2 or later breaks `apollo:typecheck` on makeClient's explicit `query: { errorPolicy: 'all' }` and `mutate: { errorPolicy: 'none' }`. libs/shared/apollo/src/lib/apollo.ts now declares both, at the top of the module (so every project that imports the client sees it): declare module '@apollo/client' { export namespace ApolloClient { export namespace DeclareDefaultOptions { interface Query { errorPolicy: 'all' } interface Mutate { errorPolicy: 'none' } } } } On 4.1 the interfaces are not read yet, so the declaration is harmless there. Keep each declared value equal to the default it describes; libs/shared/apollo/README.md documents it. - The app's client sets `query` / `mutate` `errorPolicy` defaults: add the declaration with the values it sets, next to its client factory (a file the web typecheck includes). - The app's client sets no `errorPolicy` default (it relies on Apollo's own 'none'): nothing to declare; record part 2 as not-applicable. An app that left out the explicit 'none' because it failed to type-check may now add it with the declaration; either is correct. - A `watchQuery.errorPolicy` (or `returnPartialData`) default needs a `WatchQuery` interface too. Declaring 'all' for queries also widens the declared result types of `client.query` to match what the client already does at runtime; on 4.2+ fix any type errors that surfaces rather than dropping the declaration."
        area: web
        affectedPaths:
          - scripts/audit-mutation-error-reads.mjs
          - scripts/audit-mutation-error-reads.spec.mjs
          - libs/shared/apollo/src/lib/apollo.ts
          - libs/shared/apollo/README.md
        verification:
          - node scripts/audit-mutation-error-reads.mjs
          - node --test scripts/audit-mutation-error-reads.spec.mjs
          - pnpm typecheck
          - pnpm exec nx test apollo --skip-nx-cache
          - pnpm exec nx test web --skip-nx-cache
        skipIf:
          - The project has no web app.
        agentHints:
          - "Part 1: copy both script files as they are; they read the TypeScript sources under the folders given (default apps and libs) and need no config. Run the script before and after, and put its counts by verdict (and each `uncaught` site you fixed) in the PR. For each fix, add or adapt a test that answers the mutation with a GraphQL error through a client with the app's real defaults and asserts the API's message shows and no success state does."
          - "Part 1: the repository-wide assertion in the spec (\"finds no site in this repository that reads a refusal from its result uncaught\") fails until the `uncaught` sites are fixed or explicitly marked; that is the point. If the project keeps generated or vendored code under apps or libs with such reads, list the folders you want scanned explicitly in that one test, and say why in the PR."
          - "Part 2: confirm with `node -p \"require('@apollo/client/package.json').version\"` which version the project resolves. On 4.1 the declaration is still worth adding (the next lockfile refresh lands 4.2+); prove it by running `pnpm typecheck` after `pnpm add -w @apollo/client@4.2.0` in a scratch checkout if you want to, but do not commit a version bump as part of this note."
        applyAfter:
          - 2026-11-19-mutation-errorpolicy-none
        patch: patches/2026-11-20-mutation-errorpolicy-follow-ups.diff
      - id: 2026-11-20-emulation-organization-reload-race
        title: Starting or ending an emulation stores no organization until the reload, so the still-mounted shell cannot write the previous user's organization back into the next session
        delivery: code-patch
        intent: "Follow-up to 2026-11-19-session-follow-ups part 1, which made starting and ending an emulation forget the stored organization (`storeActiveOrganizationId(null)`) before the page sets `location.href`; apply that first. No package changes and no change to package.json, nx.json or tsconfig.base.json. No logout or session change: nobody is signed out, the session cookie is not touched, and the logout rule is unchanged (log a user out only when the API has definitely rejected the session, a real HTTP 401 or a GraphQL `UNAUTHENTICATED` with no outage evidence; outage evidence outranks a 401; anything else keeps the session). Behaviour change, plainly: after starting or ending an emulation, the next session's first document starts with no stored organization, every time. Until the reload the old page sends no `x-organization-id` (the API answers for the user's own active organization). The defect. The signed-in shell stores the organization it shows on every render (`useActiveOrganization` → `rememberActiveOrganization`), and it stays mounted while the emulation's document navigation is pending. Any re-render in that window (the mutation's answer reaching the cache, a query settling) wrote the previous user's organization straight back after the forget. The next session's first requests then carried it, and when that user's own active organization was unknown, the shell's restore step could make it their active organization on the API if they were also a member (an admin emulating a colleague in a shared organization). The fix, in libs/shared/apollo/src/lib/apollo.ts: `clearActiveOrganizationForSessionChange()` forgets the stored organization (ending the organization session, so a switch still in flight stores nothing, as `storeActiveOrganizationId(null)` does) and latches this document: from then on every non-null `storeActiveOrganizationId` is ignored and `getStoredActiveOrganizationId` answers null, so nothing can store or send an organization before the document unloads. Nothing clears the latch in the browser; the next document starts unlatched. `__resetActiveOrganizationSessionChange` undoes it for tests only. The admin users page's `EmulateUser` and the emulation banner's `EndEmulation` `onCompleted` now call it instead of `storeActiveOrganizationId(null)`, before setting `location.href`. Use it only before a document navigation into another user's session. A sign-in that stays in the same document (login form, registration, an invitation) keeps `storeActiveOrganizationId(null)`: the new session's shell must be able to store its own organization. Logout is unchanged. - The app's emulation transitions do a client-side navigate instead of setting `location.href`: do not latch (the next session renders in this document); use `storeActiveOrganizationId(null)` and make sure the shell's session key (the user id) changes so it starts over. - The app keeps its organization elsewhere (its own store, a cookie read by the server): put the same latch on that store's writer and reader; the point is that nothing in the leaving document can write or send the previous user's organization. - The app has no emulation: not-applicable."
        area: web
        affectedPaths:
          - libs/shared/apollo/src/lib/apollo.ts
          - libs/shared/apollo/src/lib/apollo.spec.ts
          - apps/web/app/routes/admin/users/_index.tsx
          - libs/web/src/lib/components/emulation-banner.tsx
          - libs/web/src/lib/components/emulation-banner.spec.tsx
          - apps/web/tests/routes/admin/users/_index.spec.tsx
        verification:
          - pnpm typecheck
          - pnpm exec nx test apollo --skip-nx-cache
          - pnpm exec nx test web-components --skip-nx-cache
          - pnpm exec nx test web --skip-nx-cache
        skipIf:
          - The project has no web app.
          - The project has no user emulation.
        agentHints:
          - "The reproduction is libs/web/src/lib/components/emulation-banner.spec.tsx \"does not let the still-mounted shell write the emulated user's organization back before the reload\": it renders a shell with `useActiveOrganization` next to the banner, ends the emulation, re-renders the shell, and expects nothing stored. With `storeActiveOrganizationId(null)` in the banner it fails with \"expected 'emulated-users-org' to be null\". Port it to the app's own shell and emulation exit; it needs `useApolloClient` in the spec's `@apollo/client/react` mock."
          - Specs that run an emulation transition and later store an organization in the same file need `__resetActiveOrganizationSessionChange()` in their `beforeEach`/`afterEach`, or the latch carries into the next test (module state lives per spec file).
          - "Check by hand in a browser if you can: sign in as an admin with a stored organization, emulate a user, and in the emulated session's devtools confirm `localStorage.activeOrganizationId` is the emulated user's (or empty), never the admin's; then end the emulation and check the reverse."
        applyAfter:
          - 2026-11-19-session-follow-ups
          - 2026-11-20-mutation-errorpolicy-follow-ups
        patch: patches/2026-11-20-emulation-organization-reload-race.diff
      - id: 2026-11-20-session-cookie-domain-rule
        title: "Session cookie domain: the web server reads the cookie domain by the API's own rule (exact loopback values, a comma-separated list, the build-time VITE_COOKIE_DOMAIN), and an app whose domain is derived from the request host keeps that derivation"
        delivery: code-patch
        intent: "Follow-up to 2026-11-19-session-follow-ups part 3 (apps/web/app/session-cookie.ts, `sessionCookieDomain`, `expiredSessionCookies`). Apply that first. The web server's sign-outs must expire the session cookie on the same domain the API set it on; this note fixes four ways the web helper disagreed with the API. No package changes and no change to package.json, nx.json or tsconfig.base.json. No new environment variable. Behaviour changes, plainly: (a) a cookie domain such as `127.example.com` is now treated as a domain on the web, as the API already treated it (before, the web dropped it as loopback and a sign-out left the API's domain cookie in place); (b) a comma-separated `API_COOKIE_DOMAIN` now sets the cookie on its first entry on the API (before, the template's API passed the whole string to the cookie serializer, which throws \"option domain is invalid\", so a sign-in with such a value failed) and the web expires that same entry; (c) a `VITE_COOKIE_DOMAIN` inlined at build time is used when the web service's runtime environment has none. Deployments with a single domain, `localhost`, `127.0.0.1`, `[::1]` or nothing set get exactly the cookies they got before. 1. One rule, two copies with one table. New libs/api/config/src/lib/cookie-domain.ts `cookieDomainFromSetting(value)` (exported from the config barrel): the first nonempty comma-separated entry of the value, trimmed; undefined (host-only) for nothing, `localhost`, `127.0.0.1` or `[::1]`, matched exactly. libs/api/config/src/lib/configuration.ts sets `api.cookie.options.domain` through it. apps/web/app/session-cookie.ts has an identical `cookieDomainFromSetting` (the web server cannot import the API's config), and both specs run the same table: libs/api/config/src/lib/cookie-domain.spec.ts and apps/web/tests/session-cookie.spec.ts (localhost, 127.0.0.1, [::1], 127.example.com, subdomains, comma lists, blanks). Change both copies and both tables together. - An app whose API already reads `API_COOKIE_DOMAIN` as a list (first entry): its API rule is this one; adopt the helper or keep its own and run the table against it. - An app whose API reads a list differently (every entry, or one chosen by the request host): keep the API's rule and make the web helper's `cookieDomainFromSetting` match it, with the table changed to that rule in both specs; do not take the template's first-entry rule. - An app whose API sets no cookie domain at all: the API change is not-applicable; the web change still applies. 2. The web's loopback rule is exact. 2026-11-19 part 3's helper dropped any value starting with `127.`, while the API drops only `127.0.0.1`. `127.example.com` (or any domain whose first label is `127`) lost its domain cookie expiry on the web, and the API's cookie survived a sign-out. Now both drop exactly `localhost`, `127.0.0.1` and `[::1]`. - An app that took part 3's `startsWith('127.')`: replace it with the exact rule. An app whose API uses a wider loopback rule of its own (every 127.x address, every IP literal): keep the two the same, whichever rule that is, and say so in the report. 3. Which setting decides, on the web. `sessionCookieDomain(options?)` takes the first of these that is set (blank counts as unset): `VITE_COOKIE_DOMAIN` in the runtime environment, `VITE_COOKIE_DOMAIN` inlined at build time (`import.meta.env`, restored: part 3 read only `process.env`, so a deploy that gives the web service the value only at build time lost its domain expiry), then `API_COOKIE_DOMAIN` in the runtime environment; that value is read by `cookieDomainFromSetting`. A second parameter (`sources`) exists only so specs can pin each source; callers omit it. Because the build now inlines `VITE_COOKIE_DOMAIN`, apps/web/project.json adds `{ \"env\": \"VITE_COOKIE_DOMAIN\" }` to the `build` target's `inputs`, so changing or removing it rebuilds the web bundle instead of reusing a cached one with the previous domain. - An app whose web build target is defined elsewhere (nx.json `targetDefaults`, a plugin inference): add the same env input there. 4. Correction to 2026-11-19 part 3's advice. Part 3 said \"an app whose sign-out cookie code lives elsewhere: use the helper there too\". That helper read the environment only, so an app whose API derives the cookie's domain from the request host (and sets no `API_COOKIE_DOMAIN`) lost its domain expiry when it replaced its own host-derived code with it. Do not replace a host-derived clear with an env-only one. `sessionCookieDomain` and `expiredSessionCookies` now take `{ hostDerivedDomain }`: the domain the app's API derives for this request, used only when no setting above is present, and checked by the same rule. The template's API never derives a domain, so the template passes none and its cookies are unchanged. - An app whose API derives the cookie domain from the request host: pass the same derivation (for example from `new URL(request.url).hostname`) as `hostDerivedDomain` at each sign-out (/force-logout, the root loader's redirect, entry.server `forceLogoutResponse`); or keep the app's own host-derived helper and have it also expire the configured domain. Either way, a spec with no cookie env set must still expire the derived domain. - An app that already replaced its host-derived clear with part 3's helper: restore the derivation this way; that is the regression this part corrects. - An app whose domain comes from the environment only: nothing to do for this part. Verification: `pnpm exec nx test web --skip-nx-cache` (tests/session-cookie.spec.ts \"which setting decides\": the host-derived domain when nothing is set, a setting over it, the build-time fallback)."
        area: auth
        affectedPaths:
          - libs/api/config/src/lib/cookie-domain.ts
          - libs/api/config/src/lib/cookie-domain.spec.ts
          - libs/api/config/src/lib/configuration.ts
          - libs/api/config/src/index.ts
          - apps/web/app/session-cookie.ts
          - apps/web/tests/session-cookie.spec.ts
          - apps/web/project.json
          - docs/template/README.md
          - .env.example
        verification:
          - pnpm typecheck
          - pnpm exec nx test config --skip-nx-cache
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec nx build web --skip-nx-cache
          - pnpm exec nx build api --skip-nx-cache
          - pnpm run nestled-doctor
        skipIf:
          - The project has no web app and its API sets no cookie domain.
        agentHints:
          - "Start by writing down, for this app, the rule its API uses to choose the cookie's Domain (libs/api/config configuration.ts or wherever `res.cookie` gets its options): env only, a list, or derived from the request host. The web helper must reproduce that rule; this note's template rule is env only, first list entry, exact loopback values."
          - Do not change which domain the API sets its cookie on beyond (b) in the intent. If adopting the template's rule would change it for a working deployment (an app whose API deliberately uses every list entry, or a wider loopback rule), keep the app's rule, mirror it on the web and record adapted.
          - "To check a deploy with a cookie domain: sign in, trigger a forced sign-out, and confirm two `Set-Cookie` expiries for the session cookie, one with `Domain=` equal to the domain the API's sign-in response set."
        applyAfter:
          - 2026-11-19-session-follow-ups
        patch: patches/2026-11-20-session-cookie-domain-rule.diff
      - id: 2026-11-20-test-db-guard-follow-ups
        title: "Test database guard follow-ups: a database on the development server is never disposable, the e2e schema reset uses the same rule as the guard, run-tests specs stub every test-db.sh command, and the GRAPHQL_INCLUDE_STACKTRACE comment states the real condition"
        delivery: code-patch
        intent: "Follow-ups to part 4 of 2026-11-19-dev-tooling (apply that first). Four parts; 1 and 2 go together, 3 and 4 are independent. No package is added, removed or bumped, and package.json, nx.json and tsconfig.base.json are unchanged. No API or product behaviour changes: part 4 is a comment. 1. One rule for every path that can write to, reset or drop a test database, and a database on the development server is never disposable. In 2026-11-19-dev-tooling the development-server check (a local URL on POSTGRES_PORT) lived only in `assertDisposableTestDatabase`, as an overridable reason, while `isDisposableTestDatabase`, which global setup's P3005 recovery uses before `DROP SCHEMA public CASCADE`, ignored it. So a TEST_DATABASE_URL named `*_test` on the development server passed the reset's own check, and under `E2E_ALLOW_NON_DISPOSABLE_DB=1` setup migrated, pushed, seeded and could drop the schema of a database that lives beside the development data. apps/api-e2e/src/support/database-guards.ts: `nonDisposableReason(url, env)` now takes `env` (default process.env) and returns the development-server reason itself, with `overridable: false`, after the destination-override checks and before the schema, host and name checks. `isDisposableTestDatabase(url, env)` and `assertDisposableTestDatabase(url, env)` both read it, so the opt-out no longer admits the development server and its refusal says so (\"does not apply to a URL on the development server or one that could connect somewhere other than it appears to\"). New exported `resetTestDatabase(url, clients, env)` holds the from-scratch reset: it refuses, with the reason and before any SQL runs, anything `nonDisposableReason` refuses, whatever the opt-out says. global-setup.ts drops its local `resetTestDatabase` and calls the exported one with its database clients; the guard call before any write is unchanged. scripts/test-db.sh: new `refuse_development_server <action>`; `migrate` and `verify` call it and refuse a URL on the development server whether or not E2E_ALLOW_NON_DISPOSABLE_DB=1 (`ensure` already refused it). New cases: database-guards.spec.ts (a local `*_test` URL on POSTGRES_PORT is disposable without POSTGRES_PORT and refused with it, opt-out or not; `resetTestDatabase` runs no SQL for it, nor for another name, host or `?schema=`, with the opt-out) and scripts/dev-checkout.spec.mjs (`ensure`, `verify` and `migrate` refuse the repo's own URL and a URL of your own named `*_test` on the development port, with and without the opt-out, printing no password and running no `prisma migrate deploy`). 2. Behaviour change to check before taking part 1: a project that deliberately ran its tests in the development Postgres with E2E_ALLOW_NON_DISPOSABLE_DB=1 is now refused. Its fix is to run the test database in its own server (`pnpm test:db:start`, on POSTGRES_TEST_PORT) and point TEST_DATABASE_URL there. The opt-out still admits another host, another name or `?schema=` (a CI service container reached by its service name, for example). 3. Specs that run run-tests.sh against a stub scripts/test-db.sh. 2026-11-19-dev-tooling part 4(b) made apps/api-e2e/run-tests.sh call `./scripts/test-db.sh url` (when a URL is supplied) and `./scripts/test-db.sh verify` (always, before Vitest), and it did not mention specs that copy the wrapper into a temporary directory with a stub test-db.sh. Under `set -euo pipefail` a stub that lacks `verify`, or a temporary directory with no scripts/test-db.sh at all, aborts the wrapper before Vitest: the spec fails with an exit code and no message about why. The template's apps/api-e2e/src/support/e2e-runner.spec.ts stubs are now a `case` over exactly the commands each wrapper calls (run-tests.sh: url, ensure, start, verify, stop; scripts/run-e2e-tests.sh: url, start, stop), and any other command prints `test-db.sh stub: unexpected command: <name>` and exits 97, so the next new call names itself. The `verify` stub records the URL it was given and prints \"verify refused\" only when it refuses (it printed it on every call). New cases: verify runs last among the test-db.sh calls, with the URL the suite runs against, and no path through the wrapper (supplied URL, own container started, database created, ensure failing, stop failing) calls a command the stub does not stand in for. 4. .env.example, GRAPHQL_INCLUDE_STACKTRACE. The comment said the variable is ignored on every deployed environment whatever its NODE_ENV. The code (`includeGraphqlStacktrace` in libs/api/core/feature/src/lib/graphql-error-options.ts) only checks `GRAPHQL_INCLUDE_STACKTRACE === 'true' && NODE_ENV === 'development'`; nothing detects a deployed environment. The comment now says it is honoured whenever NODE_ENV=development, wherever the API runs, so a deployment with NODE_ENV=development and the variable true sends stack traces to every client; leave it unset in Railway and CI. Comment only; behaviour unchanged."
        area: infra
        affectedPaths:
          - apps/api-e2e/src/support/database-guards.ts
          - apps/api-e2e/src/support/database-guards.spec.ts
          - apps/api-e2e/src/support/global-setup.ts
          - apps/api-e2e/src/support/e2e-runner.spec.ts
          - apps/api-e2e/README.md
          - scripts/test-db.sh
          - scripts/dev-checkout.spec.mjs
          - .env.example
        verification:
          - node --test scripts/dev-checkout.spec.mjs
          - "pnpm exec nx run api-e2e:test-support --skip-nx-cache"
          - "pnpm exec nx run api-e2e:lint --skip-nx-cache"
          - git grep -nE "run-tests\.sh|test-db\.sh" -- '*.spec.*' '*.test.*'
          - pnpm run nestled-doctor
        skipIf:
          - "Parts 1 to 3: the project's e2e suite does not use the template harness (no apps/api-e2e/src/support/database-guards.ts or global-setup.ts that resets the schema, no scripts/test-db.sh; e2e on Testcontainers, for example). Record them not-applicable after checking that the project's own harness never resets or drops a database on the development server's port."
        agentHints:
          - "Part 1: search the project for every place a test database is reset, dropped or truncated (`git grep -niE \"drop schema|drop database|truncate|migrate reset\" -- apps/api-e2e scripts`) and make each one decide with `nonDisposableReason(url, env)` / `isDisposableTestDatabase(url, env)`, or call `resetTestDatabase`. A project whose global setup has no guard call before its first write (`assertDisposableTestDatabase(testDatabaseUrl)` before migrate, push and seed) is missing 2026-11-19-dev-tooling part 4(c) too; add both. If your copy of database-guards.ts differs, port the rule, not the file: the development-server reason is not overridable and every disposability check reads it."
          - "Part 1: POSTGRES_PORT reaches global setup only through Nx loading the repo-root .env (and test-db.sh reads .env itself). If your e2e target is not run through Nx, or your development Postgres port lives under another name, pass that port as POSTGRES_PORT in the env given to the guard; without it the development-server check is inactive, as in CI."
          - "Part 1, your own specs: an existing case that expects `'allowed'` for a URL on POSTGRES_PORT with E2E_ALLOW_NON_DISPOSABLE_DB=1 now fails by design; change it to expect the refusal. A case that calls `isDisposableTestDatabase(url)` with no `env` reads process.env, where Nx's .env may set POSTGRES_PORT=5432; pass `{}` (or the env the case means) so it does not depend on the machine."
          - "Part 3: find every spec that runs run-tests.sh or scripts/run-e2e-tests.sh from a temporary directory (the verification grep lists them; look for copyFileSync of run-tests.sh, a written scripts/test-db.sh, or a lifecycle harness that stubs psql or the pg runner). Each needs a scripts/test-db.sh stub that answers every command the wrapper calls: `url` (print the URL), `verify` (exit 0 unless the case is about a refusal), and `ensure`, `start`, `stop` where your wrapper calls them. Make an unknown command fail with its name, as the template's stub does. A harness whose temporary directory has no scripts/ at all needs the stub added."
          - "Part 3: if your run-tests.sh does not call `test-db.sh verify` (you recorded 2026-11-19-dev-tooling part 4(b) not-applicable or adapted it away), the stub still should not accept commands the wrapper never calls; list the ones yours does."
          - "Part 4: .env.example is repo-owned; replace the comment above GRAPHQL_INCLUDE_STACKTRACE with the template's wording, or your own words for the same condition. Check your deployed environments do not run with NODE_ENV=development; if one does, make sure GRAPHQL_INCLUDE_STACKTRACE is unset there."
        applyAfter:
