        patch: patches/2026-10-19-db-update-doctor-after-schema-refresh.diff
      - id: 2026-10-19-redis-fail-fast-timeouts
        title: The auth cache and the pub-sub publisher fail fast when Redis is slow or unreachable, so requests fall through instead of hanging
        delivery: code-patch
        intent: "Auth cache. libs/api/utils/src/lib/services/auth-cache.service.ts creates its ioredis client with `maxRetriesPerRequest: 1`, `connectTimeout: 2000` and `commandTimeout: 3000` (exported as AUTH_CACHE_REDIS_TIMEOUTS), in place of `maxRetriesPerRequest: 3` and no timeouts. The client is still lazy; the service now connects once at boot and logs either \"Auth cache Redis connected\" or \"Auth cache Redis connection failed: <reason>\", where the reason is ioredis's error message (host and port at most, never the URL or password). A failed connect leaves the client in place, so ioredis keeps reconnecting. Authorization does not change: every cache read already treated an error as a miss and went to the database. The timeouts only bound how long a read waits before it does, and commandTimeout also bounds a command parked in the offline queue while disconnected. Pub-sub. libs/api/core/data-access/src/lib/api-core-pub-sub.ts builds the publisher and the subscriber from redisPubSubClientOptions(role). Both get `connectTimeout: 2000`. The publisher, which runs inside mutations, also gets `maxRetriesPerRequest: 1` and `commandTimeout: 3000`. The subscriber keeps `maxRetriesPerRequest: 3` and gets no commandTimeout: a subscriber connection waits indefinitely for messages by design, a timeout on SUBSCRIBE would drop a healthy subscription on a slow reply, and the subscriber is never on a request's critical path. The retry strategy, the IPv6 family, TLS handling and lazy connect are unchanged. Specs: auth-cache.service.redis-options.spec.ts asserts the client options, the boot log in both outcomes and that neither log carries the URL or password; api-core-pub-sub.spec.ts asserts both roles' options and that the module creates each client with its own."
        area: api
