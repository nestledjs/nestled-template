      - id: 2026-11-11-logout-only-on-unambiguous-401
        title: "Log out only on an unambiguous 401: outage evidence anywhere in a request (or, in the browser, while an outage is being shown), or a Me query that fails with any answered error but a 401, keeps the session instead of signing the user out"
        delivery: code-patch
        intent: "Follow-up to 2026-11-09-error-recovery-r3 and 2026-11-10-r3-followups-web (apply both first; this note changes the code they added). The rule: log out only when the API has definitely rejected the session, that is at least one 401 or UNAUTHENTICATED answer and no outage evidence (unreachable, 502/503/504, or a redacted stream error with nothing recorded). With mixed evidence keep the session: the self-recovering 503 screen retries, and if the session really has expired the first load after recovery gets a clean 401 and logs out then. No package changes. 1. Server render. libs/shared/apollo/src/lib/apollo-loader.ts ranked recorded causes `other < unavailable < unauthenticated`, so one 401 in any preload outranked an outage in another. The rank is now `other < unauthenticated < unavailable`, exposed as the new exported `mergeApiFailureCauses(a, b)`, which the per-request record and `ssrApiFailureCause` both use. apps/web/app/entry.server.tsx `shellErrorOutcome(error, cause)` let the recorded cause replace the shell error's own (`effectiveCause = cause ?? ownCause`), so an `unavailable` shell error still logged out when another preload recorded a 401, and a 401 shell error gave 503 or 500 depending on what was recorded. It now combines them: `mergeApiFailureCauses(ownCause, cause)`, with the redacted Apollo stream error contributing no own cause, and a result of undefined (redacted, nothing recorded) still meaning `unavailable`. A shell error that is not an API failure (`classifyApiFailure` says `other`) is still `error` (a plain 500, no cookie change) whatever was recorded, as 2026-11-10-r3-followups-web made it. Outcomes, shell error x recorded cause (none / unauthenticated / unavailable / other): 401 -> force-logout / force-logout / unavailable / force-logout; unreachable or 502/503/504 -> unavailable in every column; plain render error -> error in every column; redacted stream error -> unavailable / force-logout / unavailable / error. 2. Browser. The error link logged out on any 401, and the Me error boundary rendered a 401 as signed out (which the signed-in layout turns into /force-logout), even while the app was confirming an outage or showing the recovering screen. - libs/shared/apollo/src/lib/apollo.ts: new `signalApiOutage(source, active)` and `isApiOutageSignalled()` (a set of sources, so several mounted checks do not clear each other). The error link's 401 handling does nothing while any outage is signalled, and records that it let one pass; new `takeDeferredAuthFailure()` returns and clears that record. - apps/web/app/api-availability.ts `refetchFailedQueries(client, { includeAuthFailures })` also refetches queries holding a 401 / UNAUTHENTICATED error when asked; `useRefetchFailedQueries` returns `(options?) => void` and keeps the request across a backoff deferral. App's `onRecover` and `onBlipCleared` pass `includeAuthFailures: takeDeferredAuthFailure()`, so a query whose 401 was let pass during the outage gets a fresh answer: data, or a 401 with no outage that logs out as usual. Return-to-tab refetches still never replay a 401. - apps/web/app/api-availability.ts `useApiAvailability` signals an outage, keyed by the hook instance, whenever its phase is `confirming` or `unavailable`, and clears it on `available` and on unmount. - apps/web/app/app.tsx: `MeQueryErrorBoundary` and `handleMeQueryError` use a new `meFailureAwaitsRecovery(error)`: a connectivity failure, or a 401 while an outage is signalled, shows the recovering fallback and retries Me once the API answers (the boundary's state field `connectivityFailure` is renamed `awaitsRecovery`, and `onError` receives it as a second argument). The decision sticks to the Me query ref (a module WeakSet): once the outage clears, App mounts the boundary again with the same failed ref until the retry brings a new one, and judging that old 401 afresh, with no outage signalled any more, would sign the user out without a new answer. The boundary now resets on a new ref in `getDerivedStateFromProps` instead of `componentDidUpdate`, which rendered the old failure against the new ref for one frame. A 401 with no outage signalled renders as signed out, as before. - apps/web/app/root.tsx `ErrorBoundary`: an unauthorized error while an outage is signalled renders `<RecoveringApiUnavailable initialReason=\"server\" />` instead of going to /force-logout; it reloads once the API answers and the server render decides again. 3. Browser, with no outage. A Me query that failed with an answered error other than a 401 (a 500, an unparsable response, or a GraphQL error that is not UNAUTHENTICATED) still rendered as signed out, and on a signed-in route the layout turned that into /force-logout. Nothing about such an answer says the session is bad. apps/web/app/app.tsx gains `isAnsweredApiFailure(error)`: a `CombinedGraphQLErrors`, `ServerError` or `ServerParseError` that `classifyApiFailure` calls `other`. `meFailureAwaitsRecovery` now also returns true for it, so the Me boundary shows the recovering fallback and keeps the session. `handleMeQueryError` retries Me at once for it (`retryMeQuery`, read through a ref so the callback keeps its identity) instead of reporting a connectivity error: the API answered, so there is no outage to confirm, and no outage is signalled meanwhile. A Me that keeps failing is retried on the existing backoff (`retryDelayMs`), and the first Me the network answers resets it. Logout stays only for a 401 / UNAUTHENTICATED with no outage signalled. An error thrown by the app's own code (not an API answer) is part 4's. Affected paths: apps/web/app/app.tsx, apps/web/tests/api-availability.spec.tsx. Verification: `pnpm exec nx test web --skip-nx-cache` (the \"an answered error other than a 401\" cases: a Me 500 keeps the session and signs back in when Me succeeds, with no connectivity probe; a Me that keeps failing shows the recovering screen and retries with backoff; a non-UNAUTHENTICATED GraphQL error keeps the session; an UNAUTHENTICATED GraphQL error with no outage still logs out), `pnpm exec nx run web:typecheck`. 4. Browser: an error from the app's own code. `MeQueryErrorBoundary` sits above every route that has no error boundary of its own, so it also caught an `Error` thrown by a route's render or effect, and rendered it as signed out (`user: null`). On a signed-in route the layout turned that into /force-logout, which cleared the session cookie: a render bug logged the user out. Only a Me/session failure may render as signed out. apps/web/app/app.tsx gains `isMeSessionFailure(error)`, judged by the error itself: a `CombinedGraphQLErrors`, `ServerError` or `ServerParseError` (an answer from the API), or `isRetryableConnectivityError` (a request that never got one). `getDerivedStateFromError` stores anything else as `appError`, and `render()` re-throws it, so it reaches the next error boundary up (the root `ErrorBoundary`'s error screen, or a route-level one) with the user still signed in: no /force-logout, no cookie change, no cache reset, and no Me retry or connectivity probe (`componentDidCatch` ignores it, so `onError` is not called). A new Me query ref still resets the boundary. Every Me/session failure is handled as in parts 2 and 3: connectivity, answered non-401 and outage-401 failures show the recovering screen, and a 401 / UNAUTHENTICATED with no outage renders as signed out and logs out. The boundary also records the error (a module WeakSet read by the new exported `isAppCodeError(error)`), and apps/web/app/root.tsx `ErrorBoundary` never treats such an error as unauthorized: its message checks (\"Unauthorized\", \"Session has been invalidated\") are for API failures, and an app error that happens to say either must not reach /force-logout. Affected paths: apps/web/app/app.tsx, apps/web/app/root.tsx, apps/web/tests/api-availability.spec.tsx. Verification: `pnpm exec nx test web --skip-nx-cache` (the \"an error thrown by the app's own code\" cases: a signed-in child route that throws a plain `Error` during render, or in an effect, shows the root error screen, never renders as signed out and never reaches /force-logout or `location.assign`, including when its message says \"Unauthorized\" or \"Session has been invalidated\"), `pnpm exec nx run web:typecheck`. Tests: apps/web/tests/entry-server-shell-error.spec.tsx replaces the `shellErrorOutcome` table with the full 4 x 4 table above. libs/shared/apollo/src/lib/apollo.spec.ts: the loader-record test now expects `unavailable` for a 401 and an outage in two loaders; new tests for a 401 and an outage in the same loader (either order), for `mergeApiFailureCauses`, and for the error link keeping the session while an outage is signalled. apps/web/tests/api-availability.spec.tsx: new tests for the hook's outage signal, for a Me 401 during an outage (kept, then signed back in; kept when the outage is confirmed and the retry's loader is still running as the screen comes down; or logged out by a clean 401 after recovery), for refetching deferred 401s, and for the root ErrorBoundary."
        area: web
        affectedPaths:
          - libs/shared/apollo/src/lib/apollo-loader.ts
          - libs/shared/apollo/src/lib/apollo.ts
          - libs/shared/apollo/src/lib/apollo.spec.ts
          - apps/web/app/entry.server.tsx
          - apps/web/app/api-availability.ts
          - apps/web/app/app.tsx
          - apps/web/app/root.tsx
          - apps/web/tests/entry-server-shell-error.spec.tsx
          - apps/web/tests/api-availability.spec.tsx
        verification:
          - pnpm typecheck
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec nx test apollo --skip-nx-cache
          - pnpm exec nx build web --skip-nx-cache
          - pnpm run nestled-doctor
        patch: patches/2026-11-11-logout-only-on-unambiguous-401.diff
      - id: 2026-11-11-r5b-wave-followups
        title: "R5b fleet follow-ups: web-ui's Vite config loads as ESM, the invitation redirect timer honours isCurrent, serve:production has no HMR, two specs fixed or added, api lcov paths normalized, gitleaks history findings documented"
        delivery: code-patch
        intent: "Follow-up to 2026-11-10-nx-24-ts-6-eslint-10 and 2026-11-10-r5b-pilot-followups (apply both first). Seven parts, each independent. No package changes, and no change to package.json, nx.json or tsconfig.base.json. 1. libs/web-ui/vite.config.ts is renamed libs/web-ui/vite.config.mts. libs/web-ui has no package.json, so Node treated the .ts config as CommonJS, and Nx's project-graph build `require()`d it, and with it the ESM-only @vitejs/plugin-react 6, while another config `import()`ed the same module. In CI that failed at random with \"not yet fully loaded\"; it does not reproduce locally. A .mts file always loads as ESM. The config gains a header comment saying so. Everything that names it follows: libs/web-ui/vitest.config.mts imports `./vite.config.mts` (its full name), libs/web-ui/tsconfig.spec.json adds `\"allowImportingTsExtensions\": true` and `\"noEmit\": true` for that import, the root vitest.config.ts project list names `libs/web-ui/vite.config.mts`, sonar-project.properties adds `**/vite.config.mts` beside each `**/vite.config.ts` (exclusions, cpd exclusions, coverage exclusions), and SONARCLOUD_SETUP.md and libs/web-ui/README.md say the same. The tsconfig includes already listed both names. The template's other vite.config.ts files are safe: data-browser, shared-components and apps/web sit under a `\"type\": \"module\"` package.json, and shared/apollo and shared/sdk load no ESM-only plugin. New scripts/vite-config-module-format.spec.mjs fails for any tracked vite.config or vitest.config (.ts or .js) whose nearest package.json is not `\"type\": \"module\"` and that imports @vitejs/plugin-react, ignoring comments. 2. apps/web/app/routes/accept-invitation.tsx checked `isCurrent()` before scheduling the 1.5 s redirect to /members, but not when the timer fired. An accepted invitation the user had moved away from during the delay (another invitation link, or another route) still redirected over the new page, and an effect re-run after the acceptance succeeded scheduled a second timer, so the route navigated twice. `acceptInvitationAsync(isCurrent, onRedirectScheduled)` now hands the timer to the effect, the timer callback returns early unless `isCurrent()`, and the effect's cleanup calls `clearTimeout` on it. New cases in apps/web/tests/routes/accept-invitation.spec.tsx: invitation A is accepted, the user follows a link to B (pending) within the delay, and 1.8 s later the page has not gone to /members; and an effect re-run after acceptance gives exactly one navigation to /members (one location key). 3. `nx serve web --configuration=production` must serve without HMR, as the @nx/vite:dev-server production configuration (`hmr: false`) did before the Nx 24 executor conversion. With a plain `vite --mode production` that has to come from apps/web/vite.config.ts: `server: { hmr: mode !== 'production', ... }` with the config exported as `defineConfig(({ mode }) => ({ ... }))`. The template already had this; new apps/web/tests/vite-config-serve.spec.ts (`// @vitest-environment node`) reads the serve target's `--mode` from apps/web/project.json, evaluates the config for it, and expects `server.hmr` false for production and true for development. 4. scripts/postgres-readiness.spec.mjs took every `pg_isready` in a probed file as a probe, so a comment that merely mentioned it failed the check as a socket probe. `readinessProbes(source, file)` now blanks comments first (`#` comments in shell and YAML, `//` and `/* */` in JavaScript, keeping a URL's `://`). New cases: such a comment in each kind of file is not a probe, and a line with a URL keeps its probe. 5. libs/web/src/lib/hooks/useInfiniteApolloList.ts had no spec, and its lines counted as uncovered new code in Sonar. New libs/web/src/lib/hooks/useInfiniteApolloList.spec.tsx drives it through a fake IntersectionObserver: pagination (fetch from the current count, one page at a time, a short page marks the list loaded and stops), disabled and no-loader cases, reset on a change in `deps` (by value or length) but not on equal deps, `reset()`, and disconnect on unmount. Coverage of the hook is 100%. 6. Under Nx 24, Jest runs from each project's root, so the api libraries' lcov reports say `SF:src/lib/x.ts`, and scripts/normalize-lcov-paths.ts listed only the Vitest reports, so the api paths reached SonarCloud project-relative and every api library file showed as uncovered. The script now finds every `coverage/<project root>/lcov.info` (skipping `lcov-report/`) and rewrites its SF: lines against that project root: paths under src/, app/, tests/ or test/ get the prefix, absolute paths lose the repo root, a `../../libs/...` path is resolved, and repo-relative paths are kept. Its functions (`normalizeSourceFile`, `normalizeLcov`, `findLcovReports`, `normalizeLcovReports`) are exported and the rewrite runs only when the file is executed, so new scripts/normalize-lcov-paths.spec.mjs imports and tests it, including a fixture coverage tree with two api reports. `pnpm coverage:normalize-lcov` (`tsx scripts/normalize-lcov-paths.ts`) and CI's sonar job are unchanged. 7. gitleaks. .gitleaks.toml's header now says that a history finding which cannot be rewritten is ignored by fingerprint in .gitleaksignore (gitleaks 8.30 has no fingerprint allowlist in the TOML), and the template ships an empty, commented .gitleaksignore. The gitleaks job's comment in .github/workflows/ci.yml now says that a pull request scans only its own commits while a develop push scans the whole history, so before the first merge after enabling full-history scanning, run `gitleaks git .` from a full clone."
        area: infra
        affectedPaths:
          - libs/web-ui/vite.config.mts
          - libs/web-ui/vitest.config.mts
          - libs/web-ui/tsconfig.spec.json
          - libs/web-ui/README.md
          - vitest.config.ts
          - sonar-project.properties
          - SONARCLOUD_SETUP.md
          - scripts/vite-config-module-format.spec.mjs
          - apps/web/app/routes/accept-invitation.tsx
