      - id: 2026-11-16-tooling-spec-fixes-2
        title: "Repo-tooling fixes from the 2026.11.7 rollout: the gitignore spec checks every folder and keeps a project's own test output, safe global-stub teardown for every web spec, and note-authoring rules"
        delivery: code-patch
        intent: "Follow-ups to 2026-11-14-tooling-spec-fixes (apply that first). Three parts, each independent. No package changes, and no change to package.json, nx.json or tsconfig.base.json. 1. scripts/gitignore-test-output.spec.mjs, \"ignores coverage output wherever a project writes it\". (a) It found projects only by a tracked project.json, so a folder without one (a tools/ plugin such as tools/nx-plugins, a library configured another way) was never checked, and neither was a shard folder. Discovery is now every folder that holds a tracked file, at any depth, with no project.json needed (exported `trackedFolders`). For each one, `coverageOutputCandidates` checks `<folder>/coverage/lcov.info`, `<folder>/coverage/shard-1/lcov.info`, `coverage/<folder>/lcov.info` and `coverage/<folder>/shard-1/lcov.info`. All paths go to one `git check-ignore --no-index --stdin -z` call (`notIgnored(paths, cwd)`), not one call per path. `projectCoverageOutput` is gone. (b) A project's own entries lived in TEST_OUTPUT, inside the template-owned spec, so taking the template's copy dropped them. They now go in new scripts/known-test-output.json: a JSON array of repo-relative paths that must be ignored (`[]` in the template; an absent file counts as empty; anything but an array of strings is an error). It belongs to the project, like scripts/known-tracked-ignored.json, which works as before. The `tools/workspace-plugin/coverage/...` examples that 2026.11.7 removed are back in TEST_OUTPUT. New cases: a folder without project.json, shard folders, the repository root, and a scratch repository whose narrower .gitignore misses a plugin's coverage. Three of them fail against the 2026.11.7 discovery. 2. apps/web/tests/setup.ts (the web app's Vitest setup file). 2026.11.7 part 3 fixed the teardown order in one spec. Every spec that stubs a global and calls `vi.unstubAllGlobals()` in its own afterEach has the same problem. Vitest runs afterEach hooks in reverse order of registration, and Testing Library registers its automatic cleanup when it is imported, so the spec's unstub runs first and the unmount after it. Passive effects flushed by that unmount then meet the real global: \"IntersectionObserver is not defined\", or a real fetch or location. Whether an effect is still pending depends on timing, so the failure is random and depends on test order. The setup file now wraps `vi.unstubAllGlobals` so that it calls Testing Library's `cleanup()` first. `cleanup()` is idempotent, so the later automatic cleanup finds nothing to unmount. No individual spec needs its own `cleanup()` call any more; the ones that have one keep working. New apps/web/tests/setup-teardown-order.spec.tsx stubs a global, unstubs it in afterEach, and checks right after the unstub that the component has unmounted and saw the stub. It fails without the setup change on every run, and each test can run alone. 3. .nestled-updates/upgrade-notes/README.md, \"Before you publish a note\": three authoring rules. Raw patches are applied with `patch -N` or `git merge-file`, never `git apply --3way` (a downstream project lacks the patch's base blobs, and the whole apply fails). A note must not assume the project has the template's routes and helpers (a signed-in layout, `/force-logout`, an organization switch mutation, an access-forbidden event, `currentSubscriptionActive`, Me resolved in a layout rather than the root loader) and gives a fallback for each shape. Two notes in a release that edit the same file declare `applyAfter`. This only changes authoring guidance; a project that writes no upgrade notes of its own needs nothing."
        area: infra
        affectedPaths:
          - scripts/gitignore-test-output.spec.mjs
          - scripts/known-test-output.json
          - apps/web/tests/setup.ts
          - apps/web/tests/setup-teardown-order.spec.tsx
          - .nestled-updates/upgrade-notes/README.md
        verification:
          - node --test scripts/*.spec.mjs
          - pnpm exec nx test web --skip-nx-cache
          - pnpm exec vitest run --config apps/web/vite.config.ts --sequence.shuffle --sequence.seed=1
          - pnpm exec vitest run --config apps/web/vite.config.ts --sequence.shuffle --sequence.seed=2
          - pnpm exec vitest run --config apps/web/vite.config.ts --sequence.shuffle --sequence.seed=3
          - pnpm exec nx run-many -t lint --skip-nx-cache
          - pnpm run nestled-doctor
        agentHints:
          - "Applying a raw patch for any part: run `patch -N`, or `git merge-file` with the template's before and after copies of the file. Never use plain `patch` (without a terminal it treats hunks that are already applied as reversed and undoes them), and never `git apply --3way`: it needs the patch's base blobs, which this project's object store does not have, and it refuses the whole patch on the first missing one. After any patch run, re-check every file you edited by hand and read `git diff`."
          - "Part 1: take the template's spec. Move every repo-local line you had added to TEST_OUTPUT (a shard report, a plugin's coverage, a report folder of your own) into scripts/known-test-output.json, and create that file as `[]` if you have none. Keep your scripts/known-tracked-ignored.json as it is. If the spec now lists paths that are not ignored, widen .gitignore (the template ignores every `coverage/` folder) rather than editing the spec. A project with tens of thousands of tracked folders still makes one git call; if the spec is slow there, report it rather than narrowing discovery."
          - "Part 2: apply the wrap to the setup file of every Vitest project that renders with Testing Library, not only apps/web: find them with `grep -n setupFiles` in each vite.config.* and vitest.config.* under apps and libs. A project with no setup file (libs/web in the template) either gets one, wired through `setupFiles` and excluded from the library's tsconfig.lib.json, or keeps its per-spec `cleanup()` calls. A project that is not jsdom (node environment, api-e2e) needs nothing. Remove the per-spec `cleanup()` calls only if you want to; they are harmless. Do not apply the wrap where a spec calls `vi.unstubAllGlobals()` in the middle of a test and then reads the rendered DOM: the wrap unmounts it. Search with `grep -rn \"unstubAllGlobals\" apps libs --include=*.spec.tsx --include=*.spec.ts` and read each call outside an afterEach or a test's final `finally` (none in the template). Prove it with the web suite shuffled at least three times, as in verification."
          - "Part 3: a project that writes its own upgrade notes takes the README's three rules; otherwise take the file as it is, or mark the part not-applicable if the project has no copy of it."
        patch: patches/2026-11-16-tooling-spec-fixes-2.diff
  - id: 2026.11.9
    date: 2026-11-18
    title: "2026.11.9: mutations reject on refusal, auth 401/403/503 clarity, session follow-ups, dev tooling"
    templateCommit: 77f0621
    notes:
      - id: 2026-11-19-mutation-errorpolicy-none
        title: Make a refused mutation reject by default (the web Apollo client's mutation errorPolicy becomes 'none'), audit every mutation call site for it, and give the web service its own /healthz
        delivery: code-patch
        intent: "Two parts. No package changes and no change to package.json, nx.json or tsconfig.base.json. No logout path changes: the session rule is unchanged (log a user out only when the API has definitely rejected the session, a real HTTP 401 or a GraphQL `UNAUTHENTICATED` with no outage evidence; outage evidence outranks a 401; anything else keeps the session). Behaviour changes, plainly: (a) every mutation that does not set its own `errorPolicy` now rejects when the API refuses it (a GraphQL error), instead of resolving with the error beside `data`; a caller that only awaited it and then showed success now reaches its `catch` (part 1). Queries are unchanged ('all'). (b) The web server answers `GET /healthz` with 200 `ok` without calling the API or reading the session, so the web service's health check no longer depends on the API (part 2). 1. Mutation errorPolicy default → 'none' (owner decision 2026-11-18). libs/shared/apollo/src/lib/apollo.ts `makeClient` set `defaultOptions.mutate.errorPolicy: 'all'`, so a refused mutation resolved, and any caller that awaited it without reading `error` treated the refusal as success. It is now `mutate: { errorPolicy: 'none' }`; `query` stays `'all'` and `watchQuery` is unchanged. This supersedes part 8 of 2026-11-16-session-org-consistency, which said to fix sites one by one and not change the default: keep the per-call `'none'` you added there (harmless, and it holds if a client ever defaults to 'all' again). Find the app's client first: `grep -rn \"defaultOptions\" apps libs --include='*.ts' --include='*.tsx'`. - The app uses the shared `makeClient` with `mutate: { errorPolicy: 'all' }`: change it to `'none'`, then audit (below). - The app's client sets no `mutate` default (Apollo's own default is already 'none'): nothing to change in the client; record the part as adapted with \"no 'all' default\" and skip the sweep, but still check any call sites that set `errorPolicy: 'all'` themselves (last row below). - The app has its own client factory or several clients: change the `mutate` default in each one browser code uses for writes. Then audit every mutation call site. Find them with: grep -rnE \"useMutation(<|\\()|\\.mutate(<|\\()|use[A-Z][A-Za-z]*Mutation\\(\" apps libs --include='*.ts' --include='*.tsx' | grep -vE \"spec|test|generated\" (multi-line generics such as `useMutation<\\n  A,\\n  B\\n>(` are caught by also grepping `useMutation<$`). For each site, take the verdict that matches: | the site today | verdict under 'none' | | --- | --- | | reads `result.errors` / `result.error` after awaiting | now throws: move that handling into a `catch` (or wrap the call in one); keep the \"no data\" fallback | | awaits inside `try/catch` | works as is; the catch now sees refusals (the fix) | | `useMutation(..., { onError })` | works as is: Apollo 4 calls `onError` and the returned promise rejects, which Apollo marks handled; do not add `.catch` just for that | | neither (awaits and moves on, or `try/finally` with no catch) | add visible error handling: catch, show the API's message, keep the form or dialog open, do not navigate or show success | | sets `errorPolicy: 'all'` on purpose (it really uses partial data from a failed mutation) | keep it, and add a comment saying why | Many apps already swept their sites with per-call `'none'` in 2026.11.8 (the lists are in their PRs); those sites are already correct, so start from that list and audit only what it left. Shared cards or dialog shells that run a mutation inside `try/finally` without a catch (for example a guarded editor's `run()` or a card's `onSave`) must get an error state first: catch, show the message, return failure to the caller. If that is more than the PR can carry, set `errorPolicy: 'all'` explicitly on those hooks with a comment (\"reads errors itself; give the card an error state before removing\") so the default change does not turn their refusals into uncaught rejections, and list them as follow-ups. List every site with its verdict in the PR. Template call sites, for reference: 57 sites in apps/web/app and libs/web/src. 53 already set `'none'` and catch (or rethrow to a caller that catches, as the access-control console adapter and the shared organization switch do). Two use `onError` (admin user emulation, the emulation banner): unchanged. One awaits in `try/catch` (logout's `Logout` mutation, which continues on failure by design): unchanged. One read the result's error (accept-invitation's `RegisterWithInvitation`): it now sets `'none'` and its catch shows the API message; the dead result-error read was removed. The published data-browser package's create/edit/delete pages run their mutations inside `try/catch` with no `errorPolicy`, so they inherit the host's default: with 'none' a refusal shows the API message instead of \"updated successfully\" (their `result.errors` read never matched Apollo 4's result shape). Tests: a spec that mocks `@apollo/client/react`'s `useMutation` by hand and resolves it with `{ errors }` or `{ error }` to simulate a refusal no longer matches the app; make the mock reject instead. A spec that builds its client with `makeClient(...).defaultOptions` now gets 'none'. Verification: `pnpm exec nx test apollo --skip-nx-cache` (\"rejects a mutation the API refuses, with the API message\", \"still resolves a query with its GraphQL error\"); `pnpm exec nx test web --skip-nx-cache` (apps/web/tests/mutation-error-policy.spec.tsx: \"a try/catch caller with no errorPolicy shows the API message, not success\" fails before the change). 2. Web health route (priority medium within this note). Railway's web service had no health check of its own, and anything it could probe (a page) runs the root loader, which preloads Me against the API: an API outage would fail the web deploy too. apps/web/app/routes/healthz.ts is a resource route (a `loader` and no default export) that returns `new Response('ok', { status: 200, headers: { 'Content-Type': 'text/plain; charset=utf-8', 'Cache-Control': 'no-store' } })`, and apps/web/app/routes.tsx registers it first and at the top level, `route('healthz', './routes/healthz.ts')`, outside the global, public and signed-in layouts. React Router serves a resource route by running only its own loader, so no layout loader, Apollo client, cookie read or API call runs. - An app with route middleware (`future.v8_middleware` or `unstable_middleware` on root or a layout): middleware still runs for resource routes; make the middleware return early for `/healthz`, or do the session work in loaders instead. - An app whose server (server.js / Express) does auth, redirects or proxying before React Router: answer `/healthz` there, before those handlers, with the same body and headers. - An app using file-system routes (`flatRoutes()`): add `app/routes/healthz.ts`; a top-level file is outside every pathless layout already. If a `_layout`-style parent would wrap it, move it out. The Railway step is the owner's, not the PR's: set the web service's health check path to `/healthz` in the Railway dashboard (Railway reads no file from the repo for this). AGENTS.md in the template documents it beside the api's `/api/uptime`; AGENTS.md is not promoted, so add the same line to the app's own deploy notes if it has them. Verification: `pnpm exec nx test web --skip-nx-cache` (apps/web/tests/healthz.spec.ts: 200 `ok`, text/plain, no-store; no fetch and no root loader call with a session cookie; 200 while the API is down); after deploy, `curl -i https://<web-domain>/healthz`."
        area: web
        affectedPaths:
          - libs/shared/apollo/src/lib/apollo.ts
          - libs/shared/apollo/src/lib/apollo.spec.ts
