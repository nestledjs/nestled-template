      - id: 2026-11-10-r5b-pilot-followups
        title: "R5b follow-ups: an invitation is accepted once however often its effect re-runs, the last two react-hooks rules become errors, and lint caches hash the lint plugins"
        delivery: code-patch
        intent: "Follow-up to 2026-11-10-nx-24-ts-6-eslint-10 (apply that first; this note changes code and config it added). Three parts. No package changes. 1. apps/web/app/routes/accept-invitation.tsx auto-accepts a signed-in user's invitation from an effect. When that effect re-ran for the same invitation (React StrictMode replays effects in development, and a new `user` or `invitationDetails` object re-runs it in any build), every run sent its own acceptance. The token is single-use, so the second request was rejected as already used and showed an error to a user who had just joined, and the first request's redirect was dropped because its run had been superseded. Each token's acceptance is now kept for the route's lifetime in `acceptancesRef = useRef(new Map<string, Promise<unknown>>())`. Inside `acceptInvitationAsync(isCurrent)` a request starts only when the map has no entry for the token (so moving to another invitation link and back while the first is pending does not send a second acceptance either), as `Promise.resolve().then(() => acceptInvitation(...))` (a synchronous throw still becomes a rejection, and no state is set synchronously in the effect; this replaces the `new Promise(resolve => resolve(call()))` wrapper). Every run chains its own `isCurrent`-guarded `.then`/`.catch` onto the stored promise, so the run that is current when it settles redirects to `/members` or shows the error. A failed attempt stays stored, so a re-run shows its error rather than retrying in a loop. The per-token `failedToken` derivation and the `isCurrent` guard are unchanged. apps/web/tests/routes/accept-invitation.spec.tsx: new cases for a StrictMode render and for a re-render with a new `user` object (each sends exactly one acceptance and redirects to `/members`), for moving to another invitation link and back while the first acceptance is pending (still one request for it, and its success redirects), and for a failed acceptance that a re-render does not retry. 2. eslint-plugin-react-hooks v7's `recommended` set leaves `incompatible-library` and `unsupported-syntax` at warn, and `nx.configs['flat/react']` passes that set through, so both were still warnings although every react-hooks v7 rule is meant to be an error. The root eslint.config.mjs exports `reactHooksRuleLevels`, which sets both to `error` for the files `flat/react` registers the plugin on. Every React lint config spreads it right after `reactVersionSettings`: apps/web, libs/web, libs/web-ui, libs/shared/utils, libs/shared-components, libs/access-control and libs/data-browser. `exhaustive-deps` stays a warning. The template had no violations of either rule. 3. Every lint target's Nx cache hashed only `eslint` as an external dependency, so bumping a lint plugin (eslint-plugin-react-hooks, typescript-eslint, eslint-plugin-react, ...) replayed cached lint results computed with the old plugin. nx.json gains a `targetDefaults.lint` entry with the inferred inputs plus the lint plugins as external dependencies: \"lint\": { \"cache\": true, \"inputs\": [ \"default\", \"^default\", \"{workspaceRoot}/.eslintrc.json\", \"{workspaceRoot}/.eslintignore\", \"{workspaceRoot}/eslint.config.mjs\", \"{workspaceRoot}/tools/eslint-rules/**/*\", { \"externalDependencies\": [ \"eslint\", \"@eslint/js\", \"@nx/eslint-plugin\", \"typescript-eslint\", \"eslint-plugin-react\", \"eslint-plugin-react-hooks\", \"eslint-plugin-jsx-a11y\", \"eslint-plugin-import\", \"eslint-plugin-storybook\", \"eslint-config-prettier\", \"jsonc-eslint-parser\" ] } ] } apps/web/project.json's own `lint` target, a copy of the old inferred inputs that would override the default, is removed."
