      - id: 2026-10-18-template-tooling-nits
        title: The test database is created when missing, a failed probe says why, and the web-ui icons have specs
        delivery: code-patch
        intent: "Test database. scripts/test-db.sh gains an `ensure` command, and `start` and `reset` run it once the container is ready. It creates the database TEST_DATABASE_URL names when the server is up but does not have it: a fresh checkout or worktree whose URL names another database than the container's POSTGRES_DB, or a container whose data directory was initialised for another name. It only ever creates (never drops or alters), and only a database that is plainly a local test database: a plain postgres(ql):// URL on localhost, 127.0.0.1 or [::1], with no query string or fragment, whose name ends in _test. E2E_ALLOW_NON_DISPOSABLE_DB does not widen that. The new scripts/test-database.mjs does the work with the `pg` client: it checks the same rule again, connects with the URL's own credentials to the server's `postgres` database (`template1` when that is missing), and runs CREATE DATABASE only when pg_database lacks the name; a database another run created meanwhile counts as existing. The URL reaches it through the environment, never its command line, and every message it prints is scrubbed of the URL and its credentials. Every existing guard still runs first: test-db.sh refuses a .env value compose would read differently (a `$`, `KEY= # comment`, a quoted backslash, a multi-line value) before it connects anywhere. In `start` and `reset` a URL that is not a local *_test database is left alone, and a failure to create is a warning, since the container is up and the run that needs the database reports why. The shared refusal rule in test-db.sh is now one function, is_local_test_database, which `migrate` uses as well. Probe errors. apps/api-e2e/run-tests.sh no longer discards the `SELECT 1` probe's error output. When the probe fails it prints the client's error (a refused connection, a failed login, a missing database) with the test database URL replaced by `<TEST_DATABASE_URL>` and any `scheme://user:password@` user-info removed. It then runs `test-db.sh ensure` and probes again; only when the database is still unreachable does it fail (a supplied TEST_DATABASE_URL, now with the probe error) or start the repo's test container. apps/api-e2e/src/support/sql-runner.mjs exports scrubCredentials() and uses it for its own error output, so the URL, its user-info and its password (raw or percent-decoded) never reach stderr. Specs. scripts/test-database.spec.mjs covers the create, exists, race, template1 fallback and refusal paths and the scrubbing. scripts/dev-checkout.spec.mjs covers `test-db.sh ensure` (a stub `node` stands in for test-database.mjs), including that it never runs for a refused URL or an unreadable .env value, and that `start` ensures only a local *_test database; and it now asserts that `migrate`'s refusal never prints the password or the full URL. e2e-runner.spec.ts covers the printed probe error and the ensure-then-reprobe path; sql-runner.spec.ts covers scrubCredentials. libs/web-ui gains web-ui-social-links.spec.tsx and web-ui-avatar.spec.tsx, which check the accessible names 2026-10-15-svg-accessible-names gave those icons: each social link is named by its network and its icon is `aria-hidden`; the avatar's placeholder icon is `role=\"img\"` named after the user (\"Avatar\" without a name) when there is no image, and hidden when the `<img alt>` names the avatar. scripts/tsconfig.json and AGENTS.md no longer say the workspace root has no tsconfig.json as if that held everywhere. The template ships none; a project may have added one, and tsx would then use it. `--tsconfig scripts/tsconfig.json` is needed either way."
        area: infra
        affectedPaths:
