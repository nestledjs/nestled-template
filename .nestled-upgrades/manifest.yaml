        title: "The billing settings page opens read-only for billing:read, and only billing:manage can act"
        delivery: code-patch
        intent: "The organization billing settings page (apps/web/app/routes/settings/billing.tsx) no longer wraps itself in RequireOwner. It decides who sees what from the same membership the settings layout uses to show the Billing tab, so the tab never leads to a page that turns its user away. Viewing. Anyone who may see the Billing tab sees the page: a platform super admin, a member whose role holds billing:read or billing:manage, and (as the layout already allowed) a member of the role named Owner or Admin. A viewer without billing:manage gets a read-only page: the current plan, its price and interval, its status, the trial end or renewal / access-until date, and usage and limits, with a notice that changing billing needs billing:manage. Anyone else gets the existing \"Permission Required\" state, now worded for billing access rather than ownership, and none of the page. Acting. Every billing action is shown only to a super admin or a member whose role holds billing:manage, the permission the API's billing mutations require: Subscribe / Change Plan and the upgrade modal, Cancel Subscription, the customer-portal \"Manage Billing\" card and its button, and the \"Browse plans\", \"View Plans\" and \"Quick Subscribe\" calls to action. A role's name never grants an action. The portal and cancel handlers also return early without billing:manage. The layout's helpers move to apps/web/app/routes/settings/_settings-access.ts so both files share them: useSettingsOrganization() (the active organization and the viewer's membership from MyOrganizationsWithMembers), hasRolePermission(), hasBillingAccess() (now also true for billing:manage alone, so a manage-only role sees the tab) and the new canManageBilling(). The billing page renders nothing while that membership is still loading, instead of flashing the no-access state. The API, the seeded roles and the permission names do not change."
