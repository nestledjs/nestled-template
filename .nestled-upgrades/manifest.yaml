        skipIf:
          - The project's API answers a valid-but-not-allowed API token with a 403 that survives its AuthGuard, turns every failed organization, cache or WebSocket session check into a 5xx (or a database fallback), and always sets `includeStacktraceInErrorResponses` to false outside local development.
        agentHints:
          - "Parts 1, 2 and 8 (jwt.strategy.ts). If your strategy already has a private `authenticateApiToken` (some projects split it for Sonar earlier), keep its name and apply only the verdict shape and the two 403s; do not re-split it. If your project authenticates API tokens somewhere else (a separate strategy, a guard, middleware), apply the rule there: a refusal of a VALID token must not go through `fail`, whatever status it carries, because AuthGuard turns any `fail` into an UnauthorizedException. In a passport strategy use `this.error(forbiddenWithCode( '<CODE>', message))`; in a guard or middleware throw or `next()` the ForbiddenException. Check that no AuthGuard of yours overrides `handleRequest` to map every `err` to UnauthorizedException; if one does, make it rethrow `err`. If your project has no `forbiddenWithCode` (2026-11-14-api-auth-error-codes not applied), throw `new ForbiddenException({ statusCode: 403, error: 'Forbidden', message, code })`. If your project has no organization-scoped tokens or no resource binding, those refusals do not exist: record the part not-applicable and say so."
          - "Part 8, a project whose `validateApiToken` (or equivalent) refuses a token because of its owner's role (for example a token that only a superadmin may use, held by an owner who is not one, or an owner who lost the role since): that refusal currently answers null, so 401, and the client drops a token that is not revoked. Return a distinct verdict for it (do not overload null) and answer 403 with a code from the strategy (`this.error(forbiddenWithCode(…))`), and at an MCP endpoint a 403 with `WWW-Authenticate: Bearer error=\"insufficient_scope\"`. Keep 401 for an unknown, revoked, expired or stale-generation token and for an owner who is gone or disabled. List every API-token 401 you find with its verdict in the PR; anything you cannot classify (an MCP audience mismatch, a scoped token whose owner left the organization) is listed, not changed."
          - "Part 3. If your project has no `GqlAuthGuard` with an organization attach, look for whatever attaches the organization after authentication (a middleware, an interceptor, a root loader that reads the active organization on the web side) and check its catch: a 4xx may leave the request without an organization; anything else is a 503, never \"no organization\". If your attach throws its own 4xx for \"not a member\", keep it swallowed there."
          - "Part 4. If your project has no auth-cache service, the part is not-applicable. If it calls `getSessionValid` in its session check (an `isSessionValid` that reads the cache first), switch that call to `lookupSessionValid` and read the database on `miss` AND on `unavailable`; never answer \"invalid\" for `unavailable`. Any other caller of a `get*` method that treats null as a refusal moves to the matching `lookup*`. A caller that already reads the database on null may stay on `get*`. If your project's organization switch does not write the database (cache only), the database fallback in organization-context.service.ts would answer the old organization: answer 503 there instead and say so."
          - "Part 5. If your project has no graphql-ws subscriptions, the part is not-applicable. If your `onConnect` reads `connectionParams` (a bearer token) rather than the cookie, keep that source and apply the same outcomes: missing or unverifiable → `extra.socket.close(4401, 'Unauthorized')` and return false; internal failure → close 1013 and return false; never throw. If it also checks the session against the database at connect, a failed lookup is 1013, never 4401. On the web side nothing is required: graphql-ws already stops retrying on 4401 and retries 1013; do not log the user out on a 4401 close (only an HTTP 401 or `UNAUTHENTICATED` does)."
          - "Part 6. Spread `graphqlErrorOptions()` into your `GraphQLModule.forRoot` (or set `includeStacktraceInErrorResponses: includeGraphqlStacktrace()` next to your own `formatError` if you compose one; keep yours). Add `GRAPHQL_INCLUDE_STACKTRACE=false` to .env.example with the template's comment. Do not set it on any deployed environment. If your local NODE_ENV is not `development` (some projects use `local`), say so in the PR rather than widening the check."
          - "Part 7. If your project has an optional-auth path (a guard or strategy that lets an anonymous request through when there is no session, an `OptionalAuthGuard`, a `handleRequest` that returns null instead of throwing, a public resolver that reads the session itself): a 4xx refusal of the credential (missing, invalid, expired, revoked) stays anonymous; a failed lookup (database, Redis, an unexpected throw) is a 503, never silently anonymous. Add a test for each. If there is none, record the part not-applicable."
