id: 2026-08-10-dependency-security-refresh
title: Refresh dependencies and clear the lockfile security audit
priority: high
area: infra
type: deps
delivery: code-patch

intent: >
  Refresh direct dependencies across the workspace, resolve vulnerable transitive packages with
  narrow pnpm overrides, align peer-resolved runtime packages, and leave the committed lockfile
  with zero known pnpm audit advisories while preserving the application's current API contracts.

why: >
  The prior lockfile contained critical and high-severity vulnerable dependency paths. Compatible
  direct upgrades did not remove every transitive advisory, and unconstrained peer resolution also
  produced duplicate React versions that broke component tests. A reproducible security refresh
  needs both current package ranges and explicit, documented resolution constraints.

affectedPaths:
  - package.json
  - pnpm-lock.yaml
  - apps/web/package.json
  - apps/web/app/routes/sitemap.xml.ts
  - libs/data-browser/package.json
  - libs/shared-components/package.json
  - libs/shared/apollo/package.json

packageReleases: []

skipIf:
  - pnpm audit already reports zero advisories and the downstream dependency graph contains none
    of the vulnerable ranges or peer-resolution mismatches represented by this lockfile.

verification:
  - pnpm install --frozen-lockfile
  - pnpm audit
  - pnpm test
  - pnpm typecheck
  - pnpm exec nx run api:build --skipNxCache
  - pnpm exec nx run web:build --skipNxCache
  - pnpm run nestled-doctor
  - pnpm format:check

agentHints:
  - >
    Port the manifest and lockfile changes together, then regenerate the lockfile with the
    downstream workspace's pnpm version. Do not copy only the override block onto an unrelated
    dependency graph; confirm each override still has an affected path with pnpm audit or pnpm why.
  - >
    Keep React and React DOM resolved to 19.1.0 throughout this workspace. Allowing peer
    auto-installation to introduce a second React version causes invalid hook calls in the
    published component-library tests.
  - >
    Apollo Client remains pinned to 4.1.8 because 4.2 requires a separate client type migration.
    Stripe remains pinned to 22.0.2 because later 22.x releases require a newer Stripe API version,
    and prisma-graphql-type-decimal remains at 4.0.2 until the Jest/TypeScript module-resolution
    path supports its newer exports-only package shape. Treat those as deliberate compatibility
    holds, not stale versions to widen during this security patch.
  - >
    The less dependency's legacy image-size package has no patched release and this template has
    no LESS sources. The pnpm less>image-size removal is therefore intentional; remove it only if a
    downstream project actually compiles LESS, and replace the toolchain before doing so.
  - >
    @forge42/seo-tools no longer accepts the empty dynamicUrls sitemap option. Preserve the small
    sitemap compatibility edit when taking its upgrade. Playwright upgrades also require the
    matching Chromium test binary in local and CI environments.
