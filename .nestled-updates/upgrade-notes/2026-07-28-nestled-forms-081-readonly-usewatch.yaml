id: 2026-07-28-nestled-forms-081-readonly-usewatch
title: Nestled Forms 0.8.2 read-only stale-value and broken-type fixes, data-browser 1.0.19 peer widening
priority: normal
area: web
type: correctness
delivery: hybrid

intent: >
  Upgrade @nestledjs/forms from 0.8.0 to 0.8.2, which carries two separate fixes: the read-only
  stale-value fix in PhoneField and MarkdownEditor (shipped in 0.8.1) and the broken type
  declarations that 0.8.1 itself introduced (fixed in 0.8.2). Go straight to 0.8.2; do not stop
  at 0.8.1. Also publish @nestledjs/data-browser 1.0.19 with its @nestledjs/forms peer widened
  from exact "0.8.0" to "^0.8.0", so 0.8.x patches can be adopted without republishing
  data-browser.

why: >
  First fix, from 0.8.1. In 0.8.0 the read-only branches of PhoneField and MarkdownEditor read
  their value with form.getValues(field.key). getValues() is a one-shot read that creates no
  subscription, so a read-only phone or markdown field renders whatever the value was at mount and
  then goes stale the moment anything else calls setValue on that field — a reset(), a
  server-driven refill, or a sibling field writing to it. The rendered text silently disagrees with
  the form state that will actually be submitted. 0.8.1 reads through useWatch({ control, name })
  instead, which subscribes and re-renders.

  Second fix, from 0.8.2. 0.8.1 shipped broken type declarations. Every field .d.ts imported its
  types from '../../../../forms-core/src/index.ts' — a relative path that escapes the package and
  points into the publishing monorepo's source tree, which does not exist in any consumer's
  node_modules. 0.8.2 corrects these to '@nestledjs/forms-core'. It also changes the returned
  element type from import("react/jsx-runtime").JSX.Element to import("react").JSX.Element. 0.8.2
  changes no runtime .js at all; it is a types-only release on top of 0.8.1.

  Be careful how you verify the second fix. A project with "skipLibCheck": true — the common
  default, and what this template sets in tsconfig.base.json — will typecheck green on 0.8.1
  because TypeScript never validates the declaration files. A passing typecheck is therefore NOT
  evidence that 0.8.1 is safe. Projects with skipLibCheck false, or any tooling that resolves
  library types directly (editor IntelliSense, API extractors, publint-style checks), will hit
  hard unresolved-import errors on 0.8.1.

  Neither release changes the public API: same exports, same props, same field definitions.

  The peer widening is a separate concern bundled here. @nestledjs/data-browser 1.0.18 declared an
  exact peer "@nestledjs/forms": "0.8.0", so downstream projects that install data-browser from npm
  could not move off 0.8.0 without a peer violation — a pure bugfix was gated behind a package
  republish. 1.0.19 relaxes that single peer to ^0.8.0, which is what now lets 0.8.2 be adopted
  with no further data-browser release. Note this deliberately reverses part of
  2026-07-25-pin-forms-core-exact-080 for @nestledjs/forms only; @nestledjs/forms-core stays pinned
  exact at 0.8.0, because forms 0.8.2 still depends on forms-core exactly 0.8.0 and no 0.8.1 or
  0.8.2 of forms-core was ever published.

affectedPaths:
  - package.json
  - pnpm-lock.yaml
  - libs/data-browser/package.json

packageReleases:
  - name: '@nestledjs/data-browser'
    sourcePath: libs/data-browser
    targetVersion: 1.0.19
    versionRange: '>=1.0.19'

skipIf:
  - The downstream project does not use @nestledjs/forms.
  - The downstream project already runs @nestledjs/forms 0.8.2 or later in the 0.8.x line.
  - The project renders no read-only PhoneField or MarkdownEditor, does not consume
    @nestledjs/data-browser from npm, and sets skipLibCheck true; the upgrade is then optional
    housekeeping rather than a fix.

verification:
  - pnpm install
  - pnpm typecheck
  - pnpm nx run web:build --skip-nx-cache --output-style=stream
  - pnpm nx run web:test --skip-nx-cache --output-style=stream
  - pnpm nx run data-browser:typecheck --skip-nx-cache --output-style=stream
  - pnpm nx run data-browser:test --skip-nx-cache --output-style=stream
  - pnpm template:validate-upgrade-notes
  - pnpm format:check
  - pnpm run nestled-doctor

agentHints:
  - 'Bump @nestledjs/forms to 0.8.2, not 0.8.1. 0.8.1 fixes the stale read-only values but ships
    broken .d.ts files; 0.8.2 is 0.8.1 plus the declaration fix and no runtime change.'
  - 'Do NOT bump @nestledjs/forms-core. No 0.8.1 or 0.8.2 was ever published for forms-core, and
    forms 0.8.2 declares a hard dependency on forms-core exactly 0.8.0. Leave it at exact 0.8.0.'
  - 'Do not treat a green pnpm typecheck as proof the types are healthy if the project sets
    skipLibCheck true — that flag suppresses exactly the errors 0.8.1 would raise. To verify
    directly, grep the installed package for the leaked path:
    grep -r "forms-core/src/index.ts" node_modules/@nestledjs/forms should return nothing on 0.8.2.'
  - 'If the project also uses @nestledjs/forms-native, check the registry for a matching 0.8.2
    before bumping it; do not assume the version exists.'
  - 'Downstream projects that consume @nestledjs/data-browser should bump it to >=1.0.19. Do not
    copy libs/data-browser source into the downstream project.'
  - 'A downstream project that pins data-browser at 1.0.18 or earlier must upgrade data-browser in
    the same change, otherwise its exact "@nestledjs/forms": "0.8.0" peer conflicts with forms
    0.8.2 and the install fails or warns depending on package manager strictness. From 1.0.19
    onward the peer is ^0.8.0, so later 0.8.x patches need no data-browser release.'
  - 'No source changes are required in app code. The template needed none — there were no
    form.getValues() call sites outside the library.'
  - 'If the project defines its own custom form fields, apply the same pattern the library adopted:
    read field values with useWatch({ control: form.control, name: field.key }) rather than
    form.getValues(field.key), and call the hook unconditionally above any read-only early return
    so it is not sitting behind a condition. The upstream guidance is in the packages
    CREATING_NEW_FIELDS.md.'
  - 'Worth a quick manual check of any read-only phone or markdown field that is populated after
    mount (via reset, a server refill, or a sibling field), since that is exactly the case 0.8.0
    rendered stale.'

sourceRepo: nestled-dev-template
