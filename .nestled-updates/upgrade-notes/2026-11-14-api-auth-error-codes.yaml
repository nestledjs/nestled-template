skipIf:
  - The project's API throws no `UnauthorizedException` (or 401) for anything but a missing,
    invalid or expired session, gives "no organization context" a 403 with its own code, and its
    clients keep the session for every 403.

verification:
  - pnpm exec nx test api-utils --skip-nx-cache
  - pnpm exec nx test api-custom --skip-nx-cache
  - pnpm exec nx test apollo --skip-nx-cache
  - pnpm exec nx test web --skip-nx-cache
  - pnpm exec nx run-many -t typecheck --skip-nx-cache
  - pnpm exec nx build api --skip-nx-cache
  - pnpm exec nx build web --skip-nx-cache
  - pnpm run nestled-doctor

agentHints:
  - >
    Part 1: a project whose GraphQL module already has a `formatError` composes it with
    `formatApiError` (run `formatApiError` first, then the project's own) rather than replacing
    it. Do not try to set the code by passing it to `ForbiddenException` alone: `@nestjs/apollo`
    overwrites it with `FORBIDDEN` unless `formatError` restores it. Keep the error messages: e2e
    specs in the template and downstream match "organization context" in them.
  - >
    Part 1: grep the project's resolvers for its own "no organization" checks (`if
    (!organizationId)`, `req.organizationContext` reads, a project guard) and throw
    `organizationContextRequired()` from each, so clients see one code for one condition.
  - >
    Part 1 and 3: the template answers `ORGANIZATION_CONTEXT_REQUIRED` with its own organization
    picker (list `myOrganizations`, `switchActiveOrganization`, reload; with none, say so and offer
    a normal sign-out). A project that already has an organization picker or onboarding route
    sends the code there instead of adopting `OrganizationRequired` (from the error-link event, the
    root error boundary and the signed-in layout's Me re-check), and keeps the session either way.
  - >
    Part 2: projects add their own `UnauthorizedException`s. Grep the whole API (`grep -rn
    "UnauthorizedException\|AuthenticationError\|HttpStatus.UNAUTHORIZED\|status(401)" apps libs`)
    and give each the template's verdict: a missing, invalid or expired session or token stays a
    401; a permission denial, a business-rule failure, or "you need a different or elevated
    session" becomes `forbiddenWithCode(<SPECIFIC_CODE>, <same message>)`. A known shape is admin
    impersonation / emulation ("requires a current admin session", "not emulating"): the admin's
    own session is fine, so it must be a 403 and must not log the admin out. Login-form failures
    (wrong password, OAuth state mismatch) are not session expiry either: check what the project's
    login form reads (the message, a code, the HTTP status) before changing one, and keep its error
    messages working. List every site with its verdict in the PR.
  - >
    Part 3: check every client of the API (web, mobile, an SDK or MCP client) for logout or
    re-login keyed on `UNAUTHENTICATED`, on HTTP 401, or on message text such as "Unauthorized" or
    "Organization context required", and make sure the moved errors (now 403s with
    `ORGANIZATION_CONTEXT_REQUIRED`, `OAUTH_PROVIDER_REJECTED` or the project's own codes) keep the
    session and reach the user as a message or screen, not a blank page. Report a mobile client
    that needs a change rather than changing it when the app's owner has mobile work in flight.
  - >
    Part 3: a project whose error link already treats every 403 as access denied keeps that, as
    long as `ORGANIZATION_CONTEXT_REQUIRED` is excluded from it and routed to the picker. A project
    that stores the active organization somewhere other than localStorage `activeOrganizationId`
    updates its own store before reloading, or the stale header keeps the refusal.
  - >
    Part 4, for an app that already has part 3: give its organization switch `errorPolicy: 'none'`
    (or check the result's `error` and `errors` before storing anything), so the id is stored and
    the page reloads only after a successful switch. If the app uses its own picker or switcher
    instead of `OrganizationRequired`, fix that one. Then grep the app for the same pattern: a
    `useMutation`, `client.mutate`, `client.query` or `useLazyQuery` call whose failure is handled in
    a `catch` (or `.catch`) while the client default is `errorPolicy: 'all'`; each needs
    `errorPolicy: 'none'` or a result check. Test it with a client carrying the app's real
    `defaultOptions`: a test client without them throws on a GraphQL error and hides the bug.
  - >
    Part 5: apply it where the project's server render decides on a loader's error. A project with
    its own `handleError` adds the record to it rather than replacing it; one that has no
    `handleError` export, or whose `handleRequest` does not read the router context's errors,
    applies 2026-11-14-session-recovery-gaps part 4 first. Keep the rejected response to the code
    alone: never put the API's message or the original error in it, since it is serialized into
    the page. A project with its own organization picker or onboarding route renders that for the
    403 instead. Prove it with a production-mode request (`createRequestHandler(build,
    'production')`, or the built server): in development React Router does not sanitize the error,
    so the bug does not show.
