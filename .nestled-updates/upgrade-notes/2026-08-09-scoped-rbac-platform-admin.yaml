id: 2026-08-09-scoped-rbac-platform-admin
title: Add scoped RBAC and a reusable platform access-control console
priority: high
area: auth
type: security
delivery: hybrid

intent: >
  Add separate platform and organization authorization scopes, code-owned permission catalogs,
  declarative GraphQL/REST policy decorators, purpose-built role-management APIs, and a reusable
  platform-administrator console. Keep generated CRUD and the generic data browser root-only. Ship
  organization/client role management as template-local application UI so each product can adapt
  its organization model without forking the platform console.

why: >
  A single isSuperAdmin flag is too coarse for normal operational delegation, while inline
  hasPermission checks are difficult to inventory and easy to apply to the wrong organization.
  Reusing nullable organization roles for platform access also makes scope ambiguous. Separate
  persistence and declarative metadata let Doctor verify the API contract, while grant ceilings,
  immutable system roles, target privilege checks, auditing, and explicit Prisma queries prevent a
  role manager from escalating through the management surface itself.

affectedPaths:
  - libs/api/prisma/src/lib/schemas/schema.prisma
  - libs/api/prisma/src/lib/seed/**
  - libs/api/utils/src/lib/guards/access-policy*
  - libs/api/utils/src/lib/services/organization-context.service.ts
  - libs/api/custom/src/lib/plugins/access-control/**
  - libs/api/custom/src/lib/plugins/admin/**
  - libs/api/custom/src/lib/plugins/auth/**
  - libs/api/custom/src/lib/default/organization/**
  - apps/api/src/app.module.ts
  - apps/web/app/routes/admin/access-control/**
  - apps/web/app/routes/settings/roles.tsx
  - apps/web/app/routes.tsx
  - libs/shared/sdk/src/graphql/access-control/**
  - libs/shared/sdk/src/graphql/organization/**
  - scripts/doctor-access-policy-analysis.ts
  - scripts/doctor.ts
  - scripts/validate-upgrade-notes.ts
  - .nestled-updates/security/guard-baseline.json
  - docs/security/scoped-rbac.md

packageReleases:
  - name: '@nestledjs/access-control'
    sourcePath: libs/access-control
    targetVersion: 0.0.1
    versionRange: ^0.0.1

skipIf:
  - >
    The project already has separately persisted platform and organization RBAC, declarative
    operation policy metadata, equivalent grant/target ceilings, and reviewed management UIs.
  - >
    The project intentionally has no delegated platform administration; in that case port the
    organization policy and Doctor pieces, keep root-only admin surfaces, and record the adaptation.

verification:
  - pnpm prisma:generate
  - pnpm prisma:seed
  - pnpm template:test-doctor-auth
  - pnpm run nestled-doctor
  - pnpm nx test api-utils
  - pnpm nx test api-custom
  - pnpm nx test access-control
  - pnpm nx build api
  - pnpm nx build access-control
  - pnpm sdk
  - pnpm typecheck
  - pnpm template:validate-upgrade-notes

agentHints:
  - >
    Treat the Prisma change as a real database migration. Add PlatformPermission, PlatformRole,
    PlatformRoleAssignment, and Role.isSystem using the downstream project's migration workflow;
    do not use a production db-push. Mark the new platform tables @skipCrud with the security
    rationale because generic CRUD bypasses their invariants.
  - >
    Keep User.isSuperAdmin during the fleet migration as the tested break-glass path. Seed the
    immutable system.super-administrator role and mirror existing super administrators into it,
    but do not remove or reinterpret the boolean in this upgrade.
  - >
    Adapt the code-owned permission catalogs to real downstream operations. A key should be added
    in the same change as the resolver/controller that consumes it. Administrators may compose
    roles from the catalog but may not create arbitrary permission strings.
  - >
    Migrate operation-level inline checks to RequirePlatformPermission or
    RequireOrganizationPermission. Keep record ownership, target membership, and state-transition
    checks in services; a decorator never proves that a supplied record ID belongs to the declared
    scope. Set organizationIdPath to the actual GraphQL args or REST input path.
  - >
    Port the platform grant ceiling and principal ceiling with the APIs. Delegated user management
    and emulation must reject equal-or-higher effective platform grants, nobody may emulate a root
    administrator, and generated CRUD/data-browser access must remain AdminOnly.
  - >
    Backfill isSystem only for roles the project can identify as its seeded defaults. The template
    requires a default name and an exact match with that default role's permission set; adapt that
    evidence if the downstream has stronger provenance. Leave ambiguous or incomplete roles
    mutable for manual review, and do not mark customer-created roles immutable merely because
    their names resemble Owner, Admin, or Member.
  - >
    Consume the published @nestledjs/access-control package and provide a local adapter for the
    purpose-built API. Its sourcePath is relative to the upstream nestled-dev-template promotion
    source; public-template and downstream checkouts intentionally do not contain libs/access-control.
    Keep the organization/client management route application-local; downstream products are
    expected to change its language and workflows while preserving the API ceilings.
  - >
    Refresh api-schema.graphql through the project's normal API boot path, then run pnpm sdk. Add
    the application-owned access-control documents and route clients together so the SDK contract
    Doctor sees API -> SDK -> client coverage.
  - >
    On first adoption, review Doctor's unknown-key and inline-policy findings rather than
    regenerating a baseline around them. Update the guard baseline only after confirming each
    intentional AdminOnly-to-scoped-policy transition.
