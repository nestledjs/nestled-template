id: 2026-08-10-duplicate-session-cookie-auth
title: Handle duplicate session cookies across API and parent domains
priority: high
area: auth
type: security
delivery: code-patch

intent: >
  Authenticate with the newest session JWT when legacy host-only and current parent-domain cookies
  coexist, and clear both cookie scopes during logout. Keep SSR and direct API authentication
  consistent so a valid login cannot be discarded by the first browser-side protected query.

why: >
  Changing API_COOKIE_DOMAIN does not replace an existing host-only cookie; browsers retain both
  values under the same name. The web Apollo client already chooses the newest JWT, but the API
  previously trusted cookie-parser's single value. A stale invalid session could therefore win on
  browser API requests, produce UNAUTHENTICATED, and force a newly logged-in user back to login.

affectedPaths:
  - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts
  - libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.spec.ts
  - libs/api/custom/src/lib/plugins/auth/auth.service.ts
  - libs/api/custom/src/lib/plugins/auth/auth.service.spec.ts
  - libs/shared/apollo/src/lib/apollo.ts
  - libs/shared/apollo/src/lib/apollo.spec.ts

packageReleases: []

skipIf:
  - >
    The API already parses every same-name session cookie from the raw Cookie header, selects the
    newest JWT (including a deterministic tie-break for same-second logins), and logout clears both
    configured-domain and host-only variants.

verification:
  - pnpm nx test api-custom
  - pnpm nx test apollo
  - pnpm nx build api
  - pnpm template:validate-upgrade-notes

agentHints:
  - >
    Parse the raw Cookie header before req.cookies: cookie-parser collapses duplicate names and loses
    the evidence needed to choose the current JWT. Preserve Authorization-header precedence and the
    opaque API-token path.
  - >
    Choose by JWT iat, falling back to exp, and prefer the later header value on equal timestamps so
    two logins during the same second behave deterministically. Passport must still verify the
    selected JWT; decoding here is selection, not authentication.
  - >
    If a cookie domain is configured, clear once with that domain and once without it. This removes
    legacy API-host-only cookies left behind by a historical cookie-domain configuration.
