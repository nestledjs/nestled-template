packageReleases:
  - name: '@nestledjs/generators'
    targetVersion: 4.0.0
    versionRange: 4.0.0
  - name: '@nestledjs/doctor'
    targetVersion: 0.7.0
    versionRange: 0.7.0
  - name: '@nestledjs/forms'
    targetVersion: 0.9.2
    versionRange: ^0.9.2
  - name: '@nestledjs/forms-core'
    targetVersion: 0.9.2
    versionRange: ^0.9.2
  - name: '@nestledjs/forms-native'
    targetVersion: 0.9.2
    versionRange: ^0.9.2
  - name: '@nestledjs/shared-components'
    sourcePath: libs/shared-components
    targetVersion: 1.0.20
    versionRange: ^1.0.20
  - name: '@nestledjs/access-control'
    sourcePath: libs/access-control
    targetVersion: 0.0.4
    versionRange: ^0.0.4

skipIf:
  - >-
    The project already runs Nx 24, TypeScript 6 and ESLint 10, with every hooks v7 rule and both
    new ESLint 10 rules at error level and `nx run-many -t lint` passing, and every package in
    packageReleases that it declares is already at that release's targetVersion or later.

verification:
  - pnpm exec nx report (nx and every @nx/* package on 24.0.5, typescript 6.0.3)
  - pnpm exec nx show projects --with-target test (the same list as before the upgrade, or longer)
  - pnpm typecheck
  - pnpm exec nx run-many -t lint --skip-nx-cache
  - pnpm exec nx run-many -t test --skip-nx-cache
  - pnpm exec nx run-many -t build --skip-nx-cache
  - test -f apps/web/build/server/index.js (the server bundle exists after the web build)
  - pnpm run nestled-doctor
  - pnpm exec prettier --check .

agentHints:
  - >
    package.json, the lockfile, nx.json and tsconfig.base.json are not mirrored by promotion. The
    migrate writes package.json and nx.json. Make the tsconfig.base.json `lib` change
    (`"es2022.error"`) by hand, and keep the pins the TypeScript 6 migration adds.
  - >
    Apply the lint fixes in your own code by rule and pattern, not by copying the template's files.
    Your components differ. Re-count after the migrate: `pnpm exec eslint apps libs` lists each
    error with its rule.
  - >
    The template's lint fixes in libs/data-browser, libs/access-control and libs/shared-components
    reach projects through those packages' published releases (data-browser 1.0.27 through
    2026-11-10-data-browser-offline-copy, the other two through this note). Bump them; do not copy
    their source.
  - >
    Bump @nestledjs/generators to 4.0.0 in the same change as the Nx migrate, after `nx migrate`
    has written package.json, and check that `pnpm-lock.yaml` no longer resolves any `nx@22` or
    `@nx/*@22` package (`grep -c "@nx/devkit@22" pnpm-lock.yaml` is 0). Then run the project's
    generator-driven steps (its regenerate or sdk script, and the generated-artifacts check) and
    confirm the output does not change.
  - >
    A disable is acceptable only where a fix would change behaviour or the rule is wrong for that
    line. Write the reason after `--`. The template has three, all `set-state-in-effect` and all
    reading browser-only state after hydration (navigator.onLine twice, localStorage once), plus
    one for reading a `<select>` that another component renders.
  - >
    This merge changes package.json and the lockfile, which redeploys every service that watches
    them. A project with a long-running worker confirms it is idle before merging, and says in its
    outcome which services the merge restarts.
  - >
    When a `set-state-in-effect` fix replaces state set at the start of an effect (an
    `isProcessing` or `loading` flag) with a value derived during render, check what the old code
    reset on each run. A derived "failed" flag that never resets is a regression: key it to the
    input it failed for (for example `failedToken === token`) so a new input starts fresh. The
    template's accept-invitation route had exactly this after its first fix.
  - >
    Do not move React Router to 8 here, even if a tool offers it. It belongs to the next release.
