skipIf:
  - The project has no web app.

verification:
  - pnpm sdk
  - pnpm typecheck
  - pnpm exec nx test web --skip-nx-cache
  - pnpm exec nx test apollo --skip-nx-cache
  - pnpm exec nx test web-components --skip-nx-cache
  - pnpm exec nx test api-custom --skip-nx-cache
  - pnpm exec nx build web --skip-nx-cache
  - pnpm run nestled-doctor

agentHints:
  - >
    Apply the parts separately; they share files but not logic. Parts 1, 2 and 5 build on
    2026-11-14-session-recovery-gaps (`DeferredAuthRecovery`, `useSessionRecheck`); parts 3 and 4 on
    2026-11-14-api-auth-error-codes (the picker). An app that marked either of those
    not-applicable marks the matching parts not-applicable too, with the same reason.
  - >
    Part 3 before part 4: the shared switch stores through `storeActiveOrganizationId`, and the
    shell's resolution is what makes a switch show. Read the app's API first: does it read
    `x-organization-id`, and does `User` have `activeOrganizationId`? The part 3 bullets say what to
    do for each answer; record which in the report.
  - >
    Part 3, tests: mocks of `@nestled-template/web` that list exports by hand (no `importOriginal`)
    keep working, since the resolver lives in the shared Apollo library; a spec that mocks the shared
    Apollo library by hand needs `resolveActiveOrganization`, `rememberActiveOrganization` and the
    storage helpers added, or `importOriginal`.
  - >
    Part 2: a spec that counts root loader calls after a re-check sees one more (the revalidation).
  - >
    Part 8 is mechanical but wide. Fix the app's own sites with `errorPolicy: 'none'` per call, add
    a test for at least one (the API answers the mutation with a GraphQL error; the page shows the
    error, not the success state; build the test client with the app's `makeClient` defaults so it
    behaves as in the app), and report the count. Do not change the client default.
