id: 2026-11-16-session-org-consistency
title: >-
  Make the browser's session re-check and organization switching consistent: recover fragment URLs,
  keep a re-checked user live, one active organization for the UI, the header and the server, one
  switch function, a way to silence the error link, cancellation through timeout wrappers, specs
  that do not assume an HTTP-401 logout, mutations that throw on a refusal, a GraphQL 503 that
  counts as an outage, and an active organization that hydrates as the server rendered it
priority: high
area: web
type: correctness
delivery: code-patch
applyAfter:
  [2026-11-14-session-recovery-gaps, 2026-11-14-api-auth-error-codes, 2026-11-16-ssr-signout-outage]

intent: >
  Follow-up to 2026-11-14-session-recovery-gaps (the root error boundary's `DeferredAuthRecovery`
  and the signed-in layout's `useSessionRecheck`) and 2026-11-14-api-auth-error-codes (the
  organization picker). Apply those first. The session rule is unchanged: log a user out only when
  the API has definitely rejected the session (a real HTTP 401, or a GraphQL error whose
  `extensions.code` is `UNAUTHENTICATED`) with no outage evidence; outage evidence outranks a 401;
  message text never decides; anything else keeps the session. Ten parts. No package changes and
  no change to package.json, nx.json or tsconfig.base.json. The Me fragment gains a field, so the
  SDK is regenerated (`pnpm sdk`).


  Behaviour changes, plainly: (a) a deferred 401 on a URL with a `#fragment` now recovers by itself
  like any other URL (part 1); (b) after the layout's re-check signs a user back in, the root loader
  runs once more, so the shell's user follows later edits (part 2); (c) the shell, the settings pages
  and the next request now agree on one active organization, which is the server's active one when
  the user is still a member of it, not the first in the list; the browser stores it for
  `x-organization-id` as soon as the shell renders, and forgets it on logout (part 3); (d) the
  picker, `AuthProvider` and any header switcher switch through one function that throws on a
  refusal (part 4); (e) about fifty mutations in the template that used to report success when the
  API refused them now show their error (part 8); (f) a GraphQL error carrying a 502/503/504 (the
  API's answer when it cannot complete a lookup) is outage evidence: it is reported, refetched on
  recovery, and outranks a 401, in the browser and in the server render (part 9); (g) when the
  server does not know the user's active organization, the shell first renders the server's choice
  (the first organization) with its content held back, and restores the browser's stored choice
  after hydration through the shared switch, instead of rendering the stored one straight away
  (part 10; this replaces part 3's "else the stored one" step). Nothing logs out more often than
  before.


  1. Deferred-auth recovery on a URL with a fragment (issue 113 on nestled-dev-template).
  apps/web/app/deferred-auth-recovery.tsx revalidates the route with a navigation to the same
  pathname, search and hash. With a non-empty hash React Router takes that for a hash-only change
  and runs no loader, so the failed query never got a fresh answer and the recovering screen stayed
  up after the API came back. When the location has a hash it now calls `router.revalidate()` first
  and navigates to the same URL once that settles (the navigation is still what resets the error
  boundary), but only if the location key is unchanged and no navigation is in progress, so a user
  who left meanwhile, or a loader's redirect, is not taken back; without a hash nothing changes. An app that revalidates with `useRevalidator()` instead
  has no such gap, but check that its error boundary resets after a revalidation that finishes
  quickly.
  Verification: `pnpm exec nx test web --skip-nx-cache` ("recovers a URL with a #fragment too").


  2. The re-checked user is a snapshot. `useSessionRecheck` asks Me with `fetchPolicy: 'no-cache'`
  (it must get a fresh answer), so the user it returns never updates: after a recovery the shell
  kept showing it, and a profile edit or an organization switch did not show until a full load.
  apps/web/app/routes/_authenticated/_layout.tsx now, once the re-check recovers with a user and the
  context still has none, calls `useRevalidator().revalidate()` once (guarded per recovered user, so
  a root loader that still brings no Me cannot loop). The root loader preloads Me again, App reads it
  from the cache, and the layout takes the user from the context from then on. Keep rendering the
  re-checked user meanwhile.
  - An app that resolves Me in the root loader with `makeClient().query` (no query ref): revalidating
    still brings a fresh user; if the shell keeps the user in its own state, set it from the new
    loader data.
  - An app with no signed-in layout (the re-check lives in a `requireUser`/`useSession` helper or a
    `SessionProvider`): do the revalidation where the re-checked user is handed out, once per
    recovery.
  - An app whose Me lives in a store (jotai, a React context with `setUser`): write the re-checked
    user into that store instead of revalidating, and make sure the store follows cache updates.
  Verification: `pnpm exec nx test web --skip-nx-cache` ("after recovering, takes the user from a
  live Me query, so later changes show", "revalidates the root loader once per recovery").


  3. One active organization for the UI, the stored header, the server and the request. Four gaps:
  the `AuthUserDetails` fragment (the Me query) had no `activeOrganizationId`, so every place that
  looked it up found nothing and showed `organizations[0]`; a shell restored by the re-check therefore
  showed the first organization while requests went to the stored one; nothing stored the active
  organization the re-check learned; and the shell never stored what it showed.
  - libs/shared/sdk/src/graphql/auth/auth-fragments.graphql: `activeOrganizationId` added to
    `AuthUserDetails`; regenerate the SDK (`pnpm sdk`). The `UserWithActiveOrganization` casts in
    the layout and settings pages go away.
  - libs/shared/apollo/src/lib/apollo.ts exports `ACTIVE_ORGANIZATION_STORAGE_KEY`,
    `getStoredActiveOrganizationId()` and `storeActiveOrganizationId(id | null)` (the auth link
    reads the header through them; both are no-ops on the server and with storage blocked), and
    `resolveActiveOrganization(organizations, serverActiveOrganizationId, stored?)`: the server's
    active organization if the user is still a member, else the stored one if still a member, else
    the first, else null. `rememberActiveOrganization(id)` stores it when it differs.
  - apps/web/app/routes/_authenticated/_layout.tsx resolves with `user.activeOrganizationId` (from
    the context or the re-check, so the re-check's answer is stored too) and calls
    `rememberActiveOrganization` while rendering, before its children's queries start: the
    organization on screen is the one the next request is sent for. A layout effect is too late
    for queries that start during render.
  - apps/web/app/routes/settings/_settings-access.ts, settings/organization.tsx,
    settings/members.tsx (which managed the first organization's members, invitations and roles)
    and settings/roles.tsx use `resolveActiveOrganization` instead of their own `organizations[0]`
    fallbacks; `AuthProvider` (libs/web/src/lib/contexts/auth.context.tsx) does too, and stores
    through `rememberActiveOrganization` / `storeActiveOrganizationId(null)` on logout.
  - apps/web/app/routes/logout.tsx forgets the stored organization, so the next user's first
    requests are not sent for it.
  - API: libs/api/custom/src/lib/default/organization/organization.service.ts
    `switchActiveOrganization` already wrote the new active organization to the auth cache
    (`setUserActiveOrganization`); it now also drops the cached user (`invalidateUser`), which would
    still carry the old `activeOrganizationId`. A refused switch touches neither.
  For each app shape:
  - No `User.activeOrganizationId` on the API (the organization is chosen by the browser alone and
    sent as the header): call `resolveActiveOrganization(organizations, null)`, so the stored choice
    wins over the first; keep `rememberActiveOrganization` in the shell. Do not add the field to the
    fragment.
  - No `x-organization-id` header (the API uses the user's active organization only): skip the
    storage calls; the shell resolves with the user's `activeOrganizationId`, which is then what
    every request is answered for. The fragment change still matters.
  - Several shells or layouts showing an organization: each uses `resolveActiveOrganization`; only
    the outermost signed-in one needs `rememberActiveOrganization`.
  - An app with a Redis user cache of its own: invalidate it on a switch, as the API part does.
  - No signed-in layout: do the resolve-and-remember wherever the signed-in user and their
    organizations are first known (a session helper, the root loader's consumer).
  Verification: `pnpm exec nx test web --skip-nx-cache` (apps/web/tests/routes/active-organization.spec.tsx:
  after a recovery, with nothing stored, with no server organization, and after a picker choice and
  the reload, the organization shown and the next request's `x-organization-id` are the same and
  are not the first); `pnpm exec nx test apollo --skip-nx-cache` ("the stored active
  organization"); `pnpm exec nx test api-custom --skip-nx-cache` ("updates the auth cache").


  4. One way to switch. New libs/web/src/lib/organization/switch-active-organization.ts exports
  `useSwitchActiveOrganization()`: a function that runs `switchActiveOrganization` with
  `errorPolicy: 'none'` (so a refusal throws, whatever the client's default), then stores the id now
  active for the header, and resolves with it. The caller reloads. The organization picker
  (apps/web/app/organization-required.tsx, which assumed a bare localStorage id) and `AuthProvider`
  call it; `OrganizationSwitcher` (libs/web-ui) documents that its `onSwitchOrganization` should be
  it, and reloads only after it resolves.
  - An app with a header switcher or a switch mutation of its own: make that the shared function
    (mutation with `errorPolicy: 'none'`, then store, then return) and route the picker through it,
    rather than adding a second switch.
  - An app with no switch mutation (the choice is the browser's): keep a store-and-reload function,
    `(id) => { storeActiveOrganizationId(id); location.reload() }`, in one shared module, and have the
    picker and every switcher call it.
  Verification: `pnpm exec nx test web-components --skip-nx-cache` ("useSwitchActiveOrganization",
  "switches through the one shared switch"); `pnpm exec nx test web --skip-nx-cache`
  (organization-required, active-organization).


  5. A way to silence the error link for a request whose caller decides. libs/shared/apollo exports
  `SKIP_AUTH_ERROR_REPORT_CONTEXT` (`{ skipAuthErrorReport: true }`). A request that passes it as
  `context` gets no action from the error link for a 401, an UNAUTHENTICATED, a 403 or
  ORGANIZATION_CONTEXT_REQUIRED (no logout, no deferred 401, no access-forbidden or
  organization-required event); it still logs, and a request that never reached the API is still
  reported as a connectivity failure. `useSessionRecheck` passes it: the re-check judges its answer
  itself (a 401 during an outage is retried there, a real one goes to /force-logout).
  - An app whose error link only dispatches an event (an access-denied screen, say): this is the part
    that matters. Without it the re-check's own 401 or 403 reached that event's handler and took the
    screen before the re-check could decide. Check `operation.getContext().skipAuthErrorReport` in
    that link and return before dispatching.
  - An app with its own error link: honour the same context key, and export the constant from the
    shared Apollo library rather than a local copy.
  Verification: `pnpm exec nx test apollo --skip-nx-cache` ("SKIP_AUTH_ERROR_REPORT_CONTEXT");
  `pnpm exec nx test web --skip-nx-cache` ("asks the error link to take no action on the re-check").


  6. Cancellation through fetch-timeout wrappers. 2026-11-14-session-recovery-gaps part 6 covered
  hand-written links but not a `fetch` wrapper that adds a timeout. A downstream project had a real
  bug there: its `fetchWithTimeout` built its own `AbortController` and passed that signal to `fetch`
  in place of the one Apollo passes in `init.signal`, so cancelling a request did not abort it; the
  request ran on until the timeout, which was then reported as a connectivity failure and held
  outage evidence (deferring real 401s meanwhile). The template's link chain has no such wrapper, so
  there is no code change here. In an app that has one:
  - Combine the caller's signal with the timeout, never replace it: abort your controller when
    `init.signal` aborts (and at once if it already has), or use `AbortSignal.any([init.signal,
    AbortSignal.timeout(ms)])` where available.
  - Keep the abort connected until the body has been read, not only until `fetch` resolves: Apollo
    reads the body after the headers arrive, and a cancel then must still abort it.
  - A cancellation by the caller must surface as an `AbortError` (no outage); only the timeout
    itself is a connectivity failure. Clear the timer and the listener when the request settles.
  - Test it: cancel an in-flight request through the link chain and assert the fetch was aborted
    and `isApiOutageSignalled()` is false afterwards.


  7. Specs no longer assume an error link that logs out on an HTTP 401. Several apps sign out only on
  UNAUTHENTICATED, never on an HTTP 401, so a template spec whose logout came from the link's HTTP-401
  branch failed there. New apps/web/tests/helpers/api-rejection.ts has `UNAUTHENTICATED_RESULT` and
  `unauthenticatedResponse()` (the API's own answer to a rejected session: HTTP 200, code
  UNAUTHENTICATED, `originalError.statusCode` 401) and `httpError(status)` (a `ServerError` built
  from a real `Response`). The recovery spec's logout now uses the API's answer, and the
  authenticated-layout spec runs each logout case for both the API's answer and a real HTTP 401.
  An app whose layout or boundary does not sign out on an HTTP 401 drops the `'an HTTP 401'` rows;
  the UNAUTHENTICATED rows must pass unchanged.


  8. Mutations that throw on a refusal. `makeClient` sets `defaultOptions.mutate.errorPolicy` to
  `'all'`. Under it Apollo Client 4 resolves `mutate()` with `{ data, error }` for every error, a
  GraphQL refusal, an HTTP error or no response alike (core/QueryManager.js `mutate()`); only
  `'none'` rejects. A call site whose only error handling is `try { await mutate() } catch` therefore
  never sees the error and runs its success path ("Saved", a redirect, a closed modal) on a refusal
  or an outage. The default is unchanged (a fleet-wide behaviour change is the owner's call); the
  template's own call sites that relied on a throw now pass `errorPolicy: 'none'` (53 hook and
  `client.mutate` calls across the public auth pages, accept-invitation, pricing, the admin billing
  and access-control pages, every settings page, and libs/web's upgrade and transfer-ownership
  modals). Sites that read `result.error`, or use `onError`/`onCompleted`, are left as they are.
  How to find them in an app:
  - List every mutation call without an `errorPolicy` of its own:
    `grep -rnE --include='*.ts' --include='*.tsx' --exclude='*.spec.*' --exclude-dir=generated
    --exclude-dir=__admin --exclude-dir=node_modules 'useMutation|\.mutate\(' apps libs`, then drop
    those whose call (often several lines) passes `errorPolicy`.
  - For each, find where its executor is awaited. Fix it (`errorPolicy: 'none'` on the hook or the
    call) if the result's `error` is not read and a `try/catch` or `.catch` is the error handling,
    including a catch in a caller (a shared `run(fn)` helper). Leave it if it reads `result.error`,
    has `onError`, or ignores failure on purpose (logout).
  - Do not add `'none'` to code that reads `result.error`: under `'none'` it rejects instead and that
    branch never runs. Packages with their own handling (@nestledjs/data-browser reads
    `result.error`) need nothing.
  Verification: `pnpm exec nx test web --skip-nx-cache` (members.error-policy,
  TransferOwnershipModal.error-policy: a refusal shows its error, not the success message).

  9. A GraphQL 502/503/504 is outage evidence. The API throws a `ServiceUnavailableException`
  when a lookup it needs fails (JwtStrategy's API-token lookup). Over GraphQL that arrives as HTTP
  200 with `extensions.code: 'INTERNAL_SERVER_ERROR'` and `extensions.status: 503` (libs/api/utils
  `formatApiError` keeps it so; `originalError.statusCode` is 503 too). The shared classifier called
  it `other`, so the error link reported no outage, the query was never refetched on recovery, and
  in the server render a concurrent 401 could still sign the user out.
  libs/shared/apollo/src/lib/apollo.ts now:
  - exports `isGatewayUnavailableGraphQLError(error)`: a `CombinedGraphQLErrors` with an error whose
    `extensions.status`, else `extensions.originalError.statusCode`, is 502, 503 or 504. A plain
    `INTERNAL_SERVER_ERROR` (500, or no status) is not.
  - `isRetryableConnectivityError` is true for it, so `refetchFailedQueries` refetches the query
    once the API answers, and the Me boundary waits for recovery instead of signing out.
  - `classifyApiFailure` returns `unavailable` for it, checked before UNAUTHENTICATED: a 503 and an
    UNAUTHENTICATED in the same answer is an outage. Through the classifier, the server render's
    recorded cause (`apolloLoader`'s `onApiFailure`), `shellErrorOutcome` and `routeErrorOutcome`
    treat it as outage evidence, so a GraphQL 503 beside a concurrent 401 serves the recovering 503
    with the cookie kept.
  - the error link dispatches `APOLLO_SERVICE_UNAVAILABLE_EVENT` for it (also for a request passing
    `SKIP_AUTH_ERROR_REPORT_CONTEXT`, as for a network outage), and an UNAUTHENTICATED in the same
    answer is let pass as during any outage (`takeDeferredAuthFailure` is set; no logout).
  - `createOutageRetryLink` counts an answer carrying such an error as unreachable, so its retry is
    outage evidence while in flight, as after a proxy's 503.
  For each app shape:
  - An app with its own error link, classifier or `isRetryableConnectivityError` copy: make the
    same change there, and keep the classifier and the connectivity test sharing one status check.
    Look for an early `if (CombinedGraphQLErrors.is(error)) return false` (or `'other'`) before any
    status check: that is the line that hid the 503.
  - An app whose root loader resolves Me with `makeClient().query` and decides there: a Me failure
    for which `classifyApiFailure` is `unavailable` (or `isRetryableConnectivityError` is true) must
    return the loader's `serviceUnavailable` flag, never render signed out or redirect.
  - An app whose error link only dispatches events: dispatch the service-unavailable event for it,
    and no logout event for an UNAUTHENTICATED in the same answer.
  - An app whose API never throws a 5xx `HttpException` (API tokens validated only in an MCP
    controller, say): apply it anyway. It is a client-side classifier change at no cost, and covers
    any resolver that throws a `ServiceUnavailableException` later.
  Verification: `pnpm exec nx test apollo --skip-nx-cache` ("a GraphQL 503", "counts the retry of a
  query answered with a GraphQL 503", "records a GraphQL 503 beside a concurrent 401");
  `pnpm exec nx test web --skip-nx-cache` (entry-server-shell-error "a GraphQL 503 is outage
  evidence"; api-availability "refetches a query the API answered with a GraphQL 503").


  10. The active organization hydrates as the server rendered it. Part 3's resolver fell back to
  the browser's stored organization while rendering. A server render cannot see storage, so when
  `Me.activeOrganizationId` was null or no longer one of the user's organizations and the browser
  had stored a non-first one, the server picked the first and the hydrating render the stored one:
  the layout's organization name and permissions differed from the server HTML (a hydration
  mismatch), and the page's first queries went out for an organization the server HTML did not
  show.
  - libs/shared/apollo: `resolveActiveOrganization(organizations, serverActiveOrganizationId,
    chosen = null)` no longer reads storage by default: the server's active one if still a member,
    else `chosen` if still a member, else the first. New
    `isActiveOrganizationAmbiguous(organizations, serverActiveOrganizationId)`: more than one
    organization and no valid server active one, the only case in which the stored choice can
    differ from what the server renders.
  - New libs/web/src/lib/organization/active-organization.ts, `useActiveOrganization(organizations,
    serverActiveOrganizationId, { enabled, sessionKey, afterSwitch, switchOrganization })`, returning
    `{ activeOrganization, reconciling }`. The first render, on the server and in the browser, shows
    the server's choice; when the choice is ambiguous `reconciling` is true from the first render
    (on both sides, so they agree) and the caller holds organization-scoped content back. After
    hydration it reads the stored organization: if it is another of the user's organizations it
    switches to it through the shared switch (`useSwitchActiveOrganization`, so the server's active
    organization, the cache and the header agree), runs `afterSwitch`, and only then clears
    `reconciling`; otherwise the server's choice stands. A refused or failed switch keeps the
    server's choice and stores it, so the screen and the header still agree. It stores what it
    shows for `x-organization-id` while rendering (`rememberActiveOrganization`), except while
    reconciling. It starts over when `sessionKey` (the user's id) changes or `enabled` turns false,
    and drops a restore still in flight for the previous session, so a provider that stays mounted
    across logout and login never carries one session's choice into the next.
  - apps/web/app/routes/_authenticated/_layout.tsx uses it, before its early returns, with
    `enabled: !!user`, `sessionKey: user?.id` and `afterSwitch: () => revalidator.revalidate()`, so the loaders run again
    for the restored organization. While `reconciling` it renders the header (the server's choice),
    a placeholder instead of `<Outlet />`, and neither `SubscriptionProvider` nor
    `SubscriptionStatusBanner` (their queries are organization-scoped).
  - `AuthProvider` uses it too (`afterSwitch` refetches active queries; `isLoading` includes
    `reconciling`) and no longer stores in an effect.
  - No cookie is added: the server keeps rendering from Me alone.
  For each app shape:
  - No `User.activeOrganizationId` on the API (the browser alone chooses; part 3 told you to call
    `resolveActiveOrganization(organizations, null)` so the stored choice won): that call now gives
    the first. Use `useActiveOrganization(organizations, null, { switchOrganization: async id => {
    storeActiveOrganizationId(id); return id }, afterSwitch })`, with an `afterSwitch` that
    revalidates or refetches; never reload there. A server render of a user with several
    organizations then always shows the content area pending until hydration; that is expected for
    this shape.
  - No `x-organization-id` header: nothing is stored, so there is nothing to restore. Keep
    `resolveActiveOrganization(organizations, user.activeOrganizationId)`; only the signature change
    applies (drop any third argument).
  - A render that passes the stored id explicitly (`resolveActiveOrganization(orgs, id,
    getStoredActiveOrganizationId())`): that is the mismatch. Use the hook in the shell instead, and
    keep inner pages on two arguments (they render after the shell settled, and read the server's
    active organization, which the switch updated).
  - Several shells: only the outermost signed-in one uses the hook and gates; inner ones keep
    `resolveActiveOrganization` with two arguments.
  - No signed-in layout: call the hook wherever the signed-in user and their organizations are
    first known, and gate the organization-scoped part of the tree on `reconciling` there.
  - A shell rendered only in the browser (no SSR for it): apply it anyway; it also stops the first
    queries going out for the first organization before the stored one is restored.
  Verification: `pnpm exec nx test web --skip-nx-cache`
  (apps/web/tests/routes/active-organization.spec.tsx "the active organization across a server
  render and hydration": no hydration error and a first client render equal to the server HTML,
  then the UI and the next request use the stored organization; a refused switch keeps the
  server's choice); `pnpm exec nx test web-components --skip-nx-cache` ("restores a stored
  organization the server does not know", "starts over after logout"); `pnpm exec nx test apollo --skip-nx-cache` ("is never
  read by resolveActiveOrganization").

why: >
  The 2026.11.7 fleet rollout found these: a recovery gap on fragment URLs (issue 113), a re-checked
  user that never updated, a shell that showed the first organization while its requests went to
  the stored one, a picker that assumed a bare localStorage id beside an existing switcher, an
  event-only error link that put up access denied over the re-check, a timeout wrapper that turned a
  cancelled request into outage evidence, template specs that assumed an HTTP-401 logout, and 35 to
  175 mutation call sites per app whose try/catch never saw an error. Review of the template
  promotion found two more: a GraphQL 503 the shared classifier did not count as an outage (part 9),
  and a hydration mismatch in part 3's resolver when the browser stored a non-first organization the
  server did not know (part 10).

