id: 2026-08-05-credential-fields-graphql-exposure
title: Remove credential fields from the GraphQL schema with @graphqlOmit
priority: critical
area: auth
type: security
delivery: code-patch

intent: >
  Nine fields carrying credential material were queryable through GraphQL, and the template's own
  SDK fragments selected them — including a non-admin user fragment that pulled password hashes to
  the frontend. Annotate each with `@graphqlOmit` in the Prisma schema and remove the now-dead
  selections from the SDK operation files.

  On User, that is `password`, `passwordResetToken`, `passwordResetExpires`, `validateEmailToken`,
  `validateEmailTokenExpires`, `twoFactorSecret`, and `twoFactorRecoveryCodes`. On ApiToken it is
  `tokenHash`. On Email it is `verifyToken`. Treat that list as the template's set, not as a
  complete answer for any given project.

  Both the models generator and the CRUD generator already honour `@graphqlOmit`, so the annotation
  removes each field from the ObjectType, from the generated Create, Update and List inputs, and
  from `DATABASE_MODELS`. Those are three distinct exposures. Removal from the List input matters on
  its own, because the fields were filterable and a filterable credential column is a brute-force
  oracle even when reads are blocked. Removal from `DATABASE_MODELS` stops the nested-select builder
  reaching them through a relation.

  `@graphqlOmit` affects the GraphQL layer only. Prisma row types keep every column, so password
  reset, email verification, and 2FA continue to work unchanged.

why: >
  A readable password hash is an offline cracking problem. A readable `passwordResetToken` or
  `validateEmailToken` is worse — it is directly usable for account takeover with no cracking step.
  Worst of all are `twoFactorSecret` and `twoFactorRecoveryCodes`, which together are a complete
  2FA bypass for any account whose row can be read.

  These were reachable by anyone who could read the row, and filterable by anyone who could reach
  any list query on the model. Because the fields also sat on the generated List input, an attacker
  did not need read access at all.

affectedPaths:
  - libs/api/prisma/src/lib/schemas/schema.prisma
  - libs/api/custom/src/lib/plugins/auth/auth.service.ts
  - libs/api/custom/src/lib/plugins/api-tokens/api-tokens.service.spec.ts
  - libs/shared/sdk/src/graphql/user/user-fragments.graphql
  - libs/shared/sdk/src/graphql/email/email-fragments.graphql
  - libs/shared/sdk/src/graphql/admin/admin-mutations.graphql

skipIf:
  - The project has already annotated every credential column with @graphqlOmit and verified the
    emitted schema no longer exposes them.

verification:
  - pnpm db-update
  - pnpm sdk
  - pnpm nx build api
  - pnpm nx test api-custom

agentHints:
  - Audit the project's own schema rather than copying the template's field list. Search for columns
    holding secrets, hashes, or tokens of any kind, including provider credentials and invite
    tokens. Any column a project added itself will not be in the template's list.
  - The emitted schema does not refresh until the API restarts. It is written by NestJS at bootstrap
    from autoSchemaFile, not by the generators, so db-update alone leaves the old file in place and
    makes it look like nothing changed. Restart the API, then confirm by introspecting the running
    server rather than trusting the file on disk.
  - Public SDK operations are generated once and then preserved so hand edits survive, while the
    admin SDK directory is deleted and rebuilt on every run. So existing public operations keep
    selecting fields that no longer exist, and codegen fails. Remove those selections by hand. The
    admin directory needs no manual step. This write-once behaviour is also why the stale selections
    existed in the first place.
  - The codegen failure names an unknown field on a fragment and says nothing about credentials or
    security, so it reads like the upgrade broke the build. Expect it, and fix it by deleting the
    selection rather than by reverting the annotation.
  - Server-side code that reads a credential must use the Prisma row type, not the GraphQL
    ObjectType. Where a service annotated a database row with the generated ObjectType, the build
    will now fail on the missing property. Import the Prisma type instead. That is the correct fix,
    not restoring the field.
  - Check whether any admin mutation returns credential material in its response selection. An admin
    forcing a password reset does not need the token back, and returning it puts the value on the
    wire for no reason.
  - This does not close the filter oracle. Omitted columns still exist in Prisma and remain
    filterable through the untyped filters input, so these fields stay extractable until that
    separate fix lands. Do not treat this note as closing that hole.
