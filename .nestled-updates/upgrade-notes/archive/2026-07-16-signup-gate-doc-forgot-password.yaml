id: 2026-07-16-signup-gate-doc-forgot-password
title: Docs — note forgotPassword in the signup abuse gate comments
priority: ignore
area: auth
type: docs
delivery: code-patch

intent: >
  Comment/doc-only correction to the signup-abuse-gate change (2026-07-15). The
  ThrottlerModule inline comment in auth.module.ts and the SIGNUP ABUSE PROTECTION section
  of .env.example listed only register + resendVerificationEmail as the gated/abuse surface,
  but forgotPassword is also gated (captcha + per-IP rate limit). The .env.example wording is
  further qualified so it stays accurate: forgotPassword only sends mail when the address
  matches a user (neutral response otherwise, for enumeration protection), so it does not
  "send email on every call". No runtime behavior changes.

why: >
  The signup-abuse-gate note (2026-07-15) already carries the behavioral upgrade; this is a
  docs-only follow-up so the inline comments and env documentation match what the guard
  actually covers. Carries priority: ignore because there is nothing for downstream projects
  to apply — the behavior was already delivered by the earlier note.

affectedPaths:
  - libs/api/custom/src/lib/plugins/auth/auth.module.ts
  - .env.example

skipIf:
  - Always skip. Documentation-only correction with no downstream code impact; the behavior it
    describes shipped with 2026-07-15-signup-abuse-gate-turnstile-throttle-email-hygiene.

agentHints:
  - Do NOT propagate. This note exists only to satisfy the upgrade-note impact gate for a
    comment-only edit to a sensitive auth file; there is no behavioral change to adapt.

sourceRepo: nestled-dev-template
