skipIf:
  - The downstream project already rate limits and captcha-gates both register and resendVerificationEmail before sending mail.

verification:
  - grep -n "assertSignupAllowed" libs/api/custom/src/lib/plugins/auth/auth.service.ts
  - grep -n "GqlThrottlerGuard" libs/api/custom/src/lib/plugins/auth/auth.resolver.ts
  - grep -n "trust proxy" apps/api/src/main.ts
  - pnpm nx test api-custom
  - pnpm nx test api-utils
  - pnpm nx test web

agentHints:
  - Requires two new dependencies -- `pnpm add @nestjs/throttler disposable-email-domains`. The latter ships no types; the ambient declaration in libs/api/custom/src/types/disposable-email-domains.d.ts is required, not optional.
  - TRUST_PROXY_HOPS is a SECURITY setting and its correct value depends on the child project's deployment topology. Do NOT default it to 1 to "make it work". Too low behind a load balancer means all users share one rate-limit bucket and throttle each other; too high lets clients forge X-Forwarded-For and bypass the limit entirely. Railway/Heroku/Fly = 1, local dev = 0. main.ts warns at boot when it is 0 in production.
  - The throttler and captcha must be applied at BOTH register and resendVerificationEmail. Gating only register leaves the mail-bombing primitive wide open, which is the more dangerous of the two.
  - GqlThrottlerGuard MUST track by `req.ip`, never by the X-Forwarded-For header directly. The header is attacker-controlled, so keying off it yields a fresh bucket per forged value and makes the limit decorative. If the child project has its own throttler guard, check this property specifically.
  - Turnstile and the MX lookup both fail OPEN on transport/resolver errors, by design — a Cloudflare or DNS outage degrades to the remaining controls instead of taking registration down. They fail CLOSED on an actual negative verdict. Preserve that asymmetry.
  - 'The API bundle grows by roughly 2MB: the disposable-domain list is ~121k entries loaded into a Set at startup. This is expected, not a bundling mistake.'
  - '`RegisterInput.captchaToken` is nullable and `resendVerificationEmail(captchaToken:)` is a nullable arg, so both are additive schema changes. Regenerating the SDK requires booting the API once (api-schema.graphql is code-first, emitted at bootstrap) — do not hand-edit that file.'
  - A Turnstile token is single-use. Any custom signup form must reset the widget after a failed attempt (the template remounts it via a React key), or the retry fails the captcha instead of surfacing the real error.
  - This note does NOT gate access on emailValidated, and does not fix the Email.verified bug in verifyEmail or the user-enumeration messages in register/resendVerificationEmail. Those ship separately.
