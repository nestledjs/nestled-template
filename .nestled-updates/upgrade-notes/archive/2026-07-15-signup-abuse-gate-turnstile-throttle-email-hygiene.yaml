id: 2026-07-15-signup-abuse-gate-turnstile-throttle-email-hygiene
title: Gate the signup surface — Turnstile, per-IP rate limit, and email hygiene before any mail is sent
priority: high
area: auth
type: security
delivery: code-patch

intent: >
  Put an abuse gate in front of the two unauthenticated mutations that send email — `register` and
  `resendVerificationEmail` — so neither can be used to burn the project's sender reputation.
  Four parts, all additive and all running BEFORE the mailer is touched.
  (1) Cloudflare Turnstile: new `TurnstileService` verifies a `captchaToken` against siteverify.
  Optional in the Stripe sense — with no `TURNSTILE_SECRET_KEY` the service is disabled and a
  missing token is accepted, so existing deployments keep working until they opt in. `captchaToken`
  is a new nullable field on `RegisterInput` and a new nullable arg on `resendVerificationEmail`.
  (2) `@nestjs/throttler` + a new `GqlThrottlerGuard` (in api/utils), applied to those two
  mutations only. Defaults to 3 requests/hour/IP; auto-disabled under `NODE_ENV=test`.
  (3) New `EmailHygieneService`: rejects disposable domains (via the `disposable-email-domains`
  list) and, in production, domains publishing neither an MX nor an A record.
  (4) New `TRUST_PROXY_HOPS` config, wired to Express `trust proxy` in main.ts. The rate limit keys
  on `req.ip`, which is only correct when Express knows how many proxy hops to trust.
  `RegisterInput` also gains validation on fields that previously had NONE at all: `@IsString` +
  length caps on username, firstName, lastName, phone and organizationName, and `@IsUrl` +
  a length cap on avatarUrl.

why: >
  `register` was an open, unthrottled endpoint that sent an email on every call and returned a live
  session immediately. Nothing stood between a bot and the project's SMTP sender reputation: no
  captcha, no rate limit, no disposable-domain blocklist, no MX check — email validation was a
  single `@IsEmail()` format check. A template project was actively spammed through this path.
  `resendVerificationEmail` was worse: unauthenticated, unguarded, and it mails an arbitrary
  attacker-supplied address, making it a mail-bombing primitive aimed at any known address.
  Every check here runs before the send, because the send IS the abuse — a gate placed after it
  (including any "verify before creating the user" scheme) protects nothing.

