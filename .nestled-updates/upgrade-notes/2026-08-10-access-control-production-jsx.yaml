id: 2026-08-10-access-control-production-jsx
title: Use the production JSX runtime in access-control
priority: high
area: web
type: correctness
delivery: package-release

intent: >
  Upgrade @nestledjs/access-control to 0.0.2 or newer so its published bundle uses React's
  production JSX runtime. Treat 0.0.1 as unusable in production.

why: >
  The 0.0.1 package was built with jsxDEV calls. Production React does not export that helper, so
  rendering PlatformAccessControl crashes with "jsxDEV is not a function" even though its API
  request and authorization succeeded. The corrected package forces production mode and rejects
  any future build that contains the development JSX helper.

packageReleases:
  - name: '@nestledjs/access-control'
    sourcePath: libs/access-control
    targetVersion: 0.0.2
    versionRange: ^0.0.2

skipIf:
  - The downstream project does not use @nestledjs/access-control.
  - The downstream project already uses @nestledjs/access-control 0.0.2 or newer.

verification:
  - pnpm install
  - pnpm nx build web --skip-nx-cache
  - Open the production build's platform access-control route and verify that it renders.

agentHints:
  - Do not diagnose the 0.0.1 render crash as an authentication or RBAC failure; the API may have completed successfully before React throws.
  - Do not copy libs/access-control source into a downstream project. Consume the corrected published package.
