id: 2026-07-20-e2e-signup-gate-disable-and-forgotpassword-contract
title: E2E — disable signup gate in the harness and fix the forgotPassword neutral-response contract test
priority: ignore
area: auth
type: correctness
delivery: code-patch

intent: >
  Two api-e2e harness/test corrections for the 2026-07-15 signup abuse gate + auth-enumeration batch.
  (1) apps/api-e2e/src/support/global-setup.ts now sets the RUNTIME keys SIGNUP_THROTTLE_ENABLED=false
  and SIGNUP_REQUIRE_MX=false before starting the API. The gate keys off NODE_ENV to turn its throttle
  off under test, but a production webpack build inlines process.env.NODE_ENV to "production", so a
  clone that serves the built dist (rather than `nx serve`) never sees NODE_ENV=test and the 3/hour
  throttle then fails every spec that registers >3 users. These keys are read at runtime, not inlined.
  (2) apps/api-e2e/src/auth/auth.spec.ts "should handle password reset for non-existing email
  gracefully" now asserts forgotPassword RESOLVES true (the neutral anti-enumeration response) instead
  of rejecting — the previous assertion predated the enumeration hardening and its own comment already
  described the neutral behavior.

why: >
  The template's own CI serves the API via `nx serve` and never hit the inlined-NODE_ENV throttle
  problem, so it went unnoticed until a downstream repo (cashcast) that serves the production dist ran
  api-e2e and 12/22 auth specs failed with "Too many attempts from this address". Making the harness
  set the runtime keys fixes it for every serving mode. The contract test simply encodes the intended
  #38 behavior.

affectedPaths:
  - apps/api-e2e/src/support/global-setup.ts
  - apps/api-e2e/src/auth/auth.spec.ts

skipIf:
  - Always skip. E2E harness/test correction with no product-code impact. Downstream repos with a
    diverged global-setup.ts apply the same two runtime keys locally during the signup-gate upgrade.

agentHints:
  - Only NODE_ENV is inlined by the production webpack build; SIGNUP_* keys are read at runtime, so
    setting them in the e2e harness is what reliably disables the gate regardless of serve mode.

sourceRepo: nestled-dev-template
