skipIf:
  - >-
    Part 1: the project's security pages send only fields its own schema has, under whatever names.
    The type fix in part 2 and the guards still apply.

verification:
  - pnpm exec nx typecheck web --skip-nx-cache
  - pnpm exec nx test web --skip-nx-cache
  - node --test scripts/apollo-operation-types.spec.mjs
  - pnpm exec nx build web --skip-nx-cache
  - >-
    Signed in, load /settings/security and /settings/security/events as documents (reload each):
    both answer 200 and list the latest events first.

agentHints:
  - >-
    The input type's name and fields differ per app. Look up the argument of the project's own
    security-events query in its api-schema.graphql before changing the loader: if it has an
    `orderBy`, keep it, and write the direction with the enum the generated SDK exports. Adjust the
    expected variables in security-events-variables.spec.ts to match.
  - >-
    Apply part 2 in this order: the declaration, the apollo-loader.ts line, then typecheck, then the
    type arguments. New type errors are real mismatches between what a page sends and what the
    project's API accepts: fix the variables. Do not cast them away, widen the type or add the type
    argument back. A required variable that is optional on the page needs a real check or `skip`.
  - >-
    Drop the type argument and its type import rather than adding the variables type as a second
    one: a document from the generated SDK carries both. A document built with `gql` in the page
    carries neither, so give that call both type arguments, or move the operation into the SDK.
  - >-
    The declaration needs no package.json or tsconfig change as long as apps/web/tsconfig.app.json
    includes `app/**/*.ts` (the template's always has, and the guard spec checks). Where the web app
    lives elsewhere, put the file inside that program and adjust the paths in both specs.
  - >-
    In scripts/apollo-operation-types.spec.mjs, add the project's own client folders to
    CLIENT_FOLDERS; a folder that does not exist is skipped.
  - >-
    The latest @apollo/client-integration-react-router (0.14.5-alpha.0 when this was written) still
    imports the missing path, so bumping it does not replace the declaration.
