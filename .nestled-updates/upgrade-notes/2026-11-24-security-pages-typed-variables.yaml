id: 2026-11-24-security-pages-typed-variables
title: >-
  The security settings pages failed on variables the API does not have, which typecheck could not
  see: loader queries were untyped, and one type argument leaves an operation's variables untyped
priority: high
area: web
type: correctness
delivery: code-patch
applyAfter:
  - 2026-11-19-mutation-errorpolicy-none
  - 2026-11-19-session-follow-ups
  - 2026-11-20-session-middleware
  - 2026-11-20-emulation-organization-reload-race
  - 2026-11-21-sonar-rebaseline-findings
  - 2026-11-24-session-starts-in-fresh-document
  - 2026-11-24-session-hardening-follow-ups

intent: >
  1. The loaders of apps/web/app/routes/settings/security.tsx and security.events.tsx sent
  `orderBy: 'createdAt', orderDirection: 'desc'`. The template's `SecurityEventPagingInput` has
  `take`, `skip` and `orderDirection` only, and the enum's GraphQL names are ASC and DESC, so both
  values were refused: a document load answered 500, and a client navigation showed
  `Field "orderBy" is not defined by type "SecurityEventPagingInput"`. Both are dropped; newest
  first is the API's default. apps/web/tests/routes/settings/security-events-variables.spec.ts runs
  both loaders and checks every variable against api-schema.graphql.


  2. Typecheck missed it for two reasons.


  First, `preloadQuery` was `any` in every loader. `@apollo/client-integration-react-router` types
  its loader arguments from 'react-router/route-module', a path React Router does not export, and
  an unresolved type is `any`. apps/web/app/react-router-route-module.d.ts declares the one type the
  package imports from there, and `apolloLoader` (libs/shared/apollo/src/lib/apollo-loader.ts) passes
  its argument type on: `handler<typeof args>()(loader)(args)`. No runtime change.


  Second, a call with one type argument, `preloadQuery<MySecurityEventsQuery>(...)` or
  `useMutation<LoginMutation>(...)`, types the result only: TypeScript does not infer the rest, so
  the variables fall back to any object. Every such call that passes variables (56 in the template)
  drops its type argument, and the generated document types both. Nothing else in the template
  turned out to be wrong.


  3. Two guards. apps/web/tests/apollo-loader-types.spec.ts fails `nx typecheck web` when
  `preloadQuery` is `any` again. scripts/apollo-operation-types.spec.mjs fails on an operation that
  passes variables with a single type argument, and when React Router starts exporting the path or
  the package stops importing it, since an ambient declaration would then hide the real types.

why: >
  /settings/security, where a user changes the password, sets up two-factor authentication and ends
  other sessions, did not load at all. The same gap hid any other wrong variable until a user met it.

