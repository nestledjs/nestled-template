id: 2026-07-25-pin-forms-core-exact-080
title: Pin @nestledjs/forms-core to exact 0.8.0 to satisfy data-browser's exact peer
priority: low
area: infra
type: deps
delivery: code-patch

intent: >
  Change the root package.json dependency `@nestledjs/forms-core` from `^0.8.0` to exact `0.8.0`.
  `@nestledjs/data-browser@1.0.18` declares exact peer deps `@nestledjs/forms-core: "0.8.0"` and
  `@nestledjs/forms: "0.8.0"`. `@nestledjs/forms` is already pinned exact; this aligns forms-core so
  a future 0.8.x publish cannot satisfy the caret range and then violate data-browser's exact peer,
  which would surface as install-time peer warnings/errors or subtle version skew.

why: >
  Not currently breaking — 0.8.0 is the only 0.8.x published, so `^0.8.0` resolves to 0.8.0 today.
  It is a latent trap: the moment forms-core 0.8.1 ships, `^0.8.0` drifts to it while data-browser
  still pins 0.8.0 exactly. Pinning now keeps the two in lockstep. Revisit the pin whenever
  forms-core and data-browser bump together. Found via Copilot review on mi-core PR #1518.

affectedPaths:
  - package.json
  - pnpm-lock.yaml

packageReleases: []

skipIf:
  - package.json already declares "@nestledjs/forms-core" as an exact version (no leading ^ or ~).

verification:
  - 'grep -n ''"@nestledjs/forms-core": "0.8.0"'' package.json'
  - pnpm install --lockfile-only

agentHints:
  - "Keep @nestledjs/forms-core and @nestledjs/forms pinned to the SAME exact version that the
    installed @nestledjs/data-browser lists in its peerDependencies. If a downstream project is on a
    different forms/data-browser generation, match that project's data-browser peer set instead of
    hardcoding 0.8.0. After editing package.json, run pnpm install so the lockfile specifier updates
    from a range to the exact version."
