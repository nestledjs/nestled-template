id: 2026-08-10-browser-safe-jwt-decode
title: Decode session JWTs without Buffer so duplicate-cookie selection works in the browser
priority: high
area: auth
type: correctness
delivery: code-patch

intent: >
  The client picks the newest of several session cookies by reading each token's issued-at claim.
  That decode ran through Buffer, which does not exist in a browser and is not polyfilled by the web
  bundle, so on the client it threw for every token. Decode through Buffer where it exists, through
  atob plus TextDecoder where both exist, and throw a clear error otherwise rather than guessing.
  Warn when nothing decodes and several cookies were offered, so the positional fallback stops being
  silent. Also reset the access-denied state on the whole navigation rather than on the pathname
  alone.

why: >
  The throw never surfaced. It was raised inside the per-token try/catch that exists to skip
  malformed tokens, so the loop finished with no candidate and returned the LAST cookie value
  instead. That is precisely the behaviour the selection logic was written to stop relying on:
  document.cookie orders cookies by path specificity, not by age, so the last value is frequently
  the stale one. The result was a client that silently authenticated with an expired or superseded
  token whenever duplicate session cookies existed - the exact situation the feature was added to
  handle - with nothing thrown, nothing logged, and a passing test suite, because the only coverage
  exercised the server path where Buffer does exist.

  The access-denied reset is smaller but the same shape: keying on pathname leaves the denial screen
  up across a navigation that changes only the query string, which is a different request that may
  well be permitted.

affectedPaths:
  - libs/shared/apollo/src/lib/apollo.ts
  - libs/shared/apollo/src/lib/apollo.spec.ts
  - apps/web/app/app.tsx

packageReleases: []

skipIf:
  - The project does not read session cookies in the browser.
  - The project already decodes JWT segments without relying on Buffer on the client.

verification:
  - pnpm exec nx test apollo
  - pnpm exec nx test web

agentHints:
  - >
    Check for Buffer used in code that reaches the browser bundle, not only in this function. Buffer
    is a Node global; bundlers do not provide it unless a polyfill is configured, and nothing here
    configures one.
  - >
    The decode must restore base64url padding before calling atob, which rejects unpadded input, and
    must translate the URL-safe alphabet: '-' to '+' and '_' to '/'. Skipping either silently
    produces wrong bytes rather than an error.
  - >
    Order the branches so the runtime that has a real decoder uses it. Prefer Buffer where it
    exists: modern Node also exposes atob, so guarding on atob first quietly routes server rendering
    down the browser path and leaves the Buffer branch dead while the docs still claim it is the SSR
    fallback. Require TextDecoder alongside atob rather than assuming it, and throw when neither
    pair is available instead of returning something plausible.
  - >
    When testing this, remove Buffer around the pure decode call only. Removing it around a live
    Apollo client leaves module-level state behind - the once-only service-unavailable flag - which
    breaks unrelated tests later in the same file and sends you looking for the wrong bug.
  - >
    Any catch that exists to skip malformed input will also swallow an environment error such as a
    missing global. Where a loop falls back to a default when nothing parses, confirm the fallback
    is defensible on its own, because it becomes the normal path the moment the parse breaks.
