id: 2026-11-09-sonar-rules-digest
title: >-
  A generated digest of the active SonarCloud TypeScript rules, linked from AGENTS.md
priority: low
area: docs
type: docs
delivery: code-patch

intent: >
  New `scripts/sonar-rules-digest.mjs` writes `docs/quality/sonar-rules.md` from
  `docs/quality/sonar-rules.json`, a committed copy of the active rules of the project's
  TypeScript quality profile. The digest lists each rule once with its severity and a link to its
  description, grouped as React/JSX/accessibility, tests, bugs, vulnerabilities and code smells,
  and leaves out rules tagged for frameworks the template does not use (the JSON's `excludeTags`:
  angular, vue, aws, gcp, cypress, mocha and so on), saying how many. Both files are formatted
  with the repository's Prettier.

  - `node scripts/sonar-rules-digest.mjs` regenerates the digest from the JSON, with no network.
  - `--check` exits 1 when the digest does not match the JSON; CI's `static` job runs it.
  - `--refresh` re-fetches the list: it reads `sonar.organization` and `sonar.projectKey` from
    sonar-project.properties, finds the project's `ts` quality profile through SonarCloud's
    `api/qualityprofiles/search` and pages `api/rules/search` (`activation=true`). A public
    organization answers anonymously; a private one needs `SONAR_TOKEN`. `SONAR_HOST_URL`
    overrides https://sonarcloud.io.

  `scripts/sonar-rules-digest.spec.mjs` covers the properties parser, the grouping, sorting and
  exclusion, the Markdown, the paged fetch (with a stubbed fetch) and the three modes. CI runs it
  with the other `node --test scripts/*.spec.mjs` specs.

  Root package.json, by hand (not mirrored by promotion): add
  `"sonar:rules-digest": "node scripts/sonar-rules-digest.mjs"` to `scripts`.

  AGENTS.md, by hand (not mirrored by promotion): in the "SonarQube Quality Expectations" section,
  link `docs/quality/sonar-rules.md`, say it is generated by `pnpm sonar:rules-digest` from the
  committed JSON (`--refresh` re-fetches it), and keep the hand-written list of the findings that
  come up most often.

why: >
  Agents and reviewers learned the Sonar rules from findings after the scan, one pull request at a
  time. A digest of the rules actually active on the project, on a path agents read, lets them
  avoid a finding before it is reported.

affectedPaths:
  - scripts/sonar-rules-digest.mjs
  - scripts/sonar-rules-digest.spec.mjs
  - docs/quality/sonar-rules.json
  - docs/quality/sonar-rules.md
  - package.json
  - AGENTS.md

skipIf:
  - The project does not use SonarCloud or SonarQube.

verification:
  - node scripts/sonar-rules-digest.mjs --refresh
  - node scripts/sonar-rules-digest.mjs --check
  - node --test scripts/sonar-rules-digest.spec.mjs
  - pnpm exec prettier --check docs/quality scripts

agentHints:
  - >
    Run `--refresh` in the project so the JSON is the project's own profile, not the template's.
    A private SonarCloud organization needs `SONAR_TOKEN` (a user token with Browse on the
    project). If no token is available, keep the template's JSON, regenerate, and say in the
    report that the list is the template's profile.
  - >
    If the project uses a framework in `excludeTags` (Vue, Angular, AWS SDK rules and so on),
    remove that tag from the JSON's `excludeTags` and regenerate.
  - >
    Add the CI check (`node scripts/sonar-rules-digest.mjs --check`) to the project's static
    checks if it did not take 2026-11-09-ci-parallel-jobs.
