sonar.projectKey=nestledjs_nestled-template2
sonar.organization=nestledjs

sonar.sourceEncoding=UTF-8
sonar.sources=\
  apps/api/src,\
  apps/web/app,\
  libs/api/config/src,\
  libs/api/core/data-access/src,\
  libs/api/core/feature/src,\
  libs/api/custom/src,\
  libs/api/integrations/src,\
  libs/api/prisma/src,\
  libs/api/utils/src,\
  libs/shared/apollo/src,\
  libs/shared/sdk/src,\
  libs/shared/styles/src,\
  libs/shared/utils/src,\
  libs/web/src,\
  libs/web-ui/src,\
  scripts
# Applied migration history is immutable and verified by PostgreSQL integration tests.
# Scope the existing migration exclusion to the actual Prisma migration directory.
sonar.exclusions=\
  **/node_modules/**,\
  **/.agents/**,\
  **/.claude/**,\
  **/.cursor/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/.git/**,\
  **/.nx/**,\
  **/generated/**,\
  **/prisma-generated/**,\
  apps/web/.react-router/**,\
  apps/web/build/**,\
  libs/shared/sdk/src/generated/**,\
  libs/shared/sdk/src/lib/database-models.ts,\
  libs/api/generated-crud/**,\
  libs/api/prisma/src/lib/migrations/**,\
  libs/api/prisma/src/lib/seed/seed-data/**,\
  **/vite.config.ts

sonar.cpd.exclusions=\
  libs/api/prisma/src/lib/seed/seed-data/**,\
  **/prisma-generated/**,\
  libs/shared/sdk/src/lib/database-models.ts,\
  apps/web/.react-router/**,\
  apps/web/build/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  scripts/**/*.spec.mjs,\
  **/vite.config.ts

# scripts/ holds the workspace scripts' node:test specs (*.spec.mjs). Without them listed as tests,
# SonarCloud analysed each spec as source code: its fixtures and stubs were reported as smells.
sonar.tests=apps,libs,scripts
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  scripts/**/*.spec.mjs

sonar.javascript.lcov.reportPaths=\
  coverage/apps/web/lcov.info,\
  coverage/libs/api/custom/lcov.info,\
  coverage/libs/api/config/lcov.info,\
  coverage/libs/api/core/data-access/lcov.info,\
  coverage/libs/api/integrations/lcov.info,\
  coverage/libs/api/utils/lcov.info,\
  coverage/apps/api-e2e/lcov.info,\
  coverage/libs/web-ui/lcov.info,\
  coverage/libs/web/lcov.info,\
  coverage/libs/shared/apollo/lcov.info,\
  coverage/libs/shared/utils/lcov.info,\
  coverage/libs/shared/sdk/lcov.info

sonar.coverage.exclusions=\
  libs/shared/sdk/src/generated/**,\
  libs/shared/sdk/src/lib/database-models.ts,\
  libs/api/generated-crud/**,\
  libs/api/prisma/src/lib/prisma-generated/**,\
  apps/web/.react-router/**,\
  apps/web/build/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.ts,\
  **/*.stories.tsx,\
  **/jest.config.ts,\
  **/jest.config.js,\
  **/vite.config.ts,\
  **/jest.setup.ts,\
  scripts/**,\
  apps/api-e2e/src/support/**,\
  apps/api/src/main.ts,\
  apps/web/app/app.tsx,\
  apps/web/app/components/ui/**,\
  apps/web/app/entry.server.tsx,\
  apps/web/app/routes/**,\
  apps/web/app/root.tsx,\
  apps/web/server.js,\
  **/*.controller.ts,\
  **/*.module.ts,\
  **/*.resolver.ts,\
  libs/api/core/feature/src/lib/api-core-feature.module.ts,\
  libs/api/core/data-access/src/lib/api-core-pub-sub.ts,\
  libs/api/core/models/src/lib/generate-models.ts,\
  libs/api/core/models/src/lib/models/**,\
  libs/api/custom/src/lib/plugins/auth/strategies/jwt.strategy.ts,\
  libs/api/custom/src/lib/plugins/billing/sync.service.ts,\
  libs/api/integrations/src/lib/email/providers/smtp.provider.ts,\
  libs/api/integrations/src/lib/sms/**,\
  libs/api/integrations/src/lib/storage/**,\
  libs/api/prisma/src/lib/seed/**,\
  libs/shared/apollo/src/lib/**,\
  libs/web/src/lib/components/**,\
  libs/web/src/lib/layouts/**,\
  libs/web/src/lib/modals/**,\
  libs/web-ui/src/lib/**,\
  libs/web-ui/setupTests.ts

# The TypeScript programs SonarCloud builds, named rather than discovered. Discovery takes every
# tsconfig*.json in the tree (solution configs, storybook, tools, the base), one program each, and a
# full analysis of a larger clone ran out of heap once scripts/tsconfig.json was added. A PR analysis
# only covers changed files and cannot show this. Changing the list can re-baseline existing issues
# on the long-lived branch, since files may be analysed with different type information.
sonar.typescript.tsconfigPaths=\
  apps/api/tsconfig.app.json,\
  apps/api-e2e/tsconfig.spec.json,\
  apps/api-e2e/tsconfig.support.json,\
  apps/web/tsconfig.app.json,\
  apps/web/tsconfig.spec.json,\
  libs/api/config/tsconfig.lib.json,\
  libs/api/config/tsconfig.spec.json,\
  libs/api/core/data-access/tsconfig.lib.json,\
  libs/api/core/data-access/tsconfig.spec.json,\
  libs/api/core/feature/tsconfig.lib.json,\
  libs/api/core/feature/tsconfig.spec.json,\
  libs/api/core/models/tsconfig.lib.json,\
  libs/api/core/models/tsconfig.spec.json,\
  libs/api/custom/tsconfig.lib.json,\
  libs/api/custom/tsconfig.spec.json,\
  libs/api/integrations/tsconfig.lib.json,\
  libs/api/integrations/tsconfig.spec.json,\
  libs/api/prisma/tsconfig.lib.json,\
  libs/api/prisma/tsconfig.spec.json,\
  libs/api/utils/tsconfig.lib.json,\
  libs/api/utils/tsconfig.spec.json,\
  libs/shared/apollo/tsconfig.lib.json,\
  libs/shared/apollo/tsconfig.spec.json,\
  libs/shared/sdk/tsconfig.lib.json,\
  libs/shared/sdk/tsconfig.spec.json,\
  libs/shared/styles/tsconfig.lib.json,\
  libs/shared/utils/tsconfig.lib.json,\
  libs/shared/utils/tsconfig.spec.json,\
  libs/web/tsconfig.lib.json,\
  libs/web/tsconfig.spec.json,\
  libs/web-ui/tsconfig.lib.json,\
  libs/web-ui/tsconfig.spec.json,\
  scripts/tsconfig.json
