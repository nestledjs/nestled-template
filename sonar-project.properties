# The TypeScript programs SonarCloud builds: two, written for it, rather than each project's own.
#
# This used to name every project's app, lib and spec config (plus the api-e2e support config and
# scripts/tsconfig.json). Those programs overlap almost entirely, because each one pulls in the
# source of every library it imports, and the analyser holds the whole list at once. Since
# SonarCloud's JS/TS analyser 14.6.0 that exhausts the Node heap in larger clones, and dropping the
# small programs does not help: the large ones are the overlap.
#
# sonar/tsconfig.api.json covers apps/api, apps/api-e2e, libs/api and scripts (Jest, CommonJS);
# sonar/tsconfig.web.json covers apps/web, libs/web, libs/web-ui, libs/shared and the api-e2e Vitest
# configs (Vitest, bundler resolution). They are for analysis only and nothing builds from them.
#
# A new project must be added to one of their "include" lists (or given a third config), or its
# files are analysed without type information; scripts/sonar-tsconfig-coverage.spec.mjs fails when
# a sonar.sources entry is in neither. Do not rely on discovery either: with this property unset,
# Sonar takes every tsconfig*.json in the tree, one program each, which is the same problem.
# Neither config sets `lib`, so both inherit tsconfig.base.json's: declaring a newer one makes Sonar
# suggest APIs the real build cannot type-check. A PR analysis only covers changed files and cannot
# show a heap problem; the main-branch scan after merge does. Changing these files can re-baseline
# existing issues on the long-lived branch, since files may be analysed with different type
# information.
sonar.typescript.tsconfigPaths=\
  sonar/tsconfig.api.json,\
  sonar/tsconfig.web.json
